<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vänner - Måttfull</title>
<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; background-color: #E5E9F0; color: #111; min-height: 100vh; }
nav { display: flex; flex-wrap: wrap; margin-bottom: 20px; border: 4px solid #2C3E50; box-shadow: 4px 4px 0px #2C3E50; background: #fff; }
nav::-webkit-scrollbar { display: none; }
nav a { flex: 1 1 120px; text-align: center; padding: 12px 10px; background: #fff; text-decoration: none; color: #2C3E50; font-weight: 900; text-transform: uppercase; border-right: 4px solid #2C3E50; font-size: 14px; }
nav a:last-child { border-right: none; }
nav a:hover, nav a.active { background: #FFCC00; }
.card { background: #FFFFFF; border: 4px solid #2C3E50; border-radius: 0; padding: 20px; margin-bottom: 20px; box-shadow: 6px 6px 0px #2C3E50; position: relative; }
h2 { font-family: 'Arial Black', sans-serif; text-transform: uppercase; color: #FFF; background: #2ECC71; margin: -20px -20px 20px -20px; padding: 15px; border-bottom: 4px solid #2C3E50; }
input, button { padding: 14px; margin: 8px 0; width: 100%; box-sizing: border-box; border: 4px solid #2C3E50; font-size: 16px; outline: none; font-weight: bold; }
input:focus { background: #f1f2f6; }
button { background: #FFCC00; color: #2C3E50; cursor: pointer; text-transform: uppercase; font-weight: 900; box-shadow: 4px 4px 0px #2C3E50; transition: all 0.1s; }
button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #2C3E50; }
button.magic { background: #2A8CFF; color: white; margin-top: 10px; }
ul { list-style: none; padding: 0; margin: 0; }
li { border-bottom: 4px solid #E5E9F0; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
li:last-child { border-bottom: none; }
.profile-img { width: 50px; height: 50px; border-radius: 0; object-fit: cover; border: 3px solid #2C3E50; background: #fff; }
.friend-info { flex: 1; margin-left: 15px; }
.view-toggle { display: flex; gap: 10px; flex-wrap: wrap; }
.view-toggle button { width: auto; flex: 1 1 140px; }
.hidden { display: none; }
.stat-pill { font-weight: 900; color: #2C3E50; }
</style>
</head>
<body>

<nav>
  <a href="../../../index.html">Log</a>
  <a href="../../battles/pages/battles.html">Battles</a>
  <a href="../../events/pages/events.html">Events</a>
  <a href="../../clans/pages/clans.html">Klan</a>
  <a href="../../friends/pages/friends.html" class="active">Vänner</a>
  <a href="../../wrapped/pages/wrapped.html">Wrapped</a>
  <a href="../../profile/pages/profile.html">Profil</a>
</nav>

<div class="card">
  <h2 style="background: #2A8CFF;">Lägg till Vän</h2>
  <div style="display: flex; gap: 10px;">
    <input type="text" id="friendHash" placeholder="#HASHKOD">
    <button onclick="addFriend()" class="magic" style="width: auto; margin: 8px 0;">SÖK</button>
  </div>
</div>

<div class="card">
  <h2 style="background: #9B59B6;">Valj vy</h2>
  <div class="view-toggle">
    <button onclick="setFriendsView('weekly')">Veckans leaderboard</button>
    <button onclick="setFriendsView('live')" style="background: #E74C3C; color: #FFF;">Live promille</button>
  </div>
</div>

<div class="card" id="weeklyView">
  <h2 style="background: #F39C12;">Veckans Leaderboard (cl)</h2>
  <ul id="weeklyLeaderboard"></ul>
</div>

<div class="card hidden" id="liveView">
  <h2 style="background: #E74C3C;">Live Promille</h2>
  <ul id="liveStats"></ul>
</div>

<div class="card">
  <h2>Hantera Vanner</h2>
  <ul id="friendsList"></ul>
</div>

<script src="../../shared/scripts/hash.js"></script>
<script src="../../shared/scripts/shared.js"></script>
<script src="../../shared/scripts/calculator.js"></script>
<script>
let myFriends = JSON.parse(localStorage.getItem('myFriendsHashes')) || [];
const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
let activeView = 'weekly';

function setFriendsView(view) {
  activeView = view;
  document.getElementById('weeklyView').classList.toggle('hidden', view !== 'weekly');
  document.getElementById('liveView').classList.toggle('hidden', view !== 'live');
  renderViews();
}

function getFriendEntries() {
  let globalData = getGlobalData();
  return myFriends
    .map(hash => ({ hash, profile: globalData.persons[hash] }))
    .filter(item => item.profile);
}

function getHistoryForProfile(profileId) {
  const allHistory = JSON.parse(localStorage.getItem('drinkHistory_all')) || {};
  return allHistory[profileId] || [];
}

function getWeeklyCl(profileId) {
  const since = Date.now() - WEEK_MS;
  const history = getHistoryForProfile(profileId);
  const grams = history.reduce((sum, item) => {
    if (item.grams > 0 && item.timestamp >= since) return sum + item.grams;
    return sum;
  }, 0);
  return calculateCl(grams);
}

function getLivePromille(profile) {
  const history = getHistoryForProfile(profile.id);
  if (!profile.weight || !profile.gender) return null;
  return calculateBACAtTime(history, profile, Date.now());
}

function renderWeeklyLeaderboard() {
  const list = document.getElementById('weeklyLeaderboard');
  list.innerHTML = '';
  const entries = getFriendEntries();
  if (entries.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#7f8c8d;">Inga vanner tillagda.</p>';
    return;
  }
  const ranked = entries
    .map(item => ({
      hash: item.hash,
      name: item.profile.name,
      pic: item.profile.pic,
      cl: getWeeklyCl(item.profile.id)
    }))
    .sort((a, b) => b.cl - a.cl);

  ranked.forEach((friend, index) => {
    const li = document.createElement('li');
    const img = document.createElement('img');
    img.className = 'profile-img';
    img.src = friend.pic || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232C3E50"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
    const info = document.createElement('div');
    info.className = 'friend-info';
    info.innerHTML = `<span style="font-size:1.1em; color:#2C3E50;">#${index + 1} ${friend.name}</span><br><span style="font-size:0.85em; color:#7f8c8d;">${friend.hash}</span>`;
    const stats = document.createElement('div');
    stats.className = 'stat-pill';
    stats.innerText = `${friend.cl.toFixed(1)} cl`;
    li.appendChild(img);
    li.appendChild(info);
    li.appendChild(stats);
    list.appendChild(li);
  });
}

function renderLiveStats() {
  const list = document.getElementById('liveStats');
  list.innerHTML = '';
  const entries = getFriendEntries();
  if (entries.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#7f8c8d;">Inga vanner tillagda.</p>';
    return;
  }
  entries.forEach(item => {
    const li = document.createElement('li');
    const img = document.createElement('img');
    img.className = 'profile-img';
    img.src = item.profile.pic || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232C3E50"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
    const info = document.createElement('div');
    info.className = 'friend-info';
    info.innerHTML = `<span style="font-size:1.1em; color:#2C3E50;">${item.profile.name}</span><br><span style="font-size:0.85em; color:#7f8c8d;">${item.hash}</span>`;
    const stats = document.createElement('div');
    stats.className = 'stat-pill';
    const promille = getLivePromille(item.profile);
    stats.innerText = promille === null ? '-- ‰' : `${promille.toFixed(2)} ‰`;
    li.appendChild(img);
    li.appendChild(info);
    li.appendChild(stats);
    list.appendChild(li);
  });
}

function renderViews() {
  if (activeView === 'weekly') {
    renderWeeklyLeaderboard();
  } else {
    renderLiveStats();
  }
}

function updateFriendsUI() {
  const list = document.getElementById('friendsList');
  list.innerHTML = '';
  
  if (myFriends.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#7f8c8d;">Inga vänner tillagda. Sök på deras Hashkod!</p>';
    return;
  }

  let globalData = getGlobalData();

  myFriends.forEach((hash, index) => {
    let friend = globalData.persons[hash];
    if(!friend) return;
    
    const li = document.createElement('li');
    
    const img = document.createElement('img');
    img.className = 'profile-img';
    img.src = friend.pic || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232C3E50"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
    
    const info = document.createElement('div');
    info.className = 'friend-info';
    info.innerHTML = `<span style="font-size:1.1em; color:#2C3E50;">${friend.name}</span><br><span style="font-size:0.8em; color:#7f8c8d;">Hash: ${hash}</span>`;

    const delBtn = document.createElement('button');
    delBtn.innerText = "X";
    delBtn.style.cssText = "background: #E74C3C; color: white; width: auto; padding: 5px 10px; font-size: 12px; box-shadow: 2px 2px 0px #2C3E50;";
    delBtn.onclick = () => {
      myFriends.splice(index, 1);
      localStorage.setItem('myFriendsHashes', JSON.stringify(myFriends));
      updateFriendsUI();
    };

    li.appendChild(img);
    li.appendChild(info);
    li.appendChild(delBtn);
    list.appendChild(li);
  });

  renderViews();
}

function addFriend() {
  const hash = document.getElementById('friendHash').value.trim();
  if(!hash) return;
  
  let globalData = getGlobalData();
  
  if(globalData.persons[hash] && !myFriends.includes(hash)) {
    myFriends.push(hash);
    localStorage.setItem('myFriendsHashes', JSON.stringify(myFriends));
    document.getElementById('friendHash').value = '';
    updateFriendsUI();
  } else {
    alert("Kunde inte hitta en krigare med den hashen!");
  }
}

updateFriendsUI();
renderViews();
setInterval(() => {
  if (activeView === 'live') {
    renderLiveStats();
  }
}, 60000);
</script>
</body>
</html>
