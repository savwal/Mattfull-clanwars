<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plupfull - Wrapped</title>
<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; background-color: #E5E9F0; color: #111; min-height: 100vh; }
nav { display: flex; gap: 0; margin-bottom: 20px; border: 4px solid #2C3E50; box-shadow: 4px 4px 0px #2C3E50; background: #fff; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
nav::-webkit-scrollbar { display: none; }
nav a { flex: 0 0 auto; text-align: center; padding: 12px 20px; background: #fff; text-decoration: none; color: #2C3E50; font-weight: 900; text-transform: uppercase; border-right: 4px solid #2C3E50; font-size: 14px; }
nav a:last-child { border-right: none; }
nav a:hover, nav a.active { background: #FFCC00; }
.card { background: #FFFFFF; border: 4px solid #2C3E50; border-radius: 0; padding: 20px; margin-bottom: 20px; box-shadow: 6px 6px 0px #2C3E50; position: relative; text-align: center; }
h2 { font-family: 'Arial Black', sans-serif; text-transform: uppercase; color: #FFF; background: #9B59B6; margin: -20px -20px 20px -20px; padding: 15px; border-bottom: 4px solid #2C3E50; }
button { padding: 14px; margin: 15px 0; width: 100%; box-sizing: border-box; border-radius: 0; border: 4px solid #2C3E50; font-size: 16px; outline: none; font-weight: bold; background: #FFCC00; color: #2C3E50; cursor: pointer; text-transform: uppercase; box-shadow: 4px 4px 0px #2C3E50; transition: all 0.1s; }
button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #2C3E50; }
.modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
.modal-content { background-color: #9B59B6; color: white; margin: 20% auto; padding: 25px; border: 6px solid #2C3E50; box-shadow: 8px 8px 0px #2C3E50; border-radius: 0; width: 90%; max-width: 400px; text-align: center; position: relative; }
.close-modal { color: #FFCC00; font-size: 36px; font-weight: bold; cursor: pointer; position: absolute; right: 15px; top: 5px; }
.stat-box { background: #FFF; color: #2C3E50; border: 4px solid #2C3E50; padding: 15px; margin: 15px 0; font-weight: 900; font-size: 1.2em; box-shadow: 4px 4px 0px #2C3E50; }
</style>
</head>
<body>
<nav>
  <a href="index.html">Krog</a>
  <a href="battles.html">Battles</a>
  <a href="clans.html">Klan</a>
  <a href="friends.html">Vänner</a>
  <a href="wrapped.html" class="active">Wrapped</a>
  <a href="profile.html">Profil</a>
  <a href="rankings.html">Ranked</a>
</nav>
<div class="card">
  <h2>Plupfull Wrapped</h2>
  <p style="font-weight: bold; color: #2C3E50;">Släpps den 24:e varje månad!</p>
  <button onclick="openWrapped('monthly')">Se Månadens Wrapped</button>
  <button onclick="openWrapped('yearly')" style="background: #E74C3C; color: #FFF;">Se Årets Wrapped</button>
</div>
<div id="wrappedModal" class="modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeWrapped()">&times;</span>
    <h1 id="wrappedTitle" style="font-family: 'Arial Black'; text-transform: uppercase; margin-top: 0;"></h1>
    <div class="stat-box">
      Total Konsumtion:<br>
      <span id="wrappedGrams" style="color: #E74C3C; font-size: 1.5em;">0cl</span>
    </div>
    <div class="stat-box">
      Klan Poäng:<br>
      <span id="wrappedElo" style="color: #2ECC71; font-size: 1.5em;">0.00 ‰</span>
    </div>
    <div class="stat-box">
      Öl/Cider: <span id="wrappedBeer" style="color: #F39C12;">0</span> st<br>
      Vin: <span id="wrappedWine" style="color: #8E44AD;">0</span> st<br>
      Sprit/Drinkar: <span id="wrappedSprit" style="color: #3498DB;">0</span> st
    </div>
    <button onclick="closeWrapped()" style="background: #FFCC00; color: #2C3E50;">Dela Resultat</button>
  </div>
</div>
<script src="shared.js"></script>
<script src="wrappedLogic.js"></script>
</body>
</html>
