<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Main - Måttfull</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.1.0"></script>
<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; background-color: #E5E9F0; color: #111; min-height: 100vh; }
nav { display: flex; gap: 0; margin-bottom: 20px; justify-content: center; border: 4px solid #2C3E50; box-shadow: 4px 4px 0px #2C3E50; background: #fff; }
nav a { flex: 1; text-align: center; padding: 12px 5px; background: #fff; text-decoration: none; color: #2C3E50; font-weight: 900; text-transform: uppercase; border-right: 4px solid #2C3E50; font-size: 14px; }
nav a:last-child { border-right: none; }
nav a:hover, nav a.active { background: #FFCC00; }
.card { background: #FFFFFF; border: 4px solid #2C3E50; border-radius: 0; padding: 20px; margin-bottom: 20px; box-shadow: 6px 6px 0px #2C3E50; position: relative; }
h2 { font-family: 'Arial Black', Impact, sans-serif; text-transform: uppercase; color: #FFF; background: #2A8CFF; margin: -20px -20px 20px -20px; padding: 15px; border-bottom: 4px solid #2C3E50; letter-spacing: 1px; text-shadow: 2px 2px 0px #2C3E50; }
input, select, button { padding: 14px; margin: 8px 0; width: 100%; box-sizing: border-box; border-radius: 0; border: 4px solid #2C3E50; font-size: 16px; outline: none; font-weight: bold; }
input:focus, select:focus { background: #f1f2f6; }
button { background: #FFCC00; color: #2C3E50; cursor: pointer; text-transform: uppercase; font-weight: 900; box-shadow: 4px 4px 0px #2C3E50; transition: all 0.1s; }
button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #2C3E50; }
button.danger { background: #E74C3C; width: auto; color: white; padding: 8px 16px; font-size: 14px; margin-left: 10px; box-shadow: 3px 3px 0px #2C3E50; border: 3px solid #2C3E50; }
button.magic { background: #9B59B6; color: white; margin-top: 15px; }
ul { list-style: none; padding: 0; margin: 0; }
li { border-bottom: 4px solid #E5E9F0; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
canvas { width: 100% !important; max-height: 300px; margin-top: 10px; }
.highlight-text { font-size: 1.3em; color: #2A8CFF; font-family: 'Arial Black', sans-serif; text-shadow: 1px 1px 0px #2C3E50; }
.legend { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; justify-content: center; }
.legend-item { display: flex; align-items: center; gap: 8px; font-weight: 900; color: #2C3E50; text-transform: uppercase; font-size: 11px; }
.dot { width: 16px; height: 16px; border: 3px solid #2C3E50; box-shadow: 2px 2px 0px #2C3E50; }
.dot.red { background: #E74C3C; }
.dot.green { background: #2ECC71; }
.dot.purple { background: #9B59B6; }
.dot.line { background: #FFCC00; height: 6px; width: 20px; }
.modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
.modal-content { background-color: #2A8CFF; color: white; margin: 10% auto; padding: 25px; border: 6px solid #2C3E50; box-shadow: 8px 8px 0px #2C3E50; border-radius: 0; width: 90%; max-width: 600px; text-align: center; }
.close-modal { color: #E74C3C; font-size: 32px; font-weight: bold; cursor: pointer; position: absolute; right: 15px; top: 10px; }
.close-modal:hover { color: #FFF; }
.logger-tile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; background-color: #D1EAFE; padding: 20px; border: 4px solid #2C3E50; box-shadow: 4px 4px 0px #2C3E50; }
.logger-tile { border: 4px solid #2C3E50; background: #FFF; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: space-around; cursor: pointer; transition: transform 0.1s; color: #2C3E50; font-weight: bold; text-align: center; box-shadow: 4px 4px 0px #2C3E50; min-height: 80px;}
.logger-tile:last-child:nth-child(odd) { grid-column: span 2; }
.logger-tile:hover { background-color: #FFCC00; }
.logger-tile:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #2C3E50; }
.logger-icon { max-height: 50px; width: auto; margin-bottom: 10px; }
.logger-text { font-size: 1.1em; font-weight: 800; text-transform: uppercase; }
.logger-back-btn { background: #FFCC00; color: #2C3E50; padding: 10px 15px; border: 4px solid #2C3E50; font-weight: bold; text-transform: uppercase; margin-bottom: 15px; box-shadow: 4px 4px 0px #2C3E50; width: auto; font-size: 14px; }
.logger-list { list-style: none; padding: 0; text-align: left; background-color: #fff; border: 4px solid #2C3E50; box-shadow: 4px 4px 0px #2C3E50; }
.logger-list-item { padding: 15px; border-bottom: 4px solid #D1EAFE; cursor: pointer; color: #2C3E50; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
.logger-list-item:last-child { border-bottom: none; }
.logger-list-item:hover { background-color: #FFCC00; }
.logger-drink-info { font-size: 0.9em; color: #636e72; font-weight: bold; }
.logger-drink-stats { text-align: right; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="active">Krog</a>
  <a href="battles.html">Battles</a>
  <a href="profile.html">Profil</a>
  <a href="rankings.html">Ranked</a>
</nav>

<div class="card">
  <h2>Lägret</h2>
  <button onclick="openDrinkModal()" style="background: linear-gradient(135deg, #FFCC00, #FFD700); margin-bottom: 15px; ">Registrera Dryck (Snabbval)</button>
  <p style="text-align: center; font-weight: bold; color: #2C3E50; margin: 10px 0;">Eller manuellt:</p>
  <input type="text" id="name" placeholder="Dryck (t.ex. Öl, Vin)">
  <input type="number" id="volume" placeholder="Volym (ml, t.ex. 330)">
  <input type="number" id="abv" placeholder="Alkoholhalt (%, t.ex. 5.0)">
  <button onclick="addDrink()">Manuellt registrera</button>
  <button class="magic" onclick="gragasUlt()">Gragas Ult (Ångra senaste 30 min)</button>
</div>

<div class="card" style="display: flex; align-items: center; gap: 15px;">
  <img id="userPic" style="width: 70px; height: 70px; border-radius: 0; border: 4px solid #2C3E50; display: none; object-fit: cover;">
  <div>
    <h3 style="margin:0; background:none; color:#2C3E50; text-shadow:none; padding:0; border:none;">STATS</h3>
    <p style="margin: 5px 0 0 0; font-weight:bold;">Totalt intag: <strong class="highlight-text"><span id="totalGrams">0</span> g</strong> ren alkohol</p>
    <p style="margin: 5px 0 0 0; font-weight:bold;">Uppskattad promille: <strong class="highlight-text"><span id="promille">0.00</span> ‰</strong></p>
  </div>
</div>

<div class="card">
  <h2>Stridslogg</h2>
  <ul id="history"></ul>
</div>

<div class="card">
  <h2>Blodflöde</h2>
  <canvas id="promilleChart"></canvas>
  <div class="legend">
    <div class="legend-item"><span class="dot line"></span> Promille</div>
    <div class="legend-item"><span class="dot red"></span> Under Funzone</div>
    <div class="legend-item"><span class="dot green"></span> Funzone</div>
    <div class="legend-item"><span class="dot purple"></span> Psykoszonen</div>
  </div>
</div>

<div id="drinkModal" class="modal">
  <div class="modal-content card" style="position: relative; text-align: left; ">
    <span class="close-modal" onclick="closeDrinkModal()">&times;</span>
    <h2 style="font-family: 'Arial Black'; color: #FFF; background: #2C3E50; margin: -25px -25px 20px -25px; padding: 15px; border-bottom: 4px solid #0984E3;">Snabbvals-Registrering</h2>
    <div id="modalContentContainer" class="logger-tile-grid"></div>
  </div>
</div>

<script src="shared.js"></script>
<script src="calculator.js"></script>
<script src="graph.js"></script>
<script src="drinkLogger.js"></script>
<script>
function openDrinkModal() {
  document.getElementById('drinkModal').style.display = 'block';
  renderCategoryTiles('modalContentContainer'); 
}

let historyData = getDrinkHistory();

function addDrink() {
  const name = document.getElementById('name').value;
  const volume = parseFloat(document.getElementById('volume').value);
  const abv = parseFloat(document.getElementById('abv').value);
  if (!name || isNaN(volume) || isNaN(abv)) return;
  const grams = parseFloat((volume * (abv / 100) * 0.789).toFixed(1));
  saveEntry(name, volume, abv, grams);
}

function gragasUlt() {
  const now = Date.now();
  const limit = now - 30 * 60000;
  let sum = 0;
  historyData.forEach(item => {
    if (item.timestamp >= limit && item.grams > 0) {
      sum += item.grams;
    }
  });
  if (sum > 0) {
    saveEntry("Gragas Ult", 0, 0, -parseFloat(sum.toFixed(1)));
  }
}

function saveEntry(name, volume, abv, grams) {
  const now = new Date();
  const time = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  historyData.push({ name, volume, abv, grams, time, timestamp: now.getTime() });
  saveDrinkHistory(historyData);
  document.getElementById('name').value = '';
  document.getElementById('volume').value = '';
  document.getElementById('abv').value = '';
  updateUI();
}

function updateUI() {
  const list = document.getElementById('history');
  list.innerHTML = '';
  let total = 0;
  const profile = getActiveProfile();
  
  if (profile.pic) {
    document.getElementById('userPic').src = profile.pic;
    document.getElementById('userPic').style.display = 'block';
  }

  historyData.forEach((item, index) => {
    total += item.grams;
    const li = document.createElement('li');
    li.innerHTML = `<div><strong>${item.time}</strong>: ${item.name} <br><span style="color:#2C3E50;">${item.grams > 0 ? '+' : ''}${item.grams.toFixed(1)}g alkohol</span></div>`;
    const btn = document.createElement('button');
    btn.className = 'danger';
    btn.textContent = "X";
    btn.onclick = () => removeDrink(index);
    li.appendChild(btn);
    list.appendChild(li);
  });
  
  if (total < 0) total = 0;
  
  const currentBAC = calculateBACAtTime(historyData, profile, Date.now()).toFixed(2);
  document.getElementById('totalGrams').textContent = total.toFixed(1);
  document.getElementById('promille').textContent = currentBAC;

  const labels = [];
  const dataPoints = [];
  
  if (historyData.length > 0) {
    const firstTime = new Date(historyData[0].timestamp).getTime();
    const endTime = Date.now() + (3600000 * 2); 
    for (let t = firstTime; t <= endTime; t += 900000) {
      labels.push(new Date(t).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
      dataPoints.push(calculateBACAtTime(historyData, profile, t).toFixed(2));
    }
  }

  renderChart('promilleChart', labels, dataPoints, getZones(profile));
}

function removeDrink(index) {
  historyData.splice(index, 1);
  saveDrinkHistory(historyData);
  updateUI();
}

updateUI();
setInterval(updateUI, 60000);
</script>
</body>
</html>
