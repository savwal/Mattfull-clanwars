<script>
let allHistory = [];
let events = [];
const currentYear = new Date().getFullYear();

document.addEventListener("DOMContentLoaded", () => {
  loadHistoryData();
  generateTabs();
});

function loadHistoryData() {
  allHistory = getDrinkHistory();
  
  // Create a map of dates to entries
  const dateMap = {};
  allHistory.forEach(entry => {
    const date = new Date(entry.timestamp);
    const dateStr = date.toLocaleDateString('sv-SE');
    if (!dateMap[dateStr]) {
      dateMap[dateStr] = [];
    }
    dateMap[dateStr].push(entry);
  });
  
  return dateMap;
}

function generateTabs() {
  const dateMap = loadHistoryData();
  const tabsContainer = document.getElementById('tabsContainer');
  const dayContent = document.getElementById('dayContent');
  
  // Sort dates and create tabs
  const sortedDates = Object.keys(dateMap).sort().reverse(); // Most recent first
  
  if (sortedDates.length === 0) {
    dayContent.innerHTML = '<p style="text-align: center; color: #2C3E50; font-weight: bold;">Ingen drinkhistorik än.</p>';
    return;
  }
  
  sortedDates.forEach((dateStr, index) => {
    const date = new Date(dateStr + 'T00:00:00');
    const dayEntries = dateMap[dateStr];
    
    // Determine label: date only for regular days
    const displayLabel = date.toLocaleDateString('sv-SE');
    
    const tabBtn = document.createElement('button');
    tabBtn.className = 'tab-btn' + (index === 0 ? ' active' : '');
    tabBtn.textContent = displayLabel;
    tabBtn.onclick = () => selectTab(dateStr);
    tabsContainer.appendChild(tabBtn);
    
    // Create content for this day
    const dayDiv = document.createElement('div');
    dayDiv.className = 'day-content' + (index === 0 ? ' active' : '');
    dayDiv.id = 'day-' + dateStr;
    
    let totalGrams = 0;
    dayEntries.forEach(entry => {
      totalGrams += entry.grams;
    });
    
    const profile = getActiveProfile();
    let dayHtml = '<div class="day-stats">';
    dayHtml += `<p>Datum: <strong>${displayLabel}</strong></p>`;
    dayHtml += `<p>Totalt intag: <strong>${Math.abs(calculateCl(totalGrams)).toFixed(1)} cl alkohol</strong></p>`;
    dayHtml += '</div>';
    
    dayHtml += '<h3 style="margin-top: 20px; font-weight: bold; color: #2C3E50;">Drycker denna dag:</h3>';
    dayHtml += '<ul class="day-list">';
    dayEntries.reverse().forEach(entry => {
      const time = new Date(entry.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      const clValue = calculateCl(entry.grams);
      dayHtml += `<li><div><strong>${time}</strong>: ${entry.name}</div><div>${Math.abs(clValue).toFixed(1)}cl</div></li>`;
    });
    dayHtml += '</ul>';
    
    // Add chart for this day
    dayHtml += '<h3 style="margin-top: 20px; font-weight: bold; color: #2C3E50;">Promillegraf denna dag:</h3>';
    dayHtml += '<div class="graph-scroll"><canvas id="chart-' + dateStr.replace(/\//g, '-') + '"></canvas></div>';
    
    dayDiv.innerHTML = dayHtml;
    dayContent.appendChild(dayDiv);
    
    // Render chart after a brief delay to ensure canvas is ready
    setTimeout(() => {
      renderDayChart(dateStr, dayEntries, profile);
    }, 100);
  });
}

function selectTab(dateStr) {
  // Hide all day contents
  document.querySelectorAll('.day-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  
  // Show selected day content
  document.getElementById('day-' + dateStr).classList.add('active');
  event.target.classList.add('active');
}

function renderDayChart(dateStr, dayEntries, profile) {
  const canvasId = 'chart-' + dateStr.replace(/\//g, '-');
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  
  const startDate = new Date(dateStr + 'T00:00:00');
  const endDate = new Date(startDate.getTime() + 24 * 60 * 60 * 1000);
  
  const labels = [];
  const dataPoints = [];
  
  // Generate hourly data points
  for (let t = startDate.getTime(); t <= endDate.getTime(); t += 3600000) {
    const time = new Date(t);
    const label = time.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    const bac = calculateBACAtTime(dayEntries, profile, t);
    labels.push(label);
    dataPoints.push(bac.toFixed(2));
  }
  
  renderChart(canvasId, labels, dataPoints, getZones(profile), { currentLabel: null });
}
</script>
