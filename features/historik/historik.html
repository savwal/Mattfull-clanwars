ul { list-style: none; padding: 0; margin: 0; text-align: left; }

.modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }

#historicalLogsModal .modal-content {

  overflow: hidden;
  padding: 0;
}

#historicalLogsModal .hist-modal-body {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;

  padding: 16px 20px calc(28px + env(safe-area-inset-bottom)) 20px;

#historicalLogsModal .close-modal { top: 8px; z-index: 1; }
.close-modal { color: #FFF; font-size: 28px; font-weight: bold; cursor: pointer; position: absolute; right: 15px; top: 10px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.drink-log-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; }

.drink-log-cl { display: inline-flex; align-items: center; padding: 4px 8px; border: 1px solid rgba(44,62,80,0.12); border-radius: 8px; background: #FFCC00; color: #2C3E50; font-weight: 900; box-shadow: 0 1px 4px rgba(44,62,80,0.10); white-space: nowrap; flex: 0 0 auto; }
