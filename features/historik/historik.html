body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; background-color: #E5E9F0; color: #111; min-height: 100vh; }
.main-nav { display: flex; flex-wrap: wrap; margin-bottom: 20px; border: 4px solid #2C3E50; box-shadow: 4px 4px 0px #2C3E50; background: #fff; }
.main-nav::-webkit-scrollbar { display: none; }
.main-nav a { flex: 1 1 140px; text-align: center; padding: 12px 10px; background: #fff; text-decoration: none; color: #2C3E50; font-weight: 900; text-transform: uppercase; border-right: 4px solid #2C3E50; font-size: 12px; }
.main-nav a:last-child { border-right: none; }
.main-nav a:hover, .main-nav a.active { background: #FFCC00; }
.card { background: #FFFFFF; border: 4px solid #2C3E50; border-radius: 0; padding: 20px; margin-bottom: 20px; box-shadow: 6px 6px 0px #2C3E50; position: relative; text-align: center; }
h2 { font-family: 'Arial Black', sans-serif; text-transform: uppercase; color: #FFF; background: #9B59B6; margin: -20px -20px 20px -20px; padding: 15px; border-bottom: 4px solid #2C3E50; text-align: left; }
button { padding: 14px; margin: 15px 0; width: 100%; box-sizing: border-box; border-radius: 0; border: 4px solid #2C3E50; font-size: 16px; outline: none; font-weight: bold; background: #FFCC00; color: #2C3E50; cursor: pointer; text-transform: uppercase; box-shadow: 4px 4px 0px #2C3E50; transition: all 0.1s; }
button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #2C3E50; }
.tab-button { background: #FFCC00; color: #2C3E50; padding: 14px 15px; margin: 5px 0 15px 0; border: 3px solid #2C3E50; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 14px; white-space: nowrap; box-shadow: 2px 2px 0px #2C3E50; transition: all 0.1s; width: 100%; }
.tab-button:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #2C3E50; }
.tab-button.active { background: #FFCC00; }
.event-meta { font-weight: 900; color: #2C3E50; }
ul { list-style: none; padding: 0; margin: 0; text-align: left; }
li { border-bottom: 4px solid #E5E9F0; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #2C3E50; }
li:last-child { border-bottom: none; }
/* z-index sits above the mobile bottom menu (z-index 1100) so the popup is
   placed over the menu bar and its full list can be scrolled to the end. */
.modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.6); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
.modal-content { background-color: #FFFFFF; color: #2C3E50; margin: 20% auto; padding: 20px; border: 6px solid #2C3E50; box-shadow: 8px 8px 0px #2C3E50; border-radius: 0; width: 90%; max-width: 520px; text-align: center; position: relative; }
/* The drink-log popup scrolls internally; the extra bottom padding lets the last
   item clear the menu/safe-area, and the touch scrolling gives an iOS rubberband
   bounce at the end of the list. */
#historicalLogsModal .modal-content {
  max-height: calc(100vh - 24px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding-bottom: calc(28px + env(safe-area-inset-bottom));
}
.close-modal { color: #E74C3C; font-size: 32px; font-weight: bold; cursor: pointer; position: absolute; right: 15px; top: 10px; }
.drink-log-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.drink-log-info { text-align: left; }
.drink-log-name { display: block; font-size: 1.05em; color: #2C3E50; }
.drink-log-sub { display: block; font-size: 0.85em; color: #5a6570; }
.drink-log-cl { font-weight: 900; color: #2C3E50; white-space: nowrap; }
#historicalLogsList { padding-bottom: 8px; }

<div class="card">
  <h2>Historik</h2>
  <p style="font-weight: bold; color: #2C3E50;">Välj en vy för din historik.</p>
  <button type="button" class="tab-button active" onclick="openHistoricalLogsPopup()">Historiska Loggar</button>
  <button class="tab-button" onclick="showTab('wrapped', this)">Wrapped</button>

<script>
function showTab(tabName, element) {
  document.getElementById('historiskalogar-tab').style.display = 'none';
  document.getElementById('wrapped-tab').style.display = 'none';

  document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
  if (element) element.classList.add('active');

  if (tabName === 'historiskalogar') {
    document.getElementById('historiskalogar-tab').style.display = 'block';
  } else if (tabName === 'wrapped') {
    document.getElementById('wrapped-tab').style.display = 'block';
  }
}

showTab('historiskalogar', document.querySelector('.tab-button.active'));
</script>
