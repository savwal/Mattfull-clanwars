<script>
function showTab(tabName, element) {
  document.getElementById('historiskalogar-tab').style.display = 'none';
  document.getElementById('pastevents-tab').style.display = 'none';
  document.getElementById('wrapped-tab').style.display = 'none';
  
  document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
  if (element) element.classList.add('active');

  if (tabName === 'historiskalogar') {
    document.getElementById('historiskalogar-tab').style.display = 'block';
    loadAllLogs();
  } else if (tabName === 'pastevents') {
    document.getElementById('pastevents-tab').style.display = 'block';
    loadPastEvents();
  } else if (tabName === 'wrapped') {
    document.getElementById('wrapped-tab').style.display = 'block';
  }
}

let pastEventsData = [];

function openPastEventsModal() {
  const modal = document.getElementById('pastEventsModal');
  if (modal) modal.style.display = 'block';
}

function closePastEventsModal() {
  const modal = document.getElementById('pastEventsModal');
  if (modal) modal.style.display = 'none';
}

function loadAllLogs() {
  const profile = getActiveProfile();
  if (!profile) {
    document.getElementById('noLogsMessage').style.display = 'block';
    return;
  }

  if (sb) {
    sb.from('drink_logs')
      .select('*')
      .eq('player_hash', profile.id)
      .order('consumed_at', { ascending: false })
      .then(({ data, error }) => {
        const listContainer = document.getElementById('allLogsHistory');
        const noLogsMessage = document.getElementById('noLogsMessage');
        
        listContainer.innerHTML = '';
        
        if (error || !data || data.length === 0) {
          noLogsMessage.style.display = 'block';
          return;
        }
        
        noLogsMessage.style.display = 'none';
        
        data.forEach(item => {
          const li = document.createElement('li');
          const grams = Number.isFinite(item.grams_alcohol)
            ? item.grams_alcohol
            : parseFloat((item.volume_ml * (item.abv / 100) * 0.789).toFixed(1));
          const clValue = calculateCl(grams);
          const timestamp = new Date(item.consumed_at);
          const dateLabel = timestamp.toLocaleDateString();
          const timeLabel = timestamp.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          li.innerHTML = `<div><strong>${dateLabel} ${timeLabel}</strong></div><div>${clValue > 0 ? '+' : ''}${clValue.toFixed(1)}cl</div>`;
          listContainer.appendChild(li);
        });
      });
  } else {
    document.getElementById('noLogsMessage').style.display = 'block';
  }
}

async function loadPastEvents() {
  if (!sb) return;
  const profile = getActiveProfile();
  if (!profile) return;
  
  const listContainer = document.getElementById('pastEventsList');
  const noEventsMessage = document.getElementById('noEventsMessage');
  const now = new Date();
  const minDate = new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000);
  
  listContainer.innerHTML = '';
  
  try {
    const pastEvents = await getPastPresetEvents(minDate, now);
    if (!pastEvents || pastEvents.length === 0) {
      noEventsMessage.style.display = 'block';
      closePastEventsModal();
      return;
    }
    
    noEventsMessage.style.display = 'none';

    const { data: drinks } = await sb.from('drink_logs')
      .select('player_hash, grams_alcohol, volume_ml, abv, consumed_at, drink_name')
      .eq('player_hash', profile.id)
      .gte('consumed_at', minDate.toISOString())
      .lte('consumed_at', now.toISOString())
      .order('consumed_at', { ascending: false });

    pastEventsData = pastEvents.map(evt => {
      const drinksDuringEvent = (drinks || []).filter(d => {
        const ts = new Date(d.consumed_at).getTime();
        return ts >= evt.start.getTime() && ts <= evt.end.getTime();
      });
      return {
        key: evt.key,
        name: evt.name,
        city: evt.city,
        start: evt.start,
        end: evt.end,
        drinks: drinksDuringEvent
      };
    });

    renderPastEventsSelect();
    if (pastEventsData.length > 0) {
      openPastEventsModal();
    }
  } catch (error) {
    noEventsMessage.style.display = 'block';
    closePastEventsModal();
  }
}

function renderPastEventsSelect() {
  const select = document.getElementById('pastEventsSelect');
  const meta = document.getElementById('pastEventMeta');
  const list = document.getElementById('pastEventsList');
  if (!select || !meta || !list) return;

  select.innerHTML = '';
  pastEventsData.forEach(evt => {
    const opt = document.createElement('option');
    opt.value = evt.key;
    opt.textContent = `${evt.name} (${formatRange(evt.start, evt.end)})`;
    select.appendChild(opt);
  });

  select.onchange = () => renderPastEventDrinks(select.value);
  if (pastEventsData.length > 0) {
    select.selectedIndex = 0;
    renderPastEventDrinks(pastEventsData[0].key);
  } else {
    meta.textContent = '';
    list.innerHTML = '';
  }
}

function renderPastEventDrinks(eventKey) {
  const meta = document.getElementById('pastEventMeta');
  const list = document.getElementById('pastEventsList');
  const eventData = pastEventsData.find(evt => evt.key === eventKey);
  if (!meta || !list || !eventData) return;

  meta.textContent = `${eventData.name} - ${eventData.city} (${formatRange(eventData.start, eventData.end)})`;
  list.innerHTML = '';

  if (!eventData.drinks || eventData.drinks.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#7f8c8d;">Inga drycker registrerade under detta event.</p>';
    return;
  }

  let totalGrams = 0;
  eventData.drinks.forEach(drink => {
    totalGrams += Number.isFinite(drink.grams_alcohol)
      ? drink.grams_alcohol
      : parseFloat((drink.volume_ml * (drink.abv / 100) * 0.789).toFixed(1));
  });

  const totalLi = document.createElement('li');
  totalLi.style.display = 'block';
  totalLi.innerHTML = `<div style="font-weight: bold;">Totalt intag</div><div>${calculateCl(totalGrams).toFixed(1)} cl</div>`;
  list.appendChild(totalLi);

  eventData.drinks.forEach(drink => {
    const grams = Number.isFinite(drink.grams_alcohol)
      ? drink.grams_alcohol
      : parseFloat((drink.volume_ml * (drink.abv / 100) * 0.789).toFixed(1));
    const clValue = calculateCl(grams);
    const timestamp = new Date(drink.consumed_at);
    const timeLabel = timestamp.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    const li = document.createElement('li');
    li.innerHTML = `<div><strong>${timeLabel}</strong></div><div>${clValue > 0 ? '+' : ''}${clValue.toFixed(1)}cl</div>`;
    list.appendChild(li);
  });
}

function getPresetEvents(year) {
  const midsummer = getMidsummerEve(year);
  return [
    { id: 'lundakarnevalen', name: 'Lundakarnevalen (Lund)', city: 'Lund', start: dateAt(year, 5, 22), end: dateAt(year, 5, 24, 23, 59) },
    { id: 'valborg', name: 'Valborg (Uppsala)', city: 'Uppsala', start: dateAt(year, 4, 30), end: dateAt(year, 4, 30, 23, 59) },
    { id: 'forsta-maj', name: 'Forsta maj (Sverige)', city: 'Sverige', start: dateAt(year, 5, 1), end: dateAt(year, 5, 1, 23, 59) },
    { id: 'nationaldagen', name: 'Nationaldagen (Sverige)', city: 'Sverige', start: dateAt(year, 6, 6), end: dateAt(year, 6, 6, 23, 59) },
    { id: 'midsommar', name: 'Midsommarafton (Sverige)', city: 'Sverige', start: dateAt(year, midsummer.month, midsummer.day), end: dateAt(year, midsummer.month, midsummer.day, 23, 59) },
    { id: 'nyarsafton', name: 'Nyarsafton (Sverige)', city: 'Sverige', start: dateAt(year, 12, 31), end: dateAt(year, 12, 31, 23, 59) },
    { id: 'uppsala-reggae', name: 'Uppsala Reggae Festival', city: 'Uppsala', start: dateAt(year, 7, 25), end: dateAt(year, 7, 27, 23, 59) },
    { id: 'kulturnatten-uppsala', name: 'Kulturnatten Uppsala', city: 'Uppsala', start: dateAt(year, 9, 13), end: dateAt(year, 9, 13, 23, 59) },
    { id: 'wow', name: 'Way Out West', city: 'Goteborg', start: dateAt(year, 8, 7), end: dateAt(year, 8, 9, 23, 59) },
    { id: 'kulturkalaset', name: 'Kulturkalaset', city: 'Goteborg', start: dateAt(year, 8, 13), end: dateAt(year, 8, 17, 23, 59) },
    { id: 'stockholm-pride', name: 'Stockholm Pride', city: 'Stockholm', start: dateAt(year, 8, 4), end: dateAt(year, 8, 10, 23, 59) },
    { id: 'kulturfestivalen', name: 'Kulturfestivalen (Stockholm)', city: 'Stockholm', start: dateAt(year, 8, 13), end: dateAt(year, 8, 17, 23, 59) },
    { id: 'studenten', name: 'Studenten (Sverige)', city: 'Sverige', start: dateAt(year, 6, 12), end: dateAt(year, 6, 12, 23, 59) },
    { id: 'day-at-the-park', name: 'A Day at the Park', city: 'Sverige', start: dateAt(year, 7, 3), end: dateAt(year, 7, 4, 23, 59) }
  ];
}

async function getSwedishPublicHolidays(year) {
  try {
    const response = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/SE`);
    const holidays = await response.json();
    return (holidays || []).map(holiday => ({
      id: `holiday-${holiday.date}`,
      name: `${holiday.localName} (Sverige)`,
      city: 'Sverige',
      start: new Date(holiday.date + 'T00:00:00'),
      end: new Date(holiday.date + 'T23:59:59')
    }));
  } catch (error) {
    return [];
  }
}

function dateAt(year, month, day, hour = 0, minute = 0) {
  return new Date(year, month - 1, day, hour, minute, 0, 0);
}

function getMidsummerEve(year) {
  for (let day = 19; day <= 25; day++) {
    const date = new Date(year, 5, day);
    if (date.getDay() === 5) return { month: 6, day: day };
  }
  return { month: 6, day: 20 };
}

async function getPastPresetEvents(minDate, maxDate) {
  const currentYear = new Date().getFullYear();
  const years = [currentYear - 1, currentYear];
  const presetEvents = years.flatMap(year => getPresetEvents(year));
  const holidayLists = await Promise.all(years.map(year => getSwedishPublicHolidays(year)));
  const holidays = holidayLists.flat();
  const allEvents = [...presetEvents, ...holidays];

  const filtered = allEvents.filter(evt => evt.end >= minDate && evt.end <= maxDate);
  filtered.sort((a, b) => b.end - a.end);

  const eventMap = new Map();
  filtered.forEach(evt => {
    const key = `${evt.id}-${evt.start.getFullYear()}`;
    if (!eventMap.has(key)) {
      eventMap.set(key, { ...evt, key });
    }
  });

  return Array.from(eventMap.values());
}

function formatRange(start, end) {
  const startText = start.toLocaleDateString('sv-SE', { month: 'short', day: 'numeric' });
  const endText = end.toLocaleDateString('sv-SE', { month: 'short', day: 'numeric' });
  return startText === endText ? startText : `${startText} - ${endText}`;
}

function showComingSoonPopup() {
  alert('Coming soon!');
}

showTab('historiskalogar', document.querySelector('.tab-button.active'));
</script>
