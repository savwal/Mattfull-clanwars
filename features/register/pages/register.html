<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrera - Måttfull</title>
<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; background-color: #E5E9F0; color: #111; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.card { background: #FFFFFF; border: 4px solid #2C3E50; padding: 20px; box-shadow: 6px 6px 0px #2C3E50; width: 100%; max-width: 400px; text-align: center; }
h2 { font-family: 'Arial Black', sans-serif; text-transform: uppercase; color: #FFF; background: #2A8CFF; margin: -20px -20px 20px -20px; padding: 15px; border-bottom: 4px solid #2C3E50; }
input, select, button { padding: 14px; margin: 8px 0; width: 100%; box-sizing: border-box; border: 4px solid #2C3E50; font-size: 16px; font-weight: bold; outline: none; }
button { background: #FFCC00; color: #2C3E50; cursor: pointer; text-transform: uppercase; font-weight: 900; box-shadow: 4px 4px 0px #2C3E50; margin-top: 15px; }
button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #2C3E50; }
</style>
</head>
<body>
<div class="card">
  <h2>Ny Krigare</h2>
  <input type="text" id="regName" placeholder="Namn">
  <input type="number" id="regWeight" placeholder="Vikt (kg)">
  <select id="regGender">
    <option value="man">Man</option>
    <option value="kvinna">Kvinna</option>
  </select>
  <input type="number" step="0.1" id="regFunzone" placeholder="Funzone gräns (‰) t.ex. 1.0">
  <button onclick="registerProfile()">Skapa Profil</button>
</div>
<script src="../../shared/scripts/hash.js"></script>
<script src="../../shared/scripts/shared.js"></script>
<script>
function registerProfile() {
  const name = document.getElementById('regName').value;
  const weight = parseFloat(document.getElementById('regWeight').value);
  const gender = document.getElementById('regGender').value;
  const funzone = parseFloat(document.getElementById('regFunzone').value);
  
  if (!name || isNaN(weight) || isNaN(funzone)) return;
  
  const newHash = generateUniqueHash();
  const newProfile = { id: newHash, name, weight, gender, funzone, pic: '' };
  
  let globalData = getGlobalData();
  globalData.persons[newHash] = newProfile;
  saveGlobalData(globalData);
  
  let profiles = JSON.parse(localStorage.getItem('profiles')) || [];
  profiles.push(newProfile);
  localStorage.setItem('profiles', JSON.stringify(profiles));
  localStorage.setItem('activeProfileId', newHash);
  
  window.location.href = '../../../index.html';
}
</script>
</body>
</html>
