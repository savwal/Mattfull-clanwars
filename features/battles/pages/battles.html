<script>
let currentMode = '';
let myActiveBattles = [];
let activeParticipants = new Set();
let profilesData = {};
let realtimeChannel = null;

function openBattleModal(title) {
  currentMode = title;
  document.getElementById('modalTitle').innerText = title;
  renderBattleFields(title);
  document.getElementById('battleModal').style.display = 'block';
}

function renderBattleFields(title) {
  const container = document.getElementById('battleFields');
  container.innerHTML = '';
  if (title === 'Duos Battle') {
    container.appendChild(createBattleInput('teammateHash', 'Teammate hash'));
    container.appendChild(createBattleInput('opponentHash1', 'Motståndare hash 1'));
    container.appendChild(createBattleInput('opponentHash2', 'Motståndare hash 2'));
  } else if (title === 'Custom Battle Royale') {
    const info = document.createElement('p');
    info.style.margin = '10px 0 0 0';
    info.style.fontWeight = 'bold';
    info.innerText = 'Custom Battle Royale är under utveckling.';
    container.appendChild(info);
  } else {
    container.appendChild(createBattleInput('opponentHash', 'Ange motståndarens hash'));
  }
}

function createBattleInput(id, placeholder) {
  const input = document.createElement('input');
  input.type = 'text';
  input.id = id;
  input.placeholder = placeholder;
  return input;
}

function closeBattleModal() {
  document.getElementById('battleModal').style.display = 'none';
}

async function syncProfileToSupabase(profile) {
  if (!sb || !profile) return;
  await sb.from('profiles').upsert({
    player_hash: profile.id,
    display_name: profile.name,
    avatar_url: profile.pic,
    weight: profile.weight || null,
    gender: profile.gender || null
  });
}

async function startBattle() {
  if (typeof ensureSupabaseAuth === 'function') {
    await ensureSupabaseAuth();
  }
  if (!sb) return;
  if (currentMode === 'Custom Battle Royale') {
    alert("Under utveckling!");
    closeBattleModal();
    return;
  }

  const activeProfile = getActiveProfile();
  if (!activeProfile) return;

  const now = new Date();
  const endTime = new Date(now.getTime() + 24 * 60 * 60 * 1000);

  let rawParticipants = [activeProfile.id];

  if (currentMode === 'Duos Battle') {
    const teammateHash = document.getElementById('teammateHash').value.trim();
    const opponentHash1 = document.getElementById('opponentHash1').value.trim();
    const opponentHash2 = document.getElementById('opponentHash2').value.trim();
    if (!teammateHash || !opponentHash1 || !opponentHash2) return;
    rawParticipants.push(teammateHash, opponentHash1, opponentHash2);
  } else if (currentMode === 'Solo Battle') {
    const opponentHash = document.getElementById('opponentHash').value.trim();
    if (!opponentHash) return;
    rawParticipants.push(opponentHash);
  }

  const participants = Array.from(new Set(rawParticipants));

  if (currentMode === 'Solo Battle' && participants.length !== 2) {
    alert("Du kan inte utmana dig själv!");
    return;
  }
  if (currentMode === 'Duos Battle' && participants.length !== 4) {
    alert("Alla hashkoder måste vara unika!");
    return;
  }

  participants = Array.from(new Set(participants));

  const { data: validProfiles } = await sb.from('profiles').select('player_hash').in('player_hash', participants);
  const validHashes = validProfiles ? validProfiles.map(p => p.player_hash) : [];
  const missingHashes = participants.filter(p => !validHashes.includes(p));
  
  if (missingHashes.length > 0) {
    const newProfiles = missingHashes.map(h => ({ 
      player_hash: h, 
      display_name: h === activeProfile.id ? activeProfile.name : h 
    }));
    await sb.from('profiles').upsert(newProfiles);
  }

  await syncProfileToSupabase(activeProfile);

  const { data: newBattle, error } = await sb.from('battles').insert({
    battle_type: currentMode,
    status: 'active',
    start_time: now.toISOString(),
    end_time: endTime.toISOString()
  }).select('id').single();

  if (newBattle) {
    const pInserts = participants.map((p, idx) => ({
      battle_id: newBattle.id,
      player_hash: p,
      team: currentMode === 'Duos Battle' ? (idx < 2 ? 1 : 2) : idx
    }));
    await sb.from('battle_participants').insert(pInserts);
    closeBattleModal();
    await fetchActiveBattles();
  } else if (error) {
    alert("Ett fel inträffade.");
  }
}

async function fetchActiveBattles() {
  if (typeof ensureSupabaseAuth === 'function') {
    await ensureSupabaseAuth();
  }
  const activeProfile = getActiveProfile();
  if (!activeProfile || !sb) return;

  const now = new Date().toISOString();
  
  const { data: myParticipations } = await sb.from('battle_participants')
    .select('battle_id')
    .eq('player_hash', activeProfile.id);

  if (!myParticipations || myParticipations.length === 0) {
    renderActiveBattles([]);
    return;
  }

  const battleIds = myParticipations.map(p => p.battle_id);
  
  const { data: battles } = await sb.from('battles')
    .select(`id, battle_type, start_time, end_time, battle_participants(player_hash, team)`)
    .in('id', battleIds)
    .gt('end_time', now)
    .eq('status', 'active');

  myActiveBattles = battles || [];
  
  activeParticipants = new Set();
  myActiveBattles.forEach(b => {
    b.battle_participants.forEach(p => activeParticipants.add(p.player_hash));
  });

  if (activeParticipants.size > 0) {
    const { data: profiles } = await sb.from('profiles').select('*').in('player_hash', Array.from(activeParticipants));
    if (profiles) {
      profiles.forEach(p => profilesData[p.player_hash] = p);
    }
  }

  await renderActiveBattles();
}

async function renderActiveBattles() {
  const list = document.getElementById('activeBattlesList');
  if (!list) return;
  list.innerHTML = '';
  
  if (myActiveBattles.length === 0) {
    list.innerHTML = '<li style="justify-content:center; color:#7f8c8d;">Inga aktiva strider.</li>';
    return;
  }

  for (const battle of myActiveBattles) {
    const li = document.createElement('li');
    li.style.flexDirection = 'column';
    li.style.alignItems = 'flex-start';
    
    const title = document.createElement('div');
    title.innerHTML = `<strong style="font-size:1.2em; color:#2C3E50;">${battle.battle_type || battle.type}</strong> <br><span style="font-size:0.8em; color:#7f8c8d;">Slutar: ${new Date(battle.end_time).toLocaleString()}</span>`;
    li.appendChild(title);
    
    const statsContainer = document.createElement('div');
    statsContainer.style.width = '100%';
    statsContainer.style.marginTop = '10px';

    const startIso = battle.start_time;
    const endIso = battle.end_time;
    const hashes = battle.battle_participants.map(p => p.player_hash);
    
    const { data: drinks } = await sb.from('drink_logs')
      .select('player_hash, grams_alcohol')
      .in('player_hash', hashes)
      .gte('consumed_at', startIso)
      .lte('consumed_at', endIso);

    const scores = {};
    hashes.forEach(h => scores[h] = 0);
    if (drinks) {
      drinks.forEach(d => {
        if(d.grams_alcohol > 0) scores[d.player_hash] += d.grams_alcohol;
      });
    }

    const sortedHashes = hashes.sort((a, b) => scores[b] - scores[a]);

    sortedHashes.forEach((hash, idx) => {
      const p = profilesData[hash];
      const cl = calculateCl(scores[hash]).toFixed(1);
      
      const pDiv = document.createElement('div');
      pDiv.style.display = 'flex';
      pDiv.style.justifyContent = 'space-between';
      pDiv.style.padding = '5px 0';
      pDiv.style.borderBottom = idx < sortedHashes.length - 1 ? '1px solid #eee' : 'none';
      
      const nameSpan = document.createElement('span');
      nameSpan.style.fontWeight = 'bold';
      nameSpan.style.color = '#2C3E50';
      nameSpan.className = 'opponent-name';
      nameSpan.textContent = p ? p.display_name : hash;
      nameSpan.onclick = () => viewBattleGraphs(battle);
      
      const badgeSpan = document.createElement('span');
      badgeSpan.className = 'badge';
      badgeSpan.style.background = '#FFCC00';
      badgeSpan.style.padding = '2px 6px';
      badgeSpan.style.border = '3px solid #2C3E50';
      badgeSpan.style.fontWeight = '900';
      badgeSpan.textContent = `${cl} cl`;
      
      pDiv.appendChild(nameSpan);
      pDiv.appendChild(badgeSpan);
      statsContainer.appendChild(pDiv);
    });

    li.appendChild(statsContainer);
    list.appendChild(li);
  }
}

function buildDrinkHistory(drinkLogs) {
  return (drinkLogs || []).map(d => {
    const grams = Number.isFinite(d.grams_alcohol)
      ? d.grams_alcohol
      : parseFloat((d.volume_ml * (d.abv / 100) * 0.789).toFixed(1));
    return {
      name: d.drink_name,
      volume: d.volume_ml,
      abv: d.abv,
      grams,
      timestamp: new Date(d.consumed_at).getTime()
    };
  });
}

async function renderOpponentGraphData(canvasId, statsId, opponentHash, opponentProfile, battle) {
  try {
    if (typeof ensureSupabaseAuth === 'function') {
      await ensureSupabaseAuth();
    }
    const { data: battleLogs } = await sb.from('drink_logs')
      .select('drink_name, volume_ml, abv, grams_alcohol, consumed_at')
      .eq('player_hash', opponentHash)
      .gte('consumed_at', battle.start_time)
      .lte('consumed_at', battle.end_time)
      .order('consumed_at', { ascending: true });

    let history = buildDrinkHistory(battleLogs);

    if (!history || history.length === 0) {
      const { data: latestLog } = await sb.from('drink_logs')
        .select('drink_name, volume_ml, abv, grams_alcohol, consumed_at')
        .eq('player_hash', opponentHash)
        .order('consumed_at', { ascending: false })
        .limit(1);
      history = buildDrinkHistory(latestLog);
    }

    if (!history || history.length === 0) {
      document.getElementById(statsId).innerHTML = '<p style="color:#7f8c8d;">Ingen dryckdata</p>';
      return false;
    }
    
    const startTime = new Date(history[0].timestamp);
    const endTime = battleLogs && battleLogs.length > 0
      ? Math.min(new Date(battle.end_time), new Date())
      : new Date();
    const labels = [];
    const dataPoints = [];
    
    let currentTime = new Date(startTime);
    while (currentTime <= endTime) {
      const bac = calculateBACAtTime(history, opponentProfile, currentTime.getTime());
      labels.push(currentTime.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' }));
      dataPoints.push(bac);
      currentTime = new Date(currentTime.getTime() + 30 * 60000); 
    }
    
    const opponentZones = { 
      legalMax: 0.2, 
      redMax: opponentProfile.funzone_limit || 1.0, 
      greenMax: 3.0 
    };
    
    const totalGrams = history.reduce((sum, d) => sum + d.grams, 0);
    const maxBac = Math.max(...dataPoints);
    const currentBac = calculateBACAtTime(history, opponentProfile, Date.now());
    const lastDrink = history[history.length - 1];
    document.getElementById(statsId).innerHTML = `
      <p style="margin:3px 0;"><strong>Vikt:</strong> ${opponentProfile.weight || 75} kg</p>
      <p style="margin:3px 0;"><strong>Kön:</strong> ${opponentProfile.gender === 'kvinna' ? 'Kvinna' : 'Man'}</p>
      <p style="margin:3px 0;"><strong>Funzone:</strong> ${opponentZones.redMax.toFixed(1)} ‰</p>
      <p style="margin:3px 0;"><strong>Total:</strong> ${totalGrams.toFixed(1)} g (${calculateCl(totalGrams).toFixed(1)} cl)</p>
      <p style="margin:3px 0;"><strong>Max promille:</strong> ${maxBac.toFixed(2)} ‰</p>
      <p style="margin:3px 0;"><strong>Nuvarande promille:</strong> ${currentBac.toFixed(2)} ‰</p>
      <p style="margin:3px 0;"><strong>Senaste dryck:</strong> ${lastDrink.name} (${lastDrink.volume} ml, ${lastDrink.abv}% abv)</p>
    `;
    
    renderChart(canvasId, labels, dataPoints, opponentZones);
    return true;
    
  } catch (error) {
    console.error('Error fetching graph:', error);
    document.getElementById(statsId).innerHTML = '<p style="color:#E74C3C;">Fel vid hämtning</p>';
    return false;
  }
}

async function viewBattleGraphs(battle) {
  if (!sb) return;
  
  document.getElementById('graphLoadingIndicator').style.display = 'block';
  document.getElementById('singleGraphContainer').style.display = 'none';
  document.getElementById('duoGraphsContainer').style.display = 'none';
  document.getElementById('graphModal').style.display = 'block';
  
  try {
    const activeProfile = getActiveProfile();
    const mode = battle.battle_type || battle.type;

    if (mode === 'Duos Battle') {
      const myTeam = battle.battle_participants.find(p => p.player_hash === activeProfile.id)?.team;
      const opponentTeam = myTeam === 1 ? 2 : 1;
      const opponents = battle.battle_participants.filter(p => p.team === opponentTeam).map(p => p.player_hash);
      
      if (opponents.length !== 2) {
        alert('Kunde inte hitta båda motståndare');
        return;
      }
      
      const { data: opponentProfiles } = await sb.from('profiles')
        .select('*')
        .in('player_hash', opponents);
      
      if (!opponentProfiles || opponentProfiles.length !== 2) return;
      
      const opp1 = opponentProfiles[0];
      const opp2 = opponentProfiles[1];
      
      document.getElementById('graphModalTitle').textContent = `${opp1.display_name} vs ${opp2.display_name}`;
      document.getElementById('duoGraphTitle1').textContent = opp1.display_name;
      document.getElementById('duoGraphTitle2').textContent = opp2.display_name;
      
      document.getElementById('graphLoadingIndicator').style.display = 'none';
      document.getElementById('duoGraphsContainer').style.display = 'grid';
      
      await renderOpponentGraphData('opponentGraphCanvas1', 'graphStats1', opp1.player_hash, opp1, battle);
      await renderOpponentGraphData('opponentGraphCanvas2', 'graphStats2', opp2.player_hash, opp2, battle);
    } else {
      const opponent = battle.battle_participants.find(p => p.player_hash !== activeProfile.id)?.player_hash;
      if (!opponent) return;

      const { data: profiles } = await sb.from('profiles')
        .select('*')
        .in('player_hash', [activeProfile.id, opponent]);
      
      const me = profiles.find(p => p.player_hash === activeProfile.id) || { player_hash: activeProfile.id, display_name: activeProfile.name, weight: activeProfile.weight, gender: activeProfile.gender };
      const opp = profiles.find(p => p.player_hash === opponent);

      if (!opp) return;

      document.getElementById('graphModalTitle').textContent = `${me.display_name} vs ${opp.display_name}`;
      document.getElementById('duoGraphTitle1').textContent = me.display_name;
      document.getElementById('duoGraphTitle2').textContent = opp.display_name;
      
      document.getElementById('graphLoadingIndicator').style.display = 'none';
      document.getElementById('duoGraphsContainer').style.display = 'grid';
      
      await renderOpponentGraphData('opponentGraphCanvas1', 'graphStats1', me.player_hash, me, battle);
      await renderOpponentGraphData('opponentGraphCanvas2', 'graphStats2', opp.player_hash, opp, battle);
    }
    
  } catch (error) {
    console.error('Error viewing graph:', error);
    document.getElementById('graphLoadingIndicator').innerHTML = '<p style="color:#E74C3C;">Fel vid hämtning av stridsgraf.</p>';
  }
}

function closeGraphModal() {
  document.getElementById('graphModal').style.display = 'none';
  document.getElementById('singleGraphContainer').style.display = 'none';
  document.getElementById('duoGraphsContainer').style.display = 'none';
}

function initRealtime() {
  if (!sb) return;
  realtimeChannel = sb.channel('public:drink_logs')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'drink_logs' }, payload => {
      if (activeParticipants.has(payload.new.player_hash)) {
        renderActiveBattles();
      }
    })
    .subscribe();
}

if (typeof ensureSupabaseAuth === 'function') {
  ensureSupabaseAuth().finally(() => {
    fetchActiveBattles().then(() => initRealtime());
  });
} else {
  fetchActiveBattles().then(() => initRealtime());
}
</script>
