<div class="card">
  <h2 id="eventTitle">Laddar event...</h2>

<script>
function setStatusText(element, message, isError) {
  if (!element) return;
  element.textContent = message;
  element.classList.toggle('error-text', Boolean(isError));
}

function buildHistoryByHash(drinks) {
  const historyByHash = {};
  (drinks || []).forEach(d => {
    if (!historyByHash[d.player_hash]) historyByHash[d.player_hash] = [];
    const grams = Number.isFinite(d.grams_alcohol)
      ? d.grams_alcohol
      : parseFloat((d.volume_ml * (d.abv / 100) * 0.789).toFixed(1));
    historyByHash[d.player_hash].push({
      timestamp: new Date(d.consumed_at).getTime(),
      grams
    });
  });
  return historyByHash;
}

async function fetchCustomEvent(eventId) {
  if (!sb || !eventId) return null;
  const { data, error } = await sb.from('events')
    .select('id, name, created_at, start_time, end_time')
    .eq('id', eventId)
    .single();
  if (error) return null;
  return {
    event_id: data.id,
    event_name: data.name,
    created_at: data.created_at,
    starts_at: data.start_time,
    ends_at: data.end_time
  };
}

async function fetchCustomParticipants(eventId) {
  if (!sb || !eventId) return [];
  const { data, error } = await sb.from('event_participants')
    .select('event_id, player_hash')
    .eq('event_id', eventId);
  if (error || !data) return [];
  return data.map(row => ({
    event_id: row.event_id,
    user_id: row.player_hash,
    hash: row.player_hash
  }));
}

async function fetchProfilesByHashes(hashes) {
  if (!sb || hashes.length === 0) return [];
  const { data } = await sb.from('profiles')
    .select('player_hash, display_name, avatar_url, weight, gender')
    .in('player_hash', hashes);
  return data || [];
}

async function leaveCustomEvent() {
  const params = new URLSearchParams(window.location.search);
  const eventId = params.get('event_id');
  const activeProfile = getActiveProfile();

  if (!sb || !eventId || !activeProfile) {
    alert('Kunde inte lämna eventet.');
    return;
  }

  if (!confirm('Vill du lämna eventet?')) return;

  const { error } = await sb.from('event_participants')
    .delete()
    .eq('event_id', eventId)
    .eq('player_hash', activeProfile.id);

  if (error) {
    console.error('Error leaving event:', error);
    alert('Kunde inte lämna eventet.');
    return;
  }

  window.location.href = './events.html';
}

async function fetchEventDrinksForHashes(hashes, startISO, endISO) {
  if (!sb || hashes.length === 0) return [];
  let query = sb.from('drink_logs')
    .select('player_hash, grams_alcohol, volume_ml, abv, consumed_at')
    .in('player_hash', hashes);
  if (startISO) query = query.gte('consumed_at', startISO);
  if (endISO) query = query.lte('consumed_at', endISO);
  const { data } = await query;
  return data || [];
}

function renderLeaderboard(entries) {
  const list = document.getElementById('eventLeaderboard');
  list.innerHTML = '';
  if (!entries || entries.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#7f8c8d;">Inga deltagare.</p>';
    return;
  }
  entries.forEach((player, index) => {
    const li = document.createElement('li');
    const rank = document.createElement('span');
    rank.className = 'rank-badge';
    rank.textContent = `#${index + 1}`;
    const img = document.createElement('img');
    img.className = 'profile-img';
    img.src = player.pic || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232C3E50"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
    const info = document.createElement('div');
    info.className = 'leaderboard-info';
    info.innerHTML = `<span style="font-size:1.1em; color:#2C3E50;">${player.name}</span><br><span style="font-size:0.85em; color:#7f8c8d;">${player.id}</span>`;
    const stats = document.createElement('div');
    stats.className = 'badge';
    stats.innerText = `${Math.abs(player.cl).toFixed(1)} cl`;
    li.appendChild(rank);
    li.appendChild(img);
    li.appendChild(info);
    li.appendChild(stats);
    list.appendChild(li);
  });
}

function renderParticipants(participants, profileMap) {
  const list = document.getElementById('eventParticipants');
  list.innerHTML = '';
  if (!participants || participants.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#7f8c8d;">Inga deltagare.</p>';
    return;
  }
  participants.forEach((p) => {
    const profile = profileMap[p.hash];
    const li = document.createElement('li');
    const img = document.createElement('img');
    img.className = 'profile-img';
    img.src = (profile && profile.pic) || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232C3E50"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
    const info = document.createElement('div');
    info.className = 'leaderboard-info';
    const displayName = profile ? profile.name : p.hash;
    info.innerHTML = `<span style="font-size:1.1em; color:#2C3E50;">${displayName}</span><br><span style="font-size:0.85em; color:#7f8c8d;">${p.hash}</span>`;
    li.appendChild(img);
    li.appendChild(info);
    list.appendChild(li);
  });
}

async function loadCustomEventLeaderboard() {
  const params = new URLSearchParams(window.location.search);
  const eventId = params.get('event_id');
  const title = document.getElementById('eventTitle');
  const meta = document.getElementById('eventMeta');

  if (!eventId) {
    setStatusText(meta, 'Saknar event-id.', true);
    return;
  }

  const activeProfile = getActiveProfile();
  const participants = await fetchCustomParticipants(eventId);

  if (!participants || participants.length === 0) {
    setStatusText(meta, 'Inga deltagare i detta event.', true);
    return;
  }

  if (!activeProfile || !participants.some(p => p.user_id === activeProfile.id)) {
    setStatusText(meta, 'Du är inte medlem i detta event.', true);
    const leaveButton = document.getElementById('leaveEventButton');
    if (leaveButton) leaveButton.style.display = 'none';
    return;
  }

  const leaveButton = document.getElementById('leaveEventButton');
  if (leaveButton) leaveButton.style.display = 'block';

  const event = await fetchCustomEvent(eventId);
  if (!event) {
    setStatusText(meta, 'Kunde inte ladda eventet.', true);
    return;
  }

  title.textContent = event.event_name;
  setStatusText(meta, `Kod: ${event.event_id} | ${new Date(event.starts_at).toLocaleString()} - ${new Date(event.ends_at).toLocaleString()}`, false);

  const hashes = participants.map(p => p.hash || p.user_id);
  const profiles = await fetchProfilesByHashes(hashes);
  const profileMap = {};
  profiles.forEach(p => {
    profileMap[p.player_hash] = {
      id: p.player_hash,
      name: p.display_name,
      pic: p.avatar_url,
      weight: p.weight,
      gender: p.gender
    };
  });

  // Rank by alcohol consumed within the event window, matching the preset-event boards.
  const startISO = event.starts_at ? new Date(event.starts_at).toISOString() : null;
  const endISO = event.ends_at ? new Date(event.ends_at).toISOString() : null;
  const drinks = await fetchEventDrinksForHashes(hashes, startISO, endISO);

  const gramsByHash = {};
  drinks.forEach(d => {
    const grams = Number.isFinite(Number(d.grams_alcohol))
      ? Number(d.grams_alcohol)
      : (Number(d.volume_ml) || 0) * ((Number(d.abv) || 0) / 100) * 0.789;
    // Count consumption only; "ulta" (negative grams) never lowers an event score.
    if (grams > 0) gramsByHash[d.player_hash] = (gramsByHash[d.player_hash] || 0) + grams;
  });

  const entries = participants.map(p => {
    const profile = profileMap[p.hash];
    const grams = gramsByHash[p.hash] || 0;
    return {
      id: p.hash,
      name: profile ? profile.name : p.hash,
      pic: profile ? profile.pic : null,
      cl: Math.abs(calculateCl(grams))
    };
  }).sort((a, b) => b.cl - a.cl);

  renderLeaderboard(entries);
  renderParticipants(participants, profileMap);
}

loadCustomEventLeaderboard();
</script>
