<div class="card">
  <h2 id="eventTitle">Custom Event</h2>

</div>

  <h2>Alla Deltagare</h2>

<script>
function setStatusText(element, message, isError) {
  if (!element) return;
  element.textContent = message;
  element.classList.toggle('error-text', Boolean(isError));
}

function buildHistoryByHash(drinks) {
  const historyByHash = {};
  (drinks || []).forEach(d => {
    if (!historyByHash[d.player_hash]) historyByHash[d.player_hash] = [];
    const grams = Number.isFinite(d.grams_alcohol)
      ? d.grams_alcohol
      : parseFloat((d.volume_ml * (d.abv / 100) * 0.789).toFixed(1));
    historyByHash[d.player_hash].push({
      timestamp: new Date(d.consumed_at).getTime(),
      grams
    });
  });
  return historyByHash;
}

async function fetchCustomEvent(eventId) {
  if (!sb || !eventId) return null;
  const { data, error } = await sb.from('custom_events')
    .select('event_id, event_name, created_at, starts_at, ends_at')
    .eq('event_id', eventId)
    .single();
  if (error) return null;
  return data;
}

async function fetchCustomParticipants(eventId) {
  if (!sb || !eventId) return [];
  const { data, error } = await sb.from('custom_event_participants')
    .select('event_id, user_id, name, hash, promille')
    .eq('event_id', eventId);
  if (error || !data) return [];
  return data;
}

async function fetchProfilesByHashes(hashes) {
  if (!sb || hashes.length === 0) return [];
  const { data } = await sb.from('profiles')
    .select('player_hash, display_name, avatar_url, weight, gender')
    .in('player_hash', hashes);
  return data || [];
}

async function fetchDrinkLogsForWindow(hashes, startIso, endIso) {
  if (!sb || hashes.length === 0 || !startIso || !endIso) return [];
  const { data } = await sb.from('drink_logs')
    .select('player_hash, grams_alcohol, volume_ml, abv, consumed_at')
    .in('player_hash', hashes)
    .gte('consumed_at', startIso)
    .lte('consumed_at', endIso);
  return data || [];
}

function renderLeaderboard(entries) {
  const list = document.getElementById('eventLeaderboard');
  list.innerHTML = '';
  if (!entries || entries.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#7f8c8d;">Inga deltagare.</p>';
    return;
  }
  entries.forEach((player, index) => {
    const li = document.createElement('li');
    const img = document.createElement('img');
    img.className = 'profile-img';
    img.src = player.pic || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232C3E50"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
    const info = document.createElement('div');
    info.innerHTML = `<span style="font-size:1.1em; color:#2C3E50;">#${index + 1} ${player.name}</span><br><span style="font-size:0.85em; color:#7f8c8d;">${player.id}</span>`;
    const stats = document.createElement('div');
    stats.className = 'badge';
    stats.innerText = `${player.promille.toFixed(2)} ‰`;
    li.appendChild(img);
    li.appendChild(info);
    li.appendChild(stats);
    list.appendChild(li);
  });
}

function renderParticipants(participants, profileMap) {
  const list = document.getElementById('eventParticipants');
  list.innerHTML = '';
  if (!participants || participants.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#7f8c8d;">Inga deltagare.</p>';
    return;
  }
  participants.forEach((p, index) => {
    const profile = profileMap[p.hash];
    const li = document.createElement('li');
    const img = document.createElement('img');
    img.className = 'profile-img';
    img.src = (profile && profile.pic) || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232C3E50"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
    const info = document.createElement('div');
    info.innerHTML = `<span style="font-size:1.1em; color:#2C3E50;">${profile ? profile.name : p.name}</span><br><span style="font-size:0.85em; color:#7f8c8d;">${p.hash}</span>`;
    li.appendChild(img);
    li.appendChild(info);
    list.appendChild(li);
  });
}

function refreshPage() {
  window.location.reload();
}

async function loadCustomEventLeaderboard() {
  const params = new URLSearchParams(window.location.search);
  const eventId = params.get('event_id');
  const title = document.getElementById('eventTitle');
  const meta = document.getElementById('eventMeta');

  if (!eventId) {
    setStatusText(meta, 'Saknar event-id.', true);
    return;
  }

  const activeProfile = getActiveProfile();
  const participants = await fetchCustomParticipants(eventId);

  if (!participants || participants.length === 0) {
    setStatusText(meta, 'Inga deltagare i detta event.', true);
    return;
  }

  if (!activeProfile || !participants.some(p => p.user_id === activeProfile.id)) {
    setStatusText(meta, 'Du är inte medlem i detta event.', true);
    return;
  }

  const event = await fetchCustomEvent(eventId);
  if (!event || !event.starts_at || !event.ends_at) {
    setStatusText(meta, 'Eventet saknar giltigt start- eller slutdatum.', true);
    return;
  }

  title.textContent = event.event_name;
  setStatusText(meta, `${event.event_id} - ${new Date(event.starts_at).toLocaleString()} till ${new Date(event.ends_at).toLocaleString()}`, false);

  const hashes = participants.map(p => p.hash || p.user_id);
  const profiles = await fetchProfilesByHashes(hashes);
  const profileMap = {};
  profiles.forEach(p => {
    profileMap[p.player_hash] = {
      id: p.player_hash,
      name: p.display_name,
      pic: p.avatar_url,
      weight: p.weight,
      gender: p.gender
    };
  });

  const drinks = await fetchDrinkLogsForWindow(hashes, event.starts_at, event.ends_at);
  const historyByHash = buildHistoryByHash(drinks);

  const entries = participants.map(p => {
    const profile = profileMap[p.hash];
    const history = historyByHash[p.hash] || [];
    const promilleValue = profile && profile.weight && profile.gender
      ? calculateBACAtTime(history, profile, Date.now())
      : (p.promille || 0);
    return {
      id: p.hash,
      name: profile ? profile.name : p.name,
      pic: profile ? profile.pic : '',
      promille: promilleValue
    };
  }).sort((a, b) => b.promille - a.promille);

  renderLeaderboard(entries);
  renderParticipants(participants, profileMap);
}

loadCustomEventLeaderboard();
</script>
