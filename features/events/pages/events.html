<script>
const CUSTOM_EVENT_ID_LENGTH = 4;
const LOCAL_CUSTOM_EVENTS_KEY = 'local_custom_events';
const CUSTOM_EVENT_REFRESH_MS = 30000;
const CUSTOM_EVENT_MAX_RANGE_DAYS = 7;

function applyStatUpdate(element, text) {
  if (!element) return;
  if (element.textContent === text) return;
  element.classList.add('stat-bump');
  setTimeout(() => {
    element.textContent = text;
    element.classList.remove('stat-bump');
  }, 50);
}

function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function toIsoOrNull(dateValue) {
  return dateValue ? dateValue.toISOString() : null;
}

function parseDateInput(value) {
  if (!value) return null;
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? null : date;
}

function getLocalCustomEvents(profileId) {
  if (!profileId) return [];
  try {
    const all = JSON.parse(localStorage.getItem(LOCAL_CUSTOM_EVENTS_KEY)) || {};
    return Array.isArray(all[profileId]) ? all[profileId] : [];
  } catch (error) {
    return [];
  }
}

function saveLocalCustomEvents(profileId, events) {
  if (!profileId) return;
  const safeEvents = Array.isArray(events) ? events : [];
  let all = {};
  try {
    all = JSON.parse(localStorage.getItem(LOCAL_CUSTOM_EVENTS_KEY)) || {};
  } catch (error) {
    all = {};
  }
  all[profileId] = safeEvents;
  localStorage.setItem(LOCAL_CUSTOM_EVENTS_KEY, JSON.stringify(all));
}

function upsertLocalCustomEvent(profileId, event) {
  if (!profileId || !event) return [];
  const events = getLocalCustomEvents(profileId);
  const index = events.findIndex(item => item.event_id === event.event_id);
  if (index >= 0) {
    events[index] = { ...events[index], ...event };
  } else {
    events.push(event);
  }
  saveLocalCustomEvents(profileId, events);
  return events;
}

function removeLocalCustomEvent(profileId, eventId) {
  if (!profileId || !eventId) return [];
  const events = getLocalCustomEvents(profileId).filter(evt => evt.event_id !== eventId);
  saveLocalCustomEvents(profileId, events);
  return events;
}

function setStatusText(element, message, isError) {
  if (!element) return;
  element.textContent = message;
  element.classList.toggle('error-text', Boolean(isError));
}

async function syncProfileToSupabase(profile) {
  if (!sb || !profile) return;
  await sb.from('profiles').upsert({
    player_hash: profile.id,
    display_name: profile.name,
    avatar_url: profile.pic,
    weight: profile.weight || null,
    gender: profile.gender || null
  });
}

async function fetchCustomEventsForUser(userId) {
  if (!userId || !sb) return [];

  const { data } = await sb.from('event_participants')
    .select('event_id, events(id, name, created_at, start_time, end_time)')
    .eq('player_hash', userId);

  const eventMap = new Map();
  (data || []).forEach(row => {
    if (row.events && row.events.id) {
      eventMap.set(row.events.id, {
        event_id: row.events.id,
        event_name: row.events.name,
        created_at: row.events.created_at,
        starts_at: row.events.start_time,
        ends_at: row.events.end_time
      });
    }
  });

  return Array.from(eventMap.values());
}

async function fetchCustomEvent(eventId) {
  if (!eventId || !sb) return null;
  const { data, error } = await sb.from('events')
    .select('id, name, created_at, start_time, end_time')
    .eq('id', eventId)
    .single();
  if (error || !data) return null;
  return {
    event_id: data.id,
    event_name: data.name,
    created_at: data.created_at,
    starts_at: data.start_time,
    ends_at: data.end_time
  };
}

function formatCustomRange(startsAt, endsAt) {
  if (!startsAt && !endsAt) return 'Pågående';
  const start = startsAt ? new Date(startsAt) : null;
  const end = endsAt ? new Date(endsAt) : null;
  if (start && end) {
    const startText = start.toLocaleDateString('sv-SE', { month: 'short', day: 'numeric' });
    const endText = end.toLocaleDateString('sv-SE', { month: 'short', day: 'numeric' });
    return startText === endText ? startText : `${startText} - ${endText}`;
  }
  if (start) return `${start.toLocaleDateString('sv-SE')} - Pågående`;
  return `Pågående - ${end.toLocaleDateString('sv-SE')}`;
}

function renderMyCustomEvents(events) {
  const list = document.getElementById('myCustomEventsList');
  const empty = document.getElementById('noCustomEventsMessage');
  list.innerHTML = '';
  if (!events || events.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  events.forEach(evt => {
    const li = document.createElement('li');
    const meta = formatCustomRange(evt.starts_at, evt.ends_at);
    li.innerHTML = `
      <div>
        <strong>${evt.event_name}</strong><br>
        <span style="color:#5a6570; font-size:0.9em;">${meta}</span>
      </div>
      <div>
        <div class="badge" style="margin-bottom:6px;">${evt.event_id}</div>
        <button style="width:auto; padding:6px 10px; font-size:12px;" onclick="openCustomEventPage('${evt.event_id}')">Öppna</button>
      </div>
    `;
    list.appendChild(li);
  });
}

async function loadMyCustomEvents() {
  const activeProfile = getActiveProfile();
  if (!activeProfile) {
    renderMyCustomEvents([]);
    return [];
  }
  const localEvents = getLocalCustomEvents(activeProfile.id);
  const remoteEvents = await fetchCustomEventsForUser(activeProfile.id);
  const remoteIds = new Set((remoteEvents || []).map(evt => evt.event_id));
  const localOnly = (localEvents || []).filter(evt => !remoteIds.has(evt.event_id));
  if (localOnly.length !== localEvents.length) {
    saveLocalCustomEvents(activeProfile.id, localOnly);
  }
  const combined = [...localOnly, ...(remoteEvents || [])];
  renderMyCustomEvents(combined);
  return combined;
}

function openCustomEventPage(eventId) {
  if (!eventId) return;
  window.location.href = `./custom_events.html?event_id=${encodeURIComponent(eventId)}`;
}

async function createCustomEvent() {
  const name = document.getElementById('customName').value.trim();
  const startValue = document.getElementById('customStart').value;
  const endValue = document.getElementById('customEnd').value;
  const activeProfile = getActiveProfile();
  const info = document.getElementById('customHashInfo');
  setStatusText(info, '', false);

  if (!name || !activeProfile || !sb) return;

  const startDate = parseDateInput(startValue);
  const endDate = parseDateInput(endValue);
  if (!startDate || !endDate || endDate <= startDate) {
    setStatusText(info, 'Ogiltigt datumintervall.', true);
    return;
  }

  const maxRangeMs = CUSTOM_EVENT_MAX_RANGE_DAYS * 24 * 60 * 60 * 1000;
  if (endDate.getTime() - startDate.getTime() > maxRangeMs) {
    setStatusText(info, 'Inte möjligt just nu. Max 7 dagar!', true);
    return;
  }

  const charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ0123456789";
  let eventId = "";
  for (let i = 0; i < CUSTOM_EVENT_ID_LENGTH; i++) {
    eventId += charset.charAt(Math.floor(Math.random() * charset.length));
  }
  const createdAt = new Date().toISOString();

  if (typeof ensureSupabaseAuth === 'function') {
    await ensureSupabaseAuth();
  }

  await syncProfileToSupabase(activeProfile);

  const { error: eventError } = await sb.from('events').insert({
    id: eventId,
    name: name,
    created_at: createdAt,
    start_time: startDate.toISOString(),
    end_time: endDate.toISOString()
  });

  if (!eventError) {
    await sb.from('event_participants').insert({
      event_id: eventId,
      player_hash: activeProfile.id
    });
    upsertLocalCustomEvent(activeProfile.id, {
      event_id: eventId,
      event_name: name,
      created_at: createdAt,
      starts_at: startDate.toISOString(),
      ends_at: endDate.toISOString()
    });
  } else {
    setStatusText(info, 'Kunde inte skapa event.', true);
    return;
  }

  setStatusText(info, `Event skapat! Kod: ${eventId}`, false);
  document.getElementById('customName').value = '';
  document.getElementById('customStart').value = '';
  document.getElementById('customEnd').value = '';

  await loadMyCustomEvents();
}

async function joinCustomEvent() {
  const hash = document.getElementById('joinHash').value.trim();
  const status = document.getElementById('joinStatus');
  setStatusText(status, '', false);

  if (!hash || !sb) return;

  const activeProfile = getActiveProfile();
  if (!activeProfile) return;

  // Make sure the auth token is valid (refreshing if it expired) before reading
  // the event and inserting the participant row.
  if (typeof ensureSupabaseAuth === 'function') {
    await ensureSupabaseAuth();
  }

  const eventData = await fetchCustomEvent(hash);
  if (!eventData) {
    setStatusText(status, 'Hittade inte eventet.', true);
    return;
  }

  const { data: existing } = await sb.from('event_participants')
    .select('event_id')
    .eq('event_id', hash)
    .eq('player_hash', activeProfile.id)
    .limit(1);

  if (existing && existing.length > 0) {
    setStatusText(status, 'Du är redan med i eventet.', true);
    return;
  }

  await syncProfileToSupabase(activeProfile);

  const { error: joinError } = await sb.from('event_participants').insert({
    event_id: hash,
    player_hash: activeProfile.id
  });
  if (joinError) {
    console.error('Error joining event:', joinError);
    setStatusText(status, 'Kunde inte gå med i eventet. Försök igen.', true);
    return;
  }

  upsertLocalCustomEvent(activeProfile.id, {
    event_id: eventData.event_id,
    event_name: eventData.event_name,
    created_at: eventData.created_at,
    starts_at: eventData.starts_at,
    ends_at: eventData.ends_at
  });

  setStatusText(status, 'Du gick med i eventet!', false);
  document.getElementById('joinHash').value = '';
  await loadMyCustomEvents();
}

function getPresetEvents(year) {
  const midsummer = getMidsummerEve(year);
  return [
    { id: 'lundakarnevalen', name: 'Lundakarnevalen (Lund)', city: 'Lund', start: dateAt(year, 5, 22), end: dateAt(year, 5, 24, 23, 59) },
    { id: 'valborg', name: 'Valborg (Uppsala)', city: 'Uppsala', start: dateAt(year, 4, 30), end: dateAt(year, 4, 30, 23, 59) },
    { id: 'forsta-maj', name: 'Forsta maj (Sverige)', city: 'Sverige', start: dateAt(year, 5, 1), end: dateAt(year, 5, 1, 23, 59) },
    { id: 'nationaldagen', name: 'Nationaldagen (Sverige)', city: 'Sverige', start: dateAt(year, 6, 6), end: dateAt(year, 6, 6, 23, 59) },
    { id: 'midsommar', name: 'Midsommarafton (Sverige)', city: 'Sverige', start: dateAt(year, midsummer.month, midsummer.day), end: dateAt(year, midsummer.month, midsummer.day, 23, 59) },
    { id: 'nyarsafton', name: 'Nyarsafton (Sverige)', city: 'Sverige', start: dateAt(year, 12, 31), end: dateAt(year, 12, 31, 23, 59) },
    { id: 'uppsala-reggae', name: 'Uppsala Reggae Festival', city: 'Uppsala', start: dateAt(year, 7, 25), end: dateAt(year, 7, 27, 23, 59) },
    { id: 'kulturnatten-uppsala', name: 'Kulturnatten Uppsala', city: 'Uppsala', start: dateAt(year, 9, 13), end: dateAt(year, 9, 13, 23, 59) },
    { id: 'wow', name: 'Way Out West', city: 'Goteborg', start: dateAt(year, 8, 7), end: dateAt(year, 8, 9, 23, 59) },
    { id: 'kulturkalaset', name: 'Kulturkalaset', city: 'Goteborg', start: dateAt(year, 8, 13), end: dateAt(year, 8, 17, 23, 59) },
    { id: 'stockholm-pride', name: 'Stockholm Pride', city: 'Stockholm', start: dateAt(year, 8, 4), end: dateAt(year, 8, 10, 23, 59) },
    { id: 'kulturfestivalen', name: 'Kulturfestivalen (Stockholm)', city: 'Stockholm', start: dateAt(year, 8, 13), end: dateAt(year, 8, 17, 23, 59) },
    { id: 'studenten', name: 'Studenten (Sverige)', city: 'Sverige', start: dateAt(year, 6, 12), end: dateAt(year, 6, 12, 23, 59) },
    { id: 'day-at-the-park', name: 'A Day at the Park', city: 'Sverige', start: dateAt(year, 7, 3), end: dateAt(year, 7, 4, 23, 59) }
  ];
}

async function getSwedishPublicHolidays() {
  try {
    const currentYear = new Date().getFullYear();
    const nextYear = currentYear + 1;
    const response = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${currentYear}/SE`);
    const holidays = await response.json();
    const nextYearResponse = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${nextYear}/SE`);
    const nextYearHolidays = await nextYearResponse.json();

    const allHolidays = [...holidays, ...nextYearHolidays];
    const now = new Date();

    return allHolidays
      .filter(holiday => {
        const holidayDate = new Date(holiday.date);
        holidayDate.setHours(23, 59, 59, 999);
        return holidayDate >= now;
      })
      .map(holiday => ({
        id: `holiday-${holiday.date}`,
        name: `${holiday.localName} (Sverige)`,
        city: 'Sverige',
        start: new Date(holiday.date + 'T00:00:00'),
        end: new Date(holiday.date + 'T23:59:59')
      }));
  } catch (error) {
    return [];
  }
}

function dateAt(year, month, day, hour = 0, minute = 0) {
  return new Date(year, month - 1, day, hour, minute, 0, 0);
}

function getMidsummerEve(year) {
  for (let day = 19; day <= 25; day++) {
    const date = new Date(year, 5, day);
    if (date.getDay() === 5) return { month: 6, day: day };
  }
  return { month: 6, day: 20 };
}

async function getAllPresetEvents() {
  const year = new Date().getFullYear();
  const now = new Date();
  const windowEnd = new Date(now.getTime() + 150 * 24 * 60 * 60 * 1000);
  const presetEvents = getPresetEvents(year)
    .filter(evt => evt.end >= now && evt.start <= windowEnd);
  const nextYearPresetEvents = getPresetEvents(year + 1)
    .filter(evt => evt.end >= now && evt.start <= windowEnd);
  const publicHolidays = await getSwedishPublicHolidays();
  const allEvents = [...presetEvents, ...nextYearPresetEvents, ...publicHolidays]
    .filter(evt => evt.end >= now && evt.start <= windowEnd)
    .sort((a, b) => a.start - b.start);

  const eventMap = new Map();
  allEvents.forEach(evt => {
    const key = `${evt.id}-${evt.start.getFullYear()}`;
    if (!eventMap.has(key)) {
      eventMap.set(key, { ...evt, key });
    }
  });

  return Array.from(eventMap.values());
}

function formatRange(start, end) {
  const startText = start.toLocaleDateString('sv-SE', { month: 'short', day: 'numeric' });
  const endText = end.toLocaleDateString('sv-SE', { month: 'short', day: 'numeric' });
  return startText === endText ? startText : `${startText} - ${endText}`;
}

function renderLeaderboard(entries) {
  const list = document.getElementById('eventLeaderboard');
  // The CL leaderboard card was removed; keep the event selector working by
  // no-opping when its list element is not present.
  if (!list) return;
  if (entries.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#5a6570;">Inga deltagare.</p>';
    return;
  }
  const existingItems = new Map(Array.from(list.children).map(item => [item.dataset.playerId, item]));
  const ranked = entries.sort((a, b) => b.cl - a.cl);
  ranked.forEach((player, index) => {
    let li = existingItems.get(player.id);
    if (!li) {
      li = document.createElement('li');
      li.dataset.playerId = player.id;
      const img = document.createElement('img');
      img.className = 'profile-img';
      li.appendChild(img);
      const info = document.createElement('div');
      info.innerHTML = `<span style="font-size:1.1em; color:#2C3E50;">#<span class="stat-value rank-value"></span> ${player.name}</span><br><span style="font-size:0.85em; color:#5a6570;">${player.id}</span>`;
      li.appendChild(info);
      const stats = document.createElement('div');
      stats.className = 'badge';
      stats.innerHTML = `<span class="stat-value"></span> cl`;
      li.appendChild(stats);
    }

    const img = li.querySelector('img.profile-img');
    img.src = player.pic || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232C3E50"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
    const rankValue = li.querySelector('.rank-value');
    applyStatUpdate(rankValue, String(index + 1));
    const statValue = li.querySelector('.badge .stat-value');
    applyStatUpdate(statValue, Math.abs(player.cl).toFixed(1));

    list.appendChild(li);
    existingItems.delete(player.id);
  });

  existingItems.forEach(item => item.remove());
}

async function buildEventOptions() {
  const select = document.getElementById('eventSelect');
  select.innerHTML = '';
  const allEvents = await getAllPresetEvents();

  const presetGroup = document.createElement('optgroup');
  presetGroup.label = 'Events (Sverige)';

  allEvents.forEach(evt => {
    const opt = document.createElement('option');
    opt.value = `preset:${evt.key}`;
    opt.textContent = `${evt.name}`;
    presetGroup.appendChild(opt);
  });

  select.appendChild(presetGroup);
  if (select.options.length === 0) return;

  // Default to the event that is happening right now (now within its window) so
  // the board opens on the event a freshly-logged drink will actually count
  // toward. Falls back to the soonest upcoming event when none is active.
  const now = Date.now();
  const ongoing = allEvents.find(evt =>
    evt.start && evt.end && evt.start.getTime() <= now && now <= evt.end.getTime());
  select.value = ongoing ? `preset:${ongoing.key}` : select.options[0].value;
}

async function renderSelectedEvent() {
  const select = document.getElementById('eventSelect');
  const value = select.value;
  const eventMeta = document.getElementById('eventMeta');
  if (!value || !sb) return;

  let startMs, endMs, participantHashes = [];
  let eventName, eventCity = '';

  if (value.startsWith('preset:')) {
    const key = value.split(':')[1];
    const allEvents = await getAllPresetEvents();
    const evt = allEvents.find(e => e.key === key);
    if (!evt) return;
    eventName = evt.name;
    eventCity = evt.city;
    startMs = evt.start.getTime();
    endMs = evt.end.getTime();

    const { data: drinks } = await sb.from('drink_logs')
      .select('player_hash')
      .gte('consumed_at', new Date(startMs).toISOString())
      .lte('consumed_at', new Date(endMs).toISOString());
    if (drinks) participantHashes = Array.from(new Set(drinks.map(d => d.player_hash)));
    setStatusText(eventMeta, `${eventName} - ${eventCity} (${formatRange(new Date(startMs), new Date(endMs))})`, false);
  }

  if (participantHashes.length === 0) {
    renderLeaderboard([]);
    await renderLiveTopFive();
    return;
  }

  const { data: profiles } = await sb.from('profiles').select('*').in('player_hash', participantHashes);
  const { data: drinks } = await sb.from('drink_logs')
    .select('player_hash, grams_alcohol, consumed_at')
    .in('player_hash', participantHashes)
    .gte('consumed_at', new Date(startMs).toISOString())
    .lte('consumed_at', new Date(endMs).toISOString());

  const entries = (profiles || []).map(p => {
    // Actively re-check each drink's date against the event window so only
    // drinks consumed during the selected event count toward its score.
    const pDrinks = (drinks || []).filter(d =>
      d.player_hash === p.player_hash && isDrinkWithinEventWindow(d.consumed_at, startMs, endMs));
    // Count consumption only; "ulta" (negative grams) never lowers an event score.
    const totalGrams = pDrinks.reduce((sum, d) => sum + (d.grams_alcohol > 0 ? d.grams_alcohol : 0), 0);
    return {
      id: p.player_hash,
      name: p.display_name,
      pic: p.avatar_url,
      cl: Math.abs(calculateCl(totalGrams))
    };
  });

  renderLeaderboard(entries);
  await renderLiveTopFive();
}

// Compute every active user's current promille (drinks logged in the last 24h),
// sorted high to low. Shared by the inline top-5 list and the "Visa Alla" window.
async function computeLivePromilleRanking() {
  if (!sb) return [];

  const yesterdayISO = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
  const { data: recentDrinks } = await sb.from('drink_logs').select('*').gte('consumed_at', yesterdayISO);
  if (!recentDrinks || recentDrinks.length === 0) return [];

  const activeHashes = Array.from(new Set(recentDrinks.map(d => d.player_hash)));
  const { data: profiles } = await sb.from('profiles').select('*').in('player_hash', activeHashes);
  if (!profiles) return [];

  return profiles.map(p => {
    const pDrinks = recentDrinks.filter(d => d.player_hash === p.player_hash).map(d => ({
      timestamp: new Date(d.consumed_at).getTime(),
      grams: d.grams_alcohol,
      // abv drives getAbsorptionTime() so the leaderboard absorbs at the
      // same pace as the log graph (omitting it defaults to the fastest rate).
      abv: d.abv
    }));
    const profileObj = { id: p.player_hash, weight: p.weight, gender: p.gender };
    const promille = calculateBACAtTime(pDrinks, profileObj, Date.now());
    return {
      profile: { name: p.display_name, id: p.player_hash, pic: p.avatar_url },
      promille: Math.abs(promille)
    };
  }).filter(r => r.promille > 0).sort((a, b) => b.promille - a.promille);
}

async function renderLiveTopFive() {
  if (!sb) return;
  const list = document.getElementById('liveTopFive');
  if (!list) return;

  const ranked = (await computeLivePromilleRanking()).slice(0, 5);

  if (ranked.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#5a6570;">Inga aktiva promille att visa.</p>';
    return;
  }
  const existingItems = new Map(Array.from(list.children).map(item => [item.dataset.playerId, item]));
  ranked.forEach((entry, index) => {
    let li = existingItems.get(entry.profile.id);
    if (!li) {
      li = document.createElement('li');
      li.dataset.playerId = entry.profile.id;
      const rank = document.createElement('span');
      rank.className = 'rank-badge';
      rank.innerHTML = '<span>#</span>&nbsp;<span class="stat-value rank-value"></span>';
      li.appendChild(rank);
      const img = document.createElement('img');
      img.className = 'profile-img';
      li.appendChild(img);
      const info = document.createElement('div');
      info.className = 'leaderboard-info';
      info.innerHTML = `<span class="leader-name" style="font-size:1.1em; color:#2C3E50;">${entry.profile.name}</span>`;
      li.appendChild(info);
      const stats = document.createElement('div');
      stats.className = 'badge';
      stats.innerHTML = `<span class="stat-value"></span> ‰`;
      li.appendChild(stats);
    }

    const rankBox = li.querySelector('.rank-badge');
    const rankValue = li.querySelector('.rank-value');
    if (rankBox && !rankValue) {
      rankBox.innerHTML = '<span>#</span>&nbsp;<span class="stat-value rank-value"></span>';
    }
    const img = li.querySelector('img.profile-img');
    img.src = entry.profile.pic || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232C3E50"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
    applyStatUpdate(li.querySelector('.rank-value'), String(index + 1));
    const statValue = li.querySelector('.badge .stat-value');
    applyStatUpdate(statValue, Math.abs(entry.promille).toFixed(2));

    list.appendChild(li);
    existingItems.delete(entry.profile.id);
  });

  existingItems.forEach(item => item.remove());

  // Hard cap: never show more than the top 5, even if two overlapping async
  // refreshes momentarily appended extra rows.
  while (list.children.length > 5) {
    list.removeChild(list.lastChild);
  }
}

function liveRowHtml(entry, index) {
  return '<li style="display:flex;align-items:center;gap:12px;border-bottom:4px solid #E5E9F0;padding:12px 0;font-weight:bold;">'
    + '<span style="display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:42px;border:3px solid #2C3E50;background:#E5E5E5;color:#2C3E50;font-weight:900;box-shadow:2px 2px 0 #2C3E50;flex:0 0 auto;">#' + (index + 1) + '</span>'
    + '<span style="flex:1;min-width:0;"><span style="display:block;font-size:1.05em;color:#2C3E50;word-break:break-word;">' + escapeHtml(entry.profile.name) + '</span></span>'
    + '<span style="margin-left:auto;border:3px solid #2C3E50;background:#FFCC00;padding:4px 8px;font-weight:900;white-space:nowrap;flex:0 0 auto;">' + Math.abs(entry.promille).toFixed(2) + ' ‰</span>'
    + '</li>';
}

// "Visa Alla": show every active user's current promille in an in-page
// JavaScript popup (like the Historik popup). Computes the full ranking first,
// then renders it into a modal — no new browser tab/window is opened.
async function openAllLivePromilleModal() {
  const ranked = await computeLivePromilleRanking();
  let html;
  if (!ranked || ranked.length === 0) {
    html = '<p style="text-align:center; color:#5a6570; font-weight:bold; margin:0;">Inga aktiva promille att visa.</p>';
  } else {
    const rows = ranked.map(liveRowHtml).join('');
    html = '<ul style="list-style:none; padding:0; margin:0;">' + rows + '</ul>';
  }
  if (typeof showListModal === 'function') {
    showListModal('Live Promille', html, { headerBg: '#2A8CFF' });
  }
}

async function initLeaderboard() {
  await buildEventOptions();
  await renderSelectedEvent();
  await renderLiveTopFive();
}

async function initEvents() {
  await loadMyCustomEvents();
  await initLeaderboard();
  initEventsRealtime();
}

function refreshPage() {
  window.location.reload();
}

// Realtime: re-render the selected event leaderboard the moment any drink is
// logged, so the CL counter updates immediately like the Klan list instead of
// only on the slow poll. renderSelectedEvent keeps its event-interval filter,
// so a drink still only counts if it falls inside the event's time window, and
// it also refreshes the live top 5.
var eventsDrinkChannel = null;
var eventsRefreshTimer = null;

function scheduleEventsRefresh() {
  if (eventsRefreshTimer) return;
  eventsRefreshTimer = setTimeout(function() {
    eventsRefreshTimer = null;
    renderSelectedEvent();
  }, 1200);
}

function initEventsRealtime() {
  if (!sb || eventsDrinkChannel) return;
  eventsDrinkChannel = sb.channel('events_drink_logs')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'drink_logs' }, function() {
      scheduleEventsRefresh();
    })
    .subscribe();
}

window.reconnectRealtime = function() {
  if (eventsDrinkChannel) {
    sb.removeChannel(eventsDrinkChannel);
    eventsDrinkChannel = null;
  }
  initEventsRealtime();
};

window.refreshPageData = function() {
  loadMyCustomEvents();
  renderSelectedEvent();
};

initEvents();
setInterval(loadMyCustomEvents, CUSTOM_EVENT_REFRESH_MS);
// renderSelectedEvent re-queries drink_logs and also refreshes the live top 5,
// keeping the leaderboard synced across users/devices without a hard refresh.
setInterval(renderSelectedEvent, 20000);
</script>
