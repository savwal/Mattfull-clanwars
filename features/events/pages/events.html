<script>
const CUSTOM_EVENT_ID_LENGTH = 4;
const LOCAL_CUSTOM_EVENTS_KEY = 'local_custom_events';
const CUSTOM_EVENT_REFRESH_MS = 60000;
const CUSTOM_EVENT_MAX_RANGE_DAYS = 7;

function applyStatUpdate(element, text) {
  if (!element) return;
  if (element.textContent === text) return;
  element.classList.add('stat-bump');
  setTimeout(() => {
    element.textContent = text;
    element.classList.remove('stat-bump');
  }, 50);
}

function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Profile-picture <img> for the in-page popup rows (falls back to the default
// avatar), so the popups match the inline leaderboards.
function avatarImgHtml(pic) {
  const fallback = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232C3E50"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
  return '<img src="' + escapeHtml(pic || fallback) + '" alt="" style="width:42px;height:42px;object-fit:cover;border:3px solid #2C3E50;background:#fff;flex:0 0 auto;">';
}

function parseDateInput(value) {
  if (!value) return null;
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? null : date;
}

function getLocalCustomEvents(profileId) {
  if (!profileId) return [];
  try {
    const all = JSON.parse(localStorage.getItem(LOCAL_CUSTOM_EVENTS_KEY)) || {};
    return Array.isArray(all[profileId]) ? all[profileId] : [];
  } catch (error) {
    return [];
  }
}

function saveLocalCustomEvents(profileId, events) {
  if (!profileId) return;
  const safeEvents = Array.isArray(events) ? events : [];
  let all = {};
  try {
    all = JSON.parse(localStorage.getItem(LOCAL_CUSTOM_EVENTS_KEY)) || {};
  } catch (error) {
    all = {};
  }
  all[profileId] = safeEvents;
  localStorage.setItem(LOCAL_CUSTOM_EVENTS_KEY, JSON.stringify(all));
}

function upsertLocalCustomEvent(profileId, event) {
  if (!profileId || !event) return [];
  const events = getLocalCustomEvents(profileId);
  const index = events.findIndex(item => item.event_id === event.event_id);
  if (index >= 0) {
    events[index] = { ...events[index], ...event };
  } else {
    events.push(event);
  }
  saveLocalCustomEvents(profileId, events);
  return events;
}

function removeLocalCustomEvent(profileId, eventId) {
  if (!profileId || !eventId) return [];
  const events = getLocalCustomEvents(profileId).filter(evt => evt.event_id !== eventId);
  saveLocalCustomEvents(profileId, events);
  return events;
}

function setStatusText(element, message, isError) {
  if (!element) return;
  element.textContent = message;
  element.classList.toggle('error-text', Boolean(isError));
}

async function fetchCustomEventsForUser(userId) {
  if (!userId || !sb) return [];

  const { data } = await sb.from('event_participants')
    .select('event_id, events(id, name, created_at, start_time, end_time)')
    .eq('player_hash', userId);

  const eventMap = new Map();
  (data || []).forEach(row => {
    if (row.events && row.events.id) {
      eventMap.set(row.events.id, {
        event_id: row.events.id,
        event_name: row.events.name,
        created_at: row.events.created_at,
        starts_at: row.events.start_time,
        ends_at: row.events.end_time
      });
    }
  });

  return Array.from(eventMap.values());
}

async function fetchCustomEvent(eventId) {
  if (!eventId || !sb) return null;
  const { data, error } = await sb.from('events')
    .select('id, name, created_at, start_time, end_time')
    .eq('id', eventId)
    .single();
  if (error || !data) return null;
  return {
    event_id: data.id,
    event_name: data.name,
    created_at: data.created_at,
    starts_at: data.start_time,
    ends_at: data.end_time
  };
}

function formatCustomRange(startsAt, endsAt) {
  if (!startsAt && !endsAt) return 'Pågående';
  const start = startsAt ? new Date(startsAt) : null;
  const end = endsAt ? new Date(endsAt) : null;
  if (start && end) {
    const startText = start.toLocaleDateString('sv-SE', { month: 'short', day: 'numeric' });
    const endText = end.toLocaleDateString('sv-SE', { month: 'short', day: 'numeric' });
    return startText === endText ? startText : `${startText} - ${endText}`;
  }
  if (start) return `${start.toLocaleDateString('sv-SE')} - Pågående`;
  return `Pågående - ${end.toLocaleDateString('sv-SE')}`;
}

function renderMyCustomEvents(events) {
  const list = document.getElementById('myCustomEventsList');
  const empty = document.getElementById('noCustomEventsMessage');
  list.innerHTML = '';
  if (!events || events.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  events.forEach(evt => {
    const li = document.createElement('li');
    const meta = formatCustomRange(evt.starts_at, evt.ends_at);
    li.innerHTML = `
      <div>
        <strong>${evt.event_name}</strong><br>
        <span style="color:#5a6570; font-size:0.9em;">${meta}</span>
      </div>
      <div>
        <div class="badge" style="margin-bottom:6px;">${evt.event_id}</div>
        <button style="width:auto; padding:6px 10px; font-size:12px;" onclick="openCustomEventPage('${evt.event_id}')">Öppna</button>
      </div>
    `;
    list.appendChild(li);
  });
}

async function loadMyCustomEvents() {
  const activeProfile = getActiveProfile();
  const listEl = document.getElementById('myCustomEventsList');
  const emptyEl = document.getElementById('noCustomEventsMessage');
  if (listEl) listEl.innerHTML = '<li class="loading-row"><span class="loading-spinner"></span> Laddar...</li>';
  if (emptyEl) emptyEl.style.display = 'none';
  if (!activeProfile) {
    renderMyCustomEvents([]);
    return [];
  }
  const localEvents = getLocalCustomEvents(activeProfile.id);
  const remoteEvents = await fetchCustomEventsForUser(activeProfile.id);
  const remoteIds = new Set((remoteEvents || []).map(evt => evt.event_id));

  // Local-only events are those in localStorage but not returned by the DB
  // participation query. Validate them against the events table so deleted
  // events are pruned rather than displayed forever.
  let localOnly = (localEvents || []).filter(evt => !remoteIds.has(evt.event_id));
  if (localOnly.length > 0 && sb) {
    const localIds = localOnly.map(evt => evt.event_id);
    const { data: existingRows } = await sb.from('events').select('id').in('id', localIds);
    const existingSet = new Set((existingRows || []).map(r => r.id));
    localOnly = localOnly.filter(evt => existingSet.has(evt.event_id));
  }
  // Persist the pruned list so stale entries don't reappear after navigation.
  if (localOnly.length !== (localEvents || []).filter(evt => !remoteIds.has(evt.event_id)).length) {
    saveLocalCustomEvents(activeProfile.id, localOnly);
  }

  const combined = [...localOnly, ...(remoteEvents || [])];

  // Hide expired events (end time in the past) — they are no longer active.
  const now = new Date();
  const active = combined.filter(evt => !evt.ends_at || new Date(evt.ends_at) >= now);

  renderMyCustomEvents(active);
  return active;
}

// Holds the currently-open custom event popup so "Lämna event" can close it.
let currentCustomEventOverlay = null;

// Open a custom event's details + leaderboard in an in-page popup instead of
// navigating to custom_events.html. Shows when it starts/ends, the participants
// ranked by consumed cl, and a "Lämna event" button for members.
async function openCustomEventModal(eventId) {
  if (!eventId || !sb || typeof showLoadingModal !== 'function') return;
  // Open immediately with a spinner so the tap never feels dead. Track the
  // overlay right away so "Lämna event" can still close it.
  const overlay = showLoadingModal('Custom Event', { headerBg: '#2A8CFF' });
  currentCustomEventOverlay = overlay;
  if (typeof ensureSupabaseAuth === 'function') await ensureSupabaseAuth();

  const event = await fetchCustomEvent(eventId);
  if (!event) {
    updateModalBody(overlay, '<p style="text-align:center; color:#E74C3C; font-weight:bold; margin:0;">Kunde inte ladda eventet. Försök igen.</p>');
    return;
  }

  const { data: partRows } = await sb.from('event_participants')
    .select('player_hash')
    .eq('event_id', eventId);
  const hashes = Array.from(new Set((partRows || []).map(r => r.player_hash)));

  const activeProfile = getActiveProfile();
  const isMember = !!(activeProfile && hashes.indexOf(activeProfile.id) !== -1);

  const profileMap = {};
  if (hashes.length > 0) {
    const profiles = await window.sharedData.getProfiles(hashes);
    hashes.forEach(h => {
      const p = profiles[h];
      if (p) profileMap[h] = { name: p.display_name, pic: p.avatar_url };
    });
  }

  const startMs = event.starts_at ? new Date(event.starts_at).getTime() : NaN;
  const endMs = event.ends_at ? new Date(event.ends_at).getTime() : NaN;

  const gramsByHash = {};
  if (hashes.length > 0) {
    const hashSet = new Set(hashes);
    const allDrinks = await window.sharedData.getDrinkLogs();
    (allDrinks || []).forEach(d => {
      if (!hashSet.has(d.player_hash)) return;
      // Only count drinks consumed inside the event window. "ulta" (negative
      // grams) never lowers an event score.
      if (!isDrinkWithinEventWindow(d.consumed_at, startMs, endMs)) return;
      const grams = window.sharedData.resolveDrinkGrams(d);
      if (grams > 0) gramsByHash[d.player_hash] = (gramsByHash[d.player_hash] || 0) + grams;
    });
  }

  const entries = hashes.map(h => ({
    id: h,
    name: profileMap[h] ? profileMap[h].name : h,
    pic: profileMap[h] ? profileMap[h].pic : null,
    cl: Math.abs(calculateCl(gramsByHash[h] || 0))
  })).sort((a, b) => b.cl - a.cl);

  const startLabel = event.starts_at ? new Date(event.starts_at).toLocaleString('sv-SE') : 'Okänt';
  const endLabel = event.ends_at ? new Date(event.ends_at).toLocaleString('sv-SE') : 'Okänt';

  let html = '';
  html += '<div style="margin-bottom:14px; font-weight:bold;">';
  html += '<div style="margin-bottom:8px;">Kod: <span style="border:3px solid #2C3E50; background:#FFCC00; color:#2C3E50; padding:2px 8px; font-weight:900;">' + escapeHtml(event.event_id) + '</span></div>';
  html += '<div style="font-size:0.9em; color:#5a6570;">Börjar: ' + escapeHtml(startLabel) + '</div>';
  html += '<div style="font-size:0.9em; color:#5a6570;">Slutar: ' + escapeHtml(endLabel) + '</div>';
  html += '</div>';
  if (isMember) {
    html += '<button type="button" onclick="leaveCustomEventFromModal(\'' + event.event_id + '\')" style="background:#E74C3C; color:#FFF; width:100%; margin:0 0 14px 0;">Lämna event</button>';
  }
  if (entries.length === 0) {
    html += '<p style="text-align:center; color:#5a6570; font-weight:bold; margin:0;">Inga deltagare.</p>';
  } else {
    html += '<ul style="list-style:none; padding:0; margin:0;">' + entries.map(eventClRowHtml).join('') + '</ul>';
  }

  updateModalTitle(overlay, event.event_name || 'Custom Event');
  updateModalBody(overlay, html);
}

// Leave the custom event shown in the popup, then close the popup and refresh.
async function leaveCustomEventFromModal(eventId) {
  const activeProfile = getActiveProfile();
  if (!sb || !eventId || !activeProfile) return;
  const confirmed = (typeof showConfirmModal === 'function')
    ? await showConfirmModal('Vill du lämna eventet?', { title: 'Lämna event', confirmText: 'Lämna' })
    : true;
  if (!confirmed) return;
  if (typeof ensureSupabaseAuth === 'function') await ensureSupabaseAuth();
  const { error } = await sb.from('event_participants')
    .delete()
    .eq('event_id', eventId)
    .eq('player_hash', activeProfile.id);
  if (error) {
    console.error('Error leaving event:', error);
    alert('Kunde inte lämna eventet.');
    return;
  }
  if (typeof removeLocalCustomEvent === 'function') removeLocalCustomEvent(activeProfile.id, eventId);
  if (currentCustomEventOverlay && currentCustomEventOverlay.parentNode) {
    currentCustomEventOverlay.parentNode.removeChild(currentCustomEventOverlay);
  }
  currentCustomEventOverlay = null;
  await loadMyCustomEvents();
}

// Replaces the old redirect to custom_events.html — opens the in-page popup.
function openCustomEventPage(eventId) {
  if (!eventId) return;
  openCustomEventModal(eventId);
}

async function createCustomEvent(btn) {
  return runWithButtonLock(btn, () => createCustomEventImpl());
}
async function createCustomEventImpl() {
  const name = document.getElementById('customName').value.trim();
  const startValue = document.getElementById('customStart').value;
  const endValue = document.getElementById('customEnd').value;
  const activeProfile = getActiveProfile();
  const info = document.getElementById('customHashInfo');
  setStatusText(info, '', false);

  if (!name || !activeProfile || !sb) return;

  const startDate = parseDateInput(startValue);
  const endDate = parseDateInput(endValue);
  if (!startDate || !endDate || endDate <= startDate) {
    setStatusText(info, 'Ogiltigt datumintervall.', true);
    return;
  }

  const maxRangeMs = CUSTOM_EVENT_MAX_RANGE_DAYS * 24 * 60 * 60 * 1000;
  if (endDate.getTime() - startDate.getTime() > maxRangeMs) {
    setStatusText(info, 'Inte möjligt just nu. Max 7 dagar!', true);
    return;
  }

  const charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ0123456789";
  let eventId = "";
  for (let i = 0; i < CUSTOM_EVENT_ID_LENGTH; i++) {
    eventId += charset.charAt(Math.floor(Math.random() * charset.length));
  }
  const createdAt = new Date().toISOString();

  if (typeof ensureSupabaseAuth === 'function') {
    await ensureSupabaseAuth();
  }

  await syncProfileToSupabase(activeProfile);

  const { error: eventError } = await sb.from('events').insert({
    id: eventId,
    name: name,
    created_at: createdAt,
    start_time: startDate.toISOString(),
    end_time: endDate.toISOString()
  });

  if (!eventError) {
    await sb.from('event_participants').insert({
      event_id: eventId,
      player_hash: activeProfile.id
    });
    upsertLocalCustomEvent(activeProfile.id, {
      event_id: eventId,
      event_name: name,
      created_at: createdAt,
      starts_at: startDate.toISOString(),
      ends_at: endDate.toISOString()
    });
  } else {
    setStatusText(info, 'Kunde inte skapa event.', true);
    return;
  }

  setStatusText(info, `Event skapat! Kod: ${eventId}`, false);
  document.getElementById('customName').value = '';
  document.getElementById('customStart').value = '';
  document.getElementById('customEnd').value = '';

  await loadMyCustomEvents();
  // Open the new event directly in the in-page popup (no redirect).
  openCustomEventModal(eventId);
}

async function joinCustomEventImpl() {
  const hash = document.getElementById('joinHash').value.trim();
  const status = document.getElementById('joinStatus');
  setStatusText(status, '', false);

  if (!hash || !sb) return;

  const activeProfile = getActiveProfile();
  if (!activeProfile) return;

  // Make sure the auth token is valid (refreshing if it expired) before reading
  // the event and inserting the participant row.
  if (typeof ensureSupabaseAuth === 'function') {
    await ensureSupabaseAuth();
  }

  const eventData = await fetchCustomEvent(hash);
  if (!eventData) {
    setStatusText(status, 'Hittade inte eventet.', true);
    return;
  }

  const { data: existing } = await sb.from('event_participants')
    .select('event_id')
    .eq('event_id', hash)
    .eq('player_hash', activeProfile.id)
    .limit(1);

  if (existing && existing.length > 0) {
    setStatusText(status, 'Du är redan med i eventet.', true);
    return;
  }

  await syncProfileToSupabase(activeProfile);

  const { error: joinError } = await sb.from('event_participants').insert({
    event_id: hash,
    player_hash: activeProfile.id
  });
  if (joinError) {
    console.error('Error joining event:', joinError);
    setStatusText(status, 'Kunde inte gå med i eventet. Försök igen.', true);
    return;
  }

  upsertLocalCustomEvent(activeProfile.id, {
    event_id: eventData.event_id,
    event_name: eventData.event_name,
    created_at: eventData.created_at,
    starts_at: eventData.starts_at,
    ends_at: eventData.ends_at
  });

  setStatusText(status, 'Du gick med i eventet!', false);
  document.getElementById('joinHash').value = '';

}

async function getSwedishPublicHolidays() {
  try {
    const currentYear = new Date().getFullYear();
    const nextYear = currentYear + 1;
    const response = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${currentYear}/SE`);
    const holidays = await response.json();
    const nextYearResponse = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${nextYear}/SE`);
    const nextYearHolidays = await nextYearResponse.json();

    const allHolidays = [...holidays, ...nextYearHolidays];
    const now = new Date();

    return allHolidays
      .filter(holiday => {
        const holidayDate = new Date(holiday.date);
        holidayDate.setHours(23, 59, 59, 999);
        return holidayDate >= now;
      })
      .map(holiday => ({
        id: `holiday-${holiday.date}`,
        name: `${holiday.localName} (Sverige)`,
        city: 'Sverige',
        start: new Date(holiday.date + 'T00:00:00'),
        end: new Date(holiday.date + 'T23:59:59')
      }));
  } catch (error) {
    return [];
  }
}

function dateAt(year, month, day, hour = 0, minute = 0) {
  return new Date(year, month - 1, day, hour, minute, 0, 0);
}

function getMidsummerEve(year) {
  for (let day = 19; day <= 25; day++) {
    const date = new Date(year, 5, day);
    if (date.getDay() === 5) return { month: 6, day: day };
  }
  return { month: 6, day: 20 };
}

async function getAllPresetEvents() {
  const year = new Date().getFullYear();
  const now = new Date();
  // Look back 90 days as well as forward, so the most recent (just-ended) event
  // stays selectable and its previous results can be viewed in the leaderboard.
  const windowStart = new Date(now.getTime() - 90 * 24 * 60 * 60 * 1000);
  const windowEnd = new Date(now.getTime() + 150 * 24 * 60 * 60 * 1000);
  const inWindow = evt => evt.end >= windowStart && evt.start <= windowEnd;
  const prevYearPresetEvents = getPresetEvents(year - 1).filter(inWindow);
  const presetEvents = getPresetEvents(year).filter(inWindow);
  const nextYearPresetEvents = getPresetEvents(year + 1).filter(inWindow);
  const publicHolidays = await getSwedishPublicHolidays();
  const allEvents = [...prevYearPresetEvents, ...presetEvents, ...nextYearPresetEvents, ...publicHolidays]
    .filter(inWindow)
    .sort((a, b) => a.start - b.start);

  const eventMap = new Map();
  allEvents.forEach(evt => {
    const key = `${evt.id}-${evt.start.getFullYear()}`;
    if (!eventMap.has(key)) {
      eventMap.set(key, { ...evt, key });
    }
  });

  return Array.from(eventMap.values());
}

function formatRange(start, end) {
  const startText = start.toLocaleDateString('sv-SE', { month: 'short', day: 'numeric' });
  const endText = end.toLocaleDateString('sv-SE', { month: 'short', day: 'numeric' });
  return startText === endText ? startText : `${startText} - ${endText}`;
}

async function buildEventOptions(allEvents) {
  const select = document.getElementById('eventSelect');
  select.innerHTML = '';
  if (!allEvents) allEvents = await getAllPresetEvents();

  const now = Date.now();
  // Split into upcoming/ongoing ("Kommande") and past ("Tidigare"). Kommande is
  // sorted soonest-first; Tidigare most-recent-first.
  const upcoming = allEvents.filter(evt => evt.end.getTime() >= now).sort((a, b) => a.start - b.start);
  const past = allEvents.filter(evt => evt.end.getTime() < now).sort((a, b) => b.end - a.end);

  function addGroup(label, events) {
    if (!events.length) return;
    const group = document.createElement('optgroup');
    group.label = label;
    events.forEach(evt => {
      const opt = document.createElement('option');
      opt.value = `preset:${evt.key}`;
      opt.textContent = `${evt.name} (${formatRange(evt.start, evt.end)})`;
      group.appendChild(opt);
    });
    select.appendChild(group);
  }

  // "Kommande Event" group is added (and therefore shown) above "Tidigare Event".
  // Only the 4 most recent past events are listed.
  addGroup('Kommande Event', upcoming);
  addGroup('Tidigare Event', past.slice(0, 4));

  if (select.options.length === 0) return;

  // Default to the next future event (soonest start still ahead of now); falls
  // back to the first available option otherwise.
  const nextFuture = upcoming.find(evt => evt.start && evt.start.getTime() > now);
  select.value = nextFuture ? `preset:${nextFuture.key}` : select.options[0].value;
}

let currentEventView = 'live';

// Compute the selected event's date window and each participant's consumed cl
// from drink_logs within that window. A future event has no drinks in its
// window yet, so it returns an empty list (an empty leaderboard).
async function computeEventClRanking() {
  const select = document.getElementById('eventSelect');
  const value = select ? select.value : '';
  if (!value || !sb) return { entries: [], meta: '' };

  let startMs, endMs;
  let meta = '';

  if (value.startsWith('preset:')) {
    const key = value.split(':')[1];
    const allEvents = await getAllPresetEvents();
    const evt = allEvents.find(e => e.key === key);
    if (!evt) return { entries: [], meta: '' };
    startMs = evt.start.getTime();
    endMs = evt.end.getTime();
    meta = `${evt.name} - ${evt.city} (${formatRange(new Date(startMs), new Date(endMs))})`;
  } else {
    return { entries: [], meta: '' };
  }

  // One shared drink_logs fetch; the participants and their scores are both
  // derived from it in JS (no per-window or per-participant drink_logs queries).
  const allDrinks = await window.sharedData.getDrinkLogs();
  const inWindow = (allDrinks || []).filter(d => isDrinkWithinEventWindow(d.consumed_at, startMs, endMs));
  const participantHashes = Array.from(new Set(inWindow.map(d => d.player_hash)));
  if (participantHashes.length === 0) return { entries: [], meta };

  const profileMap = await window.sharedData.getProfiles(participantHashes);

  const gramsByHash = {};
  inWindow.forEach(d => {
    // Count consumption only; "ulta" (negative grams) never lowers an event score.
    const g = window.sharedData.resolveDrinkGrams(d);
    if (g > 0) gramsByHash[d.player_hash] = (gramsByHash[d.player_hash] || 0) + g;
  });

  const entries = participantHashes.map(hash => {
    const p = profileMap[hash];
    return {
      id: hash,
      name: p ? p.display_name : hash,
      pic: p ? p.avatar_url : null,
      cl: Math.abs(calculateCl(gramsByHash[hash] || 0))
    };
  }).sort((a, b) => b.cl - a.cl);

  return { entries, meta };
}

// Compute every active user's current promille (drinks logged in the last 24h),
// sorted high to low. Shared by the inline top-5 list and the "Visa Alla" window.
// Set whenever a live-promille fetch fails, so callers can show a distinct
// error state instead of the misleading "Inga aktiva promille att visa".
let _liveLoadError = false;

async function computeLivePromilleRanking() {
  if (!sb) return [];

  const since = Date.now() - 24 * 60 * 60 * 1000;
  // One shared drink_logs fetch (cached across cards/pages), filtered to the
  // last 24h in JS. The shared layer keeps the last good data on error, so the
  // board is never blanked by a transient failure.
  const allDrinks = await window.sharedData.getDrinkLogs();
  const recentDrinks = (allDrinks || []).filter(d => {
    const t = new Date(d.consumed_at).getTime();
    return Number.isFinite(t) && t >= since;
  });
  _liveLoadError = false;
  if (recentDrinks.length === 0) return [];

  const activeHashes = Array.from(new Set(recentDrinks.map(d => d.player_hash)));
  const profileMap = await window.sharedData.getProfiles(activeHashes);

  return activeHashes.map(hash => {
    const p = profileMap[hash];
    if (!p) return null;
    const pDrinks = recentDrinks.filter(d => d.player_hash === hash).map(d => ({
      timestamp: new Date(d.consumed_at).getTime(),
      grams: d.grams_alcohol,
      // abv drives getAbsorptionTime() so the leaderboard absorbs at the
      // same pace as the log graph (omitting it defaults to the fastest rate).
      abv: d.abv
    }))
    // calculateBACAtTime iterates forward from the FIRST entry, so the drinks
    // must be oldest-first. The shared cache returns rows newest-first, so sort.
    .sort((a, b) => a.timestamp - b.timestamp);
    const profileObj = { id: p.player_hash, weight: p.weight, gender: p.gender };
    const promille = calculateBACAtTime(pDrinks, profileObj, Date.now());
    return {
      profile: { name: p.display_name, id: p.player_hash, pic: p.avatar_url },
      promille: Math.abs(promille)
    };
  }).filter(r => r && r.promille > 0).sort((a, b) => b.promille - a.promille);
}

async function renderLiveTopFive() {
  if (!sb) return;
  const list = document.getElementById('liveTopFive');
  if (!list) return;

  const ranked = (await computeLivePromilleRanking()).slice(0, 5);

  if (ranked.length === 0) {
    // On a fetch error keep any rows already shown; only replace the spinner /
    // empty list with a retry message when there is nothing to preserve.
    if (_liveLoadError) {
      if (list.querySelector('li[data-player-id]')) {
        const spinner = list.querySelector('.loading-row');
        if (spinner) spinner.remove();
        return;
      }
      list.innerHTML = '<p style="text-align:center; color:#E74C3C; font-weight:700;">Kunde inte ladda. <button style="width:auto; padding:6px 10px; margin-top:8px;" onclick="renderLiveTopFive()">Försök igen</button></p>';
      return;
    }
    list.innerHTML = '<p style="text-align:center; color:#5a6570;">Inga aktiva promille att visa.</p>';
    return;
  }
  const existingItems = new Map(Array.from(list.children).map(item => [item.dataset.playerId, item]));
  ranked.forEach((entry, index) => {
    let li = existingItems.get(entry.profile.id);
    if (!li) {
      li = document.createElement('li');
      li.dataset.playerId = entry.profile.id;
      const rank = document.createElement('span');
      rank.className = 'rank-badge';
      rank.innerHTML = '<span class="stat-value rank-value"></span>';
      li.appendChild(rank);
      const img = document.createElement('img');
      img.className = 'profile-img';
      li.appendChild(img);
      const info = document.createElement('div');
      info.className = 'leaderboard-info';
      info.innerHTML = `<span class="leader-name" style="font-size:1.1em; color:#2C3E50;">${entry.profile.name}</span>`;
      li.appendChild(info);
      const stats = document.createElement('div');
      stats.className = 'badge';
      stats.innerHTML = `<span class="stat-value"></span> ‰`;
      li.appendChild(stats);
    }

    const rankBox = li.querySelector('.rank-badge');
    const rankValue = li.querySelector('.rank-value');
    if (rankBox && !rankValue) {
      rankBox.innerHTML = '<span class="stat-value rank-value"></span>';
    }
    if (rankBox) rankBox.style.background = rankBadgeColor(index + 1);
    const img = li.querySelector('img.profile-img');
    img.src = entry.profile.pic || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232C3E50"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
    applyStatUpdate(li.querySelector('.rank-value'), formatRankLabel(index + 1));
    const statValue = li.querySelector('.badge .stat-value');
    applyStatUpdate(statValue, Math.abs(entry.promille).toFixed(2));

    list.appendChild(li);
    existingItems.delete(entry.profile.id);
  });

  existingItems.forEach(item => item.remove());

  // Hard cap: never show more than the top 5, even if two overlapping async
  // refreshes momentarily appended extra rows.
  while (list.children.length > 5) {
    list.removeChild(list.lastChild);
  }
}

    + avatarImgHtml(entry.pic)
    + '<span style="flex:1;min-width:0;"><span style="display:block;font-size:1.05em;color:#2C3E50;word-break:break-word;">' + escapeHtml(entry.name) + '</span></span>'
    + '<span style="margin-left:auto;border:3px solid #2C3E50;background:#FFCC00;padding:4px 8px;font-weight:900;white-space:nowrap;flex:0 0 auto;">' + Math.abs(entry.cl).toFixed(1) + ' cl</span>'
    + '</li>';
}

// "Visa Alla" for the event leaderboard: show every participant's consumed cl
// for the selected event in an in-page popup (same manner as Live Promille).
async function openAllEventClModal() {
  if (typeof showLoadingModal !== 'function') return;
  // Open immediately with a spinner so the tap never feels dead, then fill in.
  const overlay = showLoadingModal('Leaderboard (cl)', { headerBg: '#F39C12' });
  const result = await computeEventClRanking();
  let html;
  if (!result.entries || result.entries.length === 0) {
    html = '<p style="text-align:center; color:#5a6570; font-weight:bold; margin:0;">Inga deltagare.</p>';
  } else {
    html = '<ul style="list-style:none; padding:0; margin:0;">' + result.entries.map(eventClRowHtml).join('') + '</ul>';
  }
  updateModalBody(overlay, html);
}

// Refresh whichever leaderboard is currently visible (Live Promille by default,
// or the event Leaderboard (cl) once an event has been selected).
function refreshActiveEventsView() {
  if (currentEventView === 'event') {
    renderEventLeaderboard();
  } else {
    renderLiveTopFive();
  }
}

async function initLeaderboard() {
  await buildEventOptions();
  await handleEventSelectChange();
}

async function initEvents() {
  await loadMyCustomEvents();
  await initLeaderboard();
}

window.refreshPageData = function() {
  loadMyCustomEvents();
  refreshActiveEventsView();
};

initEvents();
// Gentle polling keeps the boards synced across users/devices without a hard
// refresh. The leaderboard reads the shared drink_logs cache (30s TTL), so these
// polls mostly serve from cache instead of hitting the database — replacing the
// previous per-drink realtime subscription that fired for every user's logs.
setInterval(loadMyCustomEvents, CUSTOM_EVENT_REFRESH_MS);
setInterval(refreshActiveEventsView, 30000);
</script>
</body>
</html>
