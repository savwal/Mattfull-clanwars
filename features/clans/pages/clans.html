  <h2>Hitta din Klan</h2>

  <button onclick="createClan()" style="background: #2ECC71; color: #FFF;">Skapa Ny Klan</button>

    <h2 style="font-family: 'Arial Black'; color: #FFF; background: #2C3E50; margin: -25px -25px 20px -25px; padding: 15px; border-bottom: 4px solid #0984E3;">Klan War</h2>

<script>
let myClanHash = localStorage.getItem('myClanHash') || null;
const activeProfile = getActiveProfile();
let clanChannel = null;
let clanChannelHash = null;

function applyStatUpdate(element, text) {
  if (!element) return;
  if (element.textContent === text) return;
  element.classList.add('stat-bump');
  setTimeout(() => {
    element.textContent = text;
    element.classList.remove('stat-bump');
  }, 50);
}

function initClanRealtime() {
  if (!sb || !myClanHash) return;
  if (clanChannel && clanChannelHash === myClanHash) return;
  if (clanChannel) {
    sb.removeChannel(clanChannel);
    clanChannel = null;
  }
  clanChannelHash = myClanHash;
  clanChannel = sb.channel(`clan_members_${myClanHash}`)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'clan_members', filter: `clan_id=eq.${myClanHash}` }, () => {
      updateClanUI();
    })
    .subscribe();
}

async function syncProfileToSupabase(profile) {
  if (!sb || !profile) return;
  await sb.from('profiles').upsert({
    player_hash: profile.id,
    display_name: profile.name,
    avatar_url: profile.pic,
    weight: profile.weight || null,
    gender: profile.gender || null
  });
}

async function loadOngoingEvent() {
  if (!sb) return;
  
  const now = new Date().toISOString();
  const eventCard = document.getElementById('ongoingEventCard');
  const eventContent = document.getElementById('ongoingEventContent');
  
  try {
    const { data: events } = await sb.from('events')
      .select('id, name, start_time, end_time, hash')
      .lte('start_time', now)
      .gte('end_time', now);
    
    if (!events || events.length === 0) {
      eventCard.style.display = 'none';
      return;
    }
    
    const event = events[0];
    const startDate = new Date(event.start_time);
    const endDate = new Date(event.end_time);
    
    eventContent.innerHTML = `
      <p style="font-weight: bold; color: #2C3E50; margin: 10px 0;">${event.name}</p>
      <p style="margin: 5px 0; color: #7f8c8d;">Börjar: ${startDate.toLocaleString()}</p>
      <p style="margin: 5px 0; color: #7f8c8d;">Slutar: ${endDate.toLocaleString()}</p>
      <p style="margin: 10px 0; font-size: 0.9em; color: #2C3E50;">Ditt klans medlemmar kan delta i detta event!</p>
    `;
    eventCard.style.display = 'block';
  } catch (error) {
    eventCard.style.display = 'none';
  }
}

async function updateClanUI() {
  const noClanView = document.getElementById('noClanView');
  const hasClanView = document.getElementById('hasClanView');

  if (!sb || !activeProfile) {
    noClanView.style.display = 'block';
    hasClanView.style.display = 'none';
    return;
  }

  const { data: myMembership } = await sb.from('clan_members')
    .select('clan_id')
    .eq('player_hash', activeProfile.id)
    .maybeSingle();

  if (myMembership && myMembership.clan_id) {
    myClanHash = myMembership.clan_id;
    localStorage.setItem('myClanHash', myClanHash);
  } else {
    myClanHash = null;
    localStorage.removeItem('myClanHash');
  }

  if (!myClanHash) {
    noClanView.style.display = 'block';
    hasClanView.style.display = 'none';
    if (clanChannel) {
      sb.removeChannel(clanChannel);
      clanChannel = null;
      clanChannelHash = null;
    }
    await renderClanLeaderboard();
    return;
  }

  const { data: clanData, error: clanErr } = await sb.from('clans').select('*').eq('id', myClanHash).single();
  
  if (clanErr || !clanData) {
    localStorage.removeItem('myClanHash');
    myClanHash = null;
    noClanView.style.display = 'block';
    hasClanView.style.display = 'none';
    await renderClanLeaderboard();
    return;
  }

  noClanView.style.display = 'none';
  hasClanView.style.display = 'block';
  document.getElementById('clanTitle').innerText = clanData.name;
  document.getElementById('clanHashDisplay').innerText = myClanHash;
  initClanRealtime();

  await loadOngoingEvent();

  const { data: membersData } = await sb.from('clan_members')
    .select('role, player_hash')
    .eq('clan_id', myClanHash);

  let totalElo = 0;
  const list = document.getElementById('clanMembers');
  const existingItems = new Map(Array.from(list.children).map(item => [item.dataset.memberId, item]));

  if (membersData && membersData.length > 0) {
    const memberHashes = membersData.map(m => m.player_hash);
    const { data: profileRows } = await sb.from('profiles')
      .select('player_hash, display_name, avatar_url')
      .in('player_hash', memberHashes);
    const profilesByHash = (profileRows || []).reduce((acc, profile) => {
      acc[profile.player_hash] = profile;
      return acc;
    }, {});

    const { data: drinksData } = await sb.from('drink_logs')
      .select('player_hash, grams_alcohol')
      .in('player_hash', memberHashes);

    let memberScores = {};
    if (drinksData) {
      drinksData.forEach(d => {
        memberScores[d.player_hash] = (memberScores[d.player_hash] || 0) + (d.grams_alcohol || 0);
      });
    }

    let membersList = membersData.map(m => {
      const profile = profilesByHash[m.player_hash];
      let grams = memberScores[m.player_hash] || 0;
      return {
        id: m.player_hash,
        name: profile && profile.display_name ? profile.display_name : m.player_hash,
        pic: profile && profile.avatar_url ? profile.avatar_url : null,
        role: m.role,
        elo: calculateCl(grams)
      };
    });

    membersList.sort((a, b) => b.elo - a.elo).forEach(member => {
      totalElo += member.elo;
      let li = existingItems.get(member.id);
      if (!li) {
        li = document.createElement('li');
        li.dataset.memberId = member.id;
        const img = document.createElement('img');
        img.className = 'profile-img';
        li.appendChild(img);
        const info = document.createElement('div');
        info.className = 'member-info';
        li.appendChild(info);
        const stats = document.createElement('div');
        stats.className = 'member-stats';
        stats.innerHTML = `<span class="stat-value"></span> <span style="font-size:12px; color:#2C3E50;">cl</span>`;
        li.appendChild(stats);
      }

      li.style.background = member.id === activeProfile.id ? 'rgba(46, 204, 113, 0.1)' : '';
      const img = li.querySelector('img.profile-img');
      img.src = member.pic || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232C3E50"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
      const info = li.querySelector('.member-info');
      info.innerHTML = `<span style="font-size:1.1em; color:#2C3E50;">${member.name}</span><br><span style="font-size:0.8em; color:#7f8c8d;">${member.role}</span>`;
      const statValue = li.querySelector('.stat-value');
      applyStatUpdate(statValue, member.elo.toFixed(1));

      list.appendChild(li);
      existingItems.delete(member.id);
    });
  }
  const totalEl = document.getElementById('clanTotalElo');
  applyStatUpdate(totalEl, `${totalElo.toFixed(1)} cl`);
  await renderClanLeaderboard();

  existingItems.forEach(item => item.remove());
}

async function renderClanLeaderboard() {
  const list = document.getElementById('clanLeaderboard');
  if (!list) return;
  const existingItems = new Map(Array.from(list.children).map(item => [item.dataset.clanId, item]));
  if (!sb) {
    list.innerHTML = '<p style="text-align:center; color:#7f8c8d;">Ingen data att visa.</p>';
    return;
  }

  const { data: clans } = await sb.from('clans').select('id, name');
  if (!clans || clans.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#7f8c8d;">Inga klaner att visa.</p>';
    return;
  }

  const { data: members } = await sb.from('clan_members').select('clan_id, player_hash');
  if (!members || members.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#7f8c8d;">Inga klaner att visa.</p>';
    return;
  }

  const memberHashes = Array.from(new Set(members.map(m => m.player_hash)));
  const { data: drinks } = await sb.from('drink_logs')
    .select('player_hash, grams_alcohol')
    .in('player_hash', memberHashes);

  const gramsByPlayer = {};
  (drinks || []).forEach(d => {
    gramsByPlayer[d.player_hash] = (gramsByPlayer[d.player_hash] || 0) + (d.grams_alcohol || 0);
  });

  const gramsByClan = {};
  members.forEach(m => {
    const grams = gramsByPlayer[m.player_hash] || 0;
    gramsByClan[m.clan_id] = (gramsByClan[m.clan_id] || 0) + grams;
  });

  const ranked = clans.map(clan => ({
    id: clan.id,
    name: clan.name,
    cl: calculateCl(gramsByClan[clan.id] || 0)
  }))
    .sort((a, b) => b.cl - a.cl)
    .slice(0, 10);

  if (ranked.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#7f8c8d;">Inga klaner att visa.</p>';
    return;
  }

  ranked.forEach((clan, index) => {
    let li = existingItems.get(clan.id);
    if (!li) {
      li = document.createElement('li');
      li.dataset.clanId = clan.id;
      const info = document.createElement('div');
      info.className = 'member-info';
      li.appendChild(info);
      const stats = document.createElement('div');
      stats.className = 'member-stats';
      stats.innerHTML = `<span class="stat-value"></span> <span style="font-size:12px; color:#2C3E50;">cl</span>`;
      li.appendChild(stats);
    }

    const info = li.querySelector('.member-info');
    info.innerHTML = `<span style="font-size:1.1em; color:#2C3E50;">#${index + 1} ${clan.name}</span><br><span style="font-size:0.8em; color:#7f8c8d;">${clan.id}</span>`;
    const statValue = li.querySelector('.stat-value');
    applyStatUpdate(statValue, clan.cl.toFixed(1));

    list.appendChild(li);
    existingItems.delete(clan.id);
  });

  existingItems.forEach(item => item.remove());
}

function refreshClanUI() {
  updateClanUI();
}

async function createClan() {
  const name = document.getElementById('newClanName').value;
  if (!name || !sb || !activeProfile) return;
  const newHash = generateUniqueHash();
  if (typeof ensureSupabaseAuth === 'function') {
    await ensureSupabaseAuth();
  }
 
  await syncProfileToSupabase(activeProfile);
  
  await sb.from('clans').insert({ id: newHash, name: name });
  await sb.from('clan_members').upsert({ clan_id: newHash, player_hash: activeProfile.id, role: 'Ledare' });
  
  localStorage.setItem('myClanHash', newHash);
  myClanHash = newHash;
  document.getElementById('newClanName').value = '';
  await updateClanUI();
  initClanRealtime();
}

async function joinClan() {
  const hash = document.getElementById('joinClanHash').value.trim();
  if(!hash || !sb || !activeProfile) return;
  
  const { data: clanData } = await sb.from('clans').select('id').eq('id', hash).single();
  if (clanData) {
    await syncProfileToSupabase(activeProfile);
    await sb.from('clan_members').upsert({ clan_id: hash, player_hash: activeProfile.id, role: 'Medlem' });
    
    localStorage.setItem('myClanHash', hash);
    myClanHash = hash;
    updateClanUI();
    initClanRealtime();
  } else {
    alert('Klanen hittades inte!');
  }
}

async function leaveClan() {
  if (myClanHash && sb && activeProfile) {
    await sb.from('clan_members').delete().match({ clan_id: myClanHash, player_hash: activeProfile.id });
  }
  localStorage.removeItem('myClanHash');
  myClanHash = null;
  updateClanUI();
}

function openClanWarModal() {
  if (!myClanHash) return;
  document.getElementById('opponentClanHash').value = '';
  document.getElementById('clanWarModal').style.display = 'block';
}
function closeClanWarModal() {
  document.getElementById('clanWarModal').style.display = 'none';
}
async function startClanWar() {
  const hash = document.getElementById('opponentClanHash').value.trim();
  if (!hash || !sb) return;
  const { data: clanData } = await sb.from('clans').select('id').eq('id', hash).single();
  if (clanData && hash !== myClanHash) {
    await sb.from('battles').insert({ battle_type: 'Clan War', status: 'pending' });
    closeClanWarModal();
    alert('Klan War startat! (Inte fullt implementerat annu)');
  } else {
    alert('Hittade inte klanen.');
  }
}

updateClanUI();
setInterval(updateClanUI, 30000);
</script>
