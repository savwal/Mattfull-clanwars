<script>
var myClanHash = localStorage.getItem('myClanHash') || null;
var activeProfile = getActiveProfile();

// The clan leaderboard (and the member scores + clan total that share this
// period) runs in calendar MONTHLY periods: from the 1st of the month through
// the last day of the current month.
function getClanScorePeriod() {
  var now = new Date();
  var y = now.getFullYear();
  var m = now.getMonth(); // 0–11
  var start = new Date(y, m, 1, 0, 0, 0, 0);
  var end = new Date(y, m + 1, 0, 23, 59, 59, 999);
  return { start: start.toISOString(), end: end.toISOString() };
}

function applyStatUpdate(element, text) {
  if (!element) return;
  if (element.textContent === text) return;
  element.classList.add('stat-bump');
  setTimeout(function() {
    element.textContent = text;
    element.classList.remove('stat-bump');
  }, 50);
}

function formatClanTitle(name) {
  if (!name) return '';
  return name.length > 14
    ? name.slice(0, 14) + '<br>' + name.slice(14)
    : name;
}

// Sum each player's consumed grams within a period from the shared drink_logs
// cache. Consumption only — "ulta" (negative grams) never lowers a score.
function gramsByPlayerInPeriod(allDrinks, period) {
  var start = new Date(period.start).getTime();
  var end = new Date(period.end).getTime();
  var byPlayer = {};
  (allDrinks || []).forEach(function(d) {
    var g = window.sharedData.resolveDrinkGrams(d);
    if (!(g > 0)) return;
    var t = new Date(d.consumed_at).getTime();
    if (!Number.isFinite(t) || t < start || t > end) return;
    byPlayer[d.player_hash] = (byPlayer[d.player_hash] || 0) + g;
  });
  return byPlayer;
}

// Build every clan's score for the period from already-fetched clans + members
// and the per-player grams map (no further DB calls).
// Clan score is mathematically equal to the sum of unique member points displayed in the list.
function buildClanRanking(allClans, allMembers, gramsByPlayer) {
  var clByClan = {};
  var seenInClan = {};
  (allMembers || []).forEach(function(m) {
    if (!m.clan_id || !m.player_hash) return;
    var key = m.clan_id + ':' + m.player_hash;
    if (seenInClan[key]) return;
    seenInClan[key] = true;

    var grams = gramsByPlayer[m.player_hash] || 0;
    var memberCl = Number(Math.abs(calculateCl(grams)).toFixed(1));
    clByClan[m.clan_id] = (clByClan[m.clan_id] || 0) + memberCl;
  });
  return (allClans || []).map(function(clan) {
    var clanTotalCl = Number((clByClan[clan.id] || 0).toFixed(1));
    return { id: clan.id, name: clan.name, cl: clanTotalCl };
  }).sort(function(a, b) { return b.cl - a.cl; });
}

async function loadOngoingEvent() {
  if (!sb) return;
  var now = new Date().toISOString();
  var eventCard = document.getElementById('ongoingEventCard');
  var eventContent = document.getElementById('ongoingEventContent');
  try {
    var result = await sb.from('events')
      .select('id, name, start_time, end_time')
      .lte('start_time', now)
      .gte('end_time', now);
    var events = result.data;
    if (!events || events.length === 0) {
      eventCard.style.display = 'none';
      return;
    }
    var event = events[0];
    var startDate = new Date(event.start_time);
    var endDate = new Date(event.end_time);
    eventContent.innerHTML =
      '<p style="font-weight: bold; color: #2C3E50; margin: 10px 0;">' + event.name + '</p>' +
      '<p style="margin: 5px 0; color: #5a6570;">Börjar: ' + startDate.toLocaleString() + '</p>' +
      '<p style="margin: 5px 0; color: #5a6570;">Slutar: ' + endDate.toLocaleString() + '</p>' +
      '<p style="margin: 10px 0; font-size: 0.9em; color: #2C3E50;">Ditt klans medlemmar kan delta i detta event!</p>';
    eventCard.style.display = 'block';
  } catch (error) {
    eventCard.style.display = 'none';
  }
}

function hideClanLoading() {
  var el = document.getElementById('clanLoadingView');
  if (el) el.style.display = 'none';
}

async function updateClanUI() {
  var noClanView = document.getElementById('noClanView');
  var hasClanView = document.getElementById('hasClanView');
  var storedClanHash = localStorage.getItem('myClanHash') || null;

  if (!sb || !activeProfile) {
    hideClanLoading();
    noClanView.style.display = 'block';
    hasClanView.style.display = 'none';
    return;
  }

  // ONE fetch of every membership and every clan; my membership, my clan, my
  // clan's members AND the global leaderboard are all derived from these two
  // results. Member scores come from the shared drink_logs cache, so this page
  // no longer issues its own drink_logs/profiles queries per poll.
  var membersResp = await sb.from('clan_members').select('clan_id, player_hash, role');
  var clansResp = await sb.from('clans').select('id, name');
  var allMembers = membersResp.data || [];
  var allClans = clansResp.data || [];
  var membersError = membersResp.error || clansResp.error;

  // Membership resolved — the page now shows a real view in every branch below,
  // so retire the initial loading spinner.
  hideClanLoading();

  var allDrinks = await window.sharedData.getDrinkLogs();
  var gramsByPlayer = gramsByPlayerInPeriod(allDrinks, getClanScorePeriod());
  var ranked = membersError ? null : buildClanRanking(allClans, allMembers, gramsByPlayer);

  // Render the clan leaderboard card immediately so it never gets stuck loading
  try { await renderClanLeaderboard(ranked); } catch (e) {}

  var myMembership = null;
  for (var mi = 0; mi < allMembers.length; mi++) {
    if (allMembers[mi].player_hash === activeProfile.id) { myMembership = allMembers[mi]; break; }
  }

  if (myMembership && myMembership.clan_id) {
    myClanHash = myMembership.clan_id;
    localStorage.setItem('myClanHash', myClanHash);
  } else if (storedClanHash) {
    myClanHash = storedClanHash;
  } else {
    myClanHash = null;
    if (!membersError) {
      localStorage.removeItem('myClanHash');
    }
  }

  if (!myClanHash) {
    noClanView.style.display = 'block';
    hasClanView.style.display = 'none';
    await renderClanLeaderboard(ranked);
    return;
  }

  var clanData = null;
  for (var ci = 0; ci < allClans.length; ci++) {
    if (allClans[ci].id === myClanHash) { clanData = allClans[ci]; break; }
  }

  if (!clanData) {
    // Only forget the clan when the fetch actually succeeded (it's genuinely
    // gone); a failed fetch keeps the stored hash so a transient error doesn't
    // bounce the user back to the "no clan" view.
    if (!membersError) {
      localStorage.removeItem('myClanHash');
      myClanHash = null;
      noClanView.style.display = 'block';
      hasClanView.style.display = 'none';
    }
    await renderClanLeaderboard(ranked);
    return;
  }

  noClanView.style.display = 'none';
  hasClanView.style.display = 'block';
  document.getElementById('clanTitle').innerHTML = formatClanTitle(clanData.name);
  document.getElementById('clanHashDisplay').innerText = myClanHash;

  await loadOngoingEvent();

  var membersData = allMembers.filter(function(m) { return m.clan_id === myClanHash; });
  var seenMemberHash = {};
  var uniqueMembersData = [];
  membersData.forEach(function(m) {
    if (!m.player_hash || seenMemberHash[m.player_hash]) return;
    seenMemberHash[m.player_hash] = true;
    uniqueMembersData.push(m);
  });

  // On a fetch error, don't blank the member list — keep what's already shown so
  // a transient/offline failure can't look like everyone left the clan. Show a
  // retry message only if there is nothing rendered yet.
  if (membersError) {
    var membersListEl = document.getElementById('clanMembers');
    var memLoadingRow = membersListEl.querySelector('.loading-row');
    if (memLoadingRow) memLoadingRow.remove();
    if (!membersListEl.querySelector('li[data-member-id]')) {
      membersListEl.innerHTML = '<p style="text-align:center; color:#E74C3C; font-weight:700;">Kunde inte ladda medlemmar. <button style="width:auto; padding:6px 10px; margin-top:8px;" onclick="safeUpdateClanUI()">Försök igen</button></p>';
    }
    await renderClanLeaderboard(ranked);
    return;
  }

  // A member's personal code (player_hash) is private: only people in the same
  // clan may see it. The viewer is a clan-mate of every member shown here
  // whenever they are themselves a confirmed member of this clan, so in that
  // case all codes are visible (and you can always see your own code).
  var iAmClanMember = false;
  uniqueMembersData.forEach(function(m) { if (m.player_hash === activeProfile.id) iAmClanMember = true; });
  function canSeeMemberHash(memberId) {
    if (memberId === activeProfile.id) return true;
    return iAmClanMember;
  }

  var totalElo = 0;
  var list = document.getElementById('clanMembers');
  var loadingRow = list.querySelector('.loading-row');
  if (loadingRow) loadingRow.remove();
  var existingItems = {};
  var items = list.querySelectorAll('li[data-member-id]');
  for (var i = 0; i < items.length; i++) {
    existingItems[items[i].getAttribute('data-member-id')] = items[i];
  }

  if (uniqueMembersData && uniqueMembersData.length > 0) {
    var memberHashes = uniqueMembersData.map(function(m) { return m.player_hash; });

    // Profiles from the shared, cross-page cache (one fetch for any new hashes).
    var profilesByHash = await window.sharedData.getProfiles(memberHashes);

    var membersList = uniqueMembersData.map(function(m) {
      var profile = profilesByHash[m.player_hash];
      var grams = gramsByPlayer[m.player_hash] || 0;
      var memberCl = Number(Math.abs(calculateCl(grams)).toFixed(1));
      return {
        id: m.player_hash,
        name: profile && profile.display_name ? profile.display_name : m.player_hash,
        pic: profile && profile.avatar_url ? profile.avatar_url : null,
        role: m.role,
        elo: memberCl
      };
    });

    membersList.sort(function(a, b) { return b.elo - a.elo; });

    membersList.forEach(function(member) {
      totalElo += member.elo;
      var li = existingItems[member.id];
      if (!li) {
        li = document.createElement('li');
        li.setAttribute('data-member-id', member.id);
        var img = document.createElement('img');
        img.className = 'profile-img';
        li.appendChild(img);
        var info = document.createElement('div');
        info.className = 'member-info';
        li.appendChild(info);
        var stats = document.createElement('div');
        stats.className = 'member-stats';
        stats.innerHTML = '<span class="stat-value"></span> cl';
        li.appendChild(stats);
      }

      if (member.id === activeProfile.id) {
        li.classList.add('active-user-row');
      } else {
        li.classList.remove('active-user-row');
      }

      var img = li.querySelector('img.profile-img');
      img.src = member.pic || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232C3E50"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
      var info = li.querySelector('.member-info');
      var hashLine = canSeeMemberHash(member.id)
        ? '<span style="display:block; font-size:0.8em; color:#5a6570; overflow-wrap:anywhere; word-break:break-word;">' + member.id + '</span>'
        : '';
      info.innerHTML = '<span style="display:block; font-size:1.1em; color:#2C3E50; overflow-wrap:anywhere; word-break:break-word;">' + member.name + '</span>' + hashLine;
      applyStatUpdate(li.querySelector('.member-stats .stat-value'), Math.abs(member.elo).toFixed(1));

      list.appendChild(li);
      delete existingItems[member.id];
    });

    Object.keys(existingItems).forEach(function(id) { existingItems[id].remove(); });
  } else {
    list.innerHTML = '<p style="text-align:center; color:#5a6570; font-weight:bold;">Inga medlemmar hittades.</p>';
  }

  var clanTotalScore = Number(totalElo.toFixed(1));

  var memberCountEl = document.getElementById('clanMemberCount');
  if (memberCountEl) memberCountEl.innerText = uniqueMembersData ? uniqueMembersData.length : 0;

  var totalEloEl = document.getElementById('clanTotalElo');
  if (totalEloEl) {
    var valSpan = totalEloEl.querySelector('.stat-value');
    if (valSpan) {
      valSpan.textContent = clanTotalScore.toFixed(1);
    } else {
      totalEloEl.textContent = clanTotalScore.toFixed(1) + ' cl';
    }
  }

  var myClanEntry = (ranked || []).find(function(c) { return c.id === myClanHash; });
  if (myClanEntry) {
    myClanEntry.cl = clanTotalScore;
  }

  await renderClanLeaderboard(ranked);
}

function _renderClanRankingInList(list, ranked) {
  if (!list) return;
  var loadingRow = list.querySelector('.loading-row');
  if (loadingRow) loadingRow.remove();
  if (!ranked || ranked.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#5a6570; font-weight:bold; margin:10px 0;">Inga klaner att visa.</p>';
    return;
  }
  var existing = {};
  Array.from(list.querySelectorAll('li[data-clan-id]')).forEach(function(li) {
    existing[li.getAttribute('data-clan-id')] = li;
  });
  ranked.forEach(function(clan, index) {
    var li = existing[clan.id];
    if (!li) {
      li = document.createElement('li');
      li.setAttribute('data-clan-id', clan.id);
      var rankSpan = document.createElement('span');
      rankSpan.className = 'rank-badge';
      var info = document.createElement('div');
      info.className = 'leaderboard-info';
      var name = document.createElement('span');
      name.className = 'leader-name';
      var hashEl = document.createElement('span');
      hashEl.className = 'leader-hash';
      var badge = document.createElement('div');
      badge.className = 'badge';
      badge.innerHTML = '<span class="stat-value"></span> cl';
      info.appendChild(name);
      info.appendChild(hashEl);
      li.appendChild(rankSpan);
      li.appendChild(info);
      li.appendChild(badge);
    }
    li.querySelector('.rank-badge').textContent = formatRankLabel(index + 1);
    li.querySelector('.rank-badge').style.background = rankBadgeColor(index + 1);
    li.querySelector('.leader-name').textContent = clan.name;
    li.querySelector('.leader-hash').textContent = clan.id;
    var statValEl = li.querySelector('.badge .stat-value');
    if (statValEl) statValEl.textContent = Math.abs(clan.cl).toFixed(1);

    if (myClanHash && clan.id === myClanHash) {
      li.classList.add('active-user-row');
    } else {
      li.classList.remove('active-user-row');
    }

    list.appendChild(li);
    delete existing[clan.id];
  });
  Object.keys(existing).forEach(function(id) { existing[id].remove(); });
}

// Compute every clan's score for the current period, sorted high to low.
// Used standalone by the "Visa Alla" modal: fetches clans + members, then scores
// them from the shared drink_logs cache (no per-clan drink_logs queries).
async function computeClanRanking() {
  if (!sb) return null;
  try {
    var clansResult = await sb.from('clans').select('id, name');
    if (clansResult.error) return null;
    var clans = clansResult.data;
    if (!clans || clans.length === 0) return [];

    var membersResult = await sb.from('clan_members').select('clan_id, player_hash');
    if (membersResult.error) return null;
    var members = membersResult.data;
    if (!members || members.length === 0) return [];

    var allDrinks = await window.sharedData.getDrinkLogs();
    var gramsByPlayer = gramsByPlayerInPeriod(allDrinks, getClanScorePeriod());
    return buildClanRanking(clans, members, gramsByPlayer);
  } catch (e) {
    return null;
  }
}

// Render the inline top-5 clan leaderboard. updateClanUI passes the ranking it
// already computed (from its single clans/members fetch) so no extra queries are
// made; called with no argument it computes a fresh ranking itself.
async function renderClanLeaderboard(ranked) {
  var list = document.getElementById('clanLeaderboard');
  if (!list) return;

  var cached = window.leaderboardCache ? window.leaderboardCache.get('clanRanking') : null;

  if (typeof ranked === 'undefined') {
    // Serve cached data instantly while a fresh ranking is computed.
    if (cached && cached.length > 0) _renderClanRankingInList(list, cached.slice(0, 5));
    ranked = await computeClanRanking();
  }

  if (ranked === null) {
    if (!cached) list.innerHTML = '<p style="text-align:center; color:#5a6570;">Ingen data att visa.</p>';
    return;
  }
  if (ranked.length === 0) {
    if (!cached || cached.length === 0) list.innerHTML = '<p style="text-align:center; color:#5a6570;">Inga klaner att visa.</p>';
    return;
  }

  if (window.leaderboardCache) window.leaderboardCache.set('clanRanking', ranked);
  // Only the top 5 are shown inline; "Visa Alla" opens the full list in a window.
  _renderClanRankingInList(list, ranked.slice(0, 5));
}

function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// "Visa Alla": show every clan in an in-page JavaScript popup (like the Historik
// popup). Computes the full ranking first, then renders it into a modal — no new
// browser tab/window is opened.
function clanRowHtml(clan, index) {
  return '<li style="display:flex;align-items:center;gap:12px;border-bottom:4px solid #E5E9F0;padding:12px 0;font-weight:bold;">'
    + '<span style="display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:42px;border:3px solid #2C3E50;background:' + rankBadgeColor(index + 1) + ';color:#2C3E50;font-weight:900;box-shadow:2px 2px 0 #2C3E50;flex:0 0 auto;">' + formatRankLabel(index + 1) + '</span>'
    + '<span style="flex:1;min-width:0;"><span style="display:block;font-size:1.05em;color:#2C3E50;word-break:break-word;">' + escapeHtml(clan.name) + '</span>'
    + '<span style="display:block;font-size:0.8em;color:#5a6570;">' + escapeHtml(clan.id) + '</span></span>'
    + '<span style="margin-left:auto;border:3px solid #2C3E50;background:#FFCC00;padding:4px 8px;font-weight:900;white-space:nowrap;flex:0 0 auto;">' + Math.abs(clan.cl).toFixed(1) + ' cl</span>'
    + '</li>';
}

async function openAllClansModal() {
  if (typeof showLoadingModal !== 'function') return;
  // Open immediately with a spinner so the tap never feels dead, then fill in.
  var overlay = showLoadingModal('Alla Klaner', { headerBg: '#9B59B6' });
  var fullRanked = await computeClanRanking();
  var html;
  if (fullRanked === null) {
    html = '<p style="text-align:center; color:#E74C3C; font-weight:bold; margin:0;">Kunde inte ladda klaner. Kontrollera din anslutning och försök igen.</p>';
  } else if (fullRanked.length === 0) {
    html = '<p style="text-align:center; color:#5a6570; font-weight:bold; margin:0;">Inga klaner att visa.</p>';
  } else {
    var rows = fullRanked.map(clanRowHtml).join('');
    html = '<ul style="list-style:none; padding:0; margin:0;">' + rows + '</ul>';
  }
  updateModalBody(overlay, html);
}

// A player belongs to a single clan. Clear every existing membership before joining
// another so the membership lookup (maybeSingle) never sees duplicate rows.
async function clearMyClanMemberships() {
  if (!sb || !activeProfile) return;
  await sb.from('clan_members').delete().eq('player_hash', activeProfile.id);
  await sb.from('clan_participants').delete().eq('player_hash', activeProfile.id);
}

async function createClan(btn) {
  return runWithButtonLock(btn, function() { return createClanImpl(); });
}
async function createClanImpl() {
  var name = document.getElementById('newClanName').value;
  if (!name || !sb || !activeProfile) return;
  var newHash = generateUniqueHash();
  if (typeof ensureSupabaseAuth === 'function') {
    await ensureSupabaseAuth();
  }
  await syncProfileToSupabase(activeProfile);
  await sb.from('clans').insert({ id: newHash, name: name });
  await clearMyClanMemberships();
  await sb.from('clan_members').upsert({ clan_id: newHash, player_hash: activeProfile.id, role: 'Ledare' });
  localStorage.setItem('myClanHash', newHash);
  myClanHash = newHash;
  document.getElementById('newClanName').value = '';
  await updateClanUI();
}

async function joinClan(btn) {
  return runWithButtonLock(btn, function() { return joinClanImpl(); });
}
async function joinClanImpl() {
  var hash = document.getElementById('joinClanHash').value.trim();
  if (!hash || !sb || !activeProfile) return;
  var clanResult = await sb.from('clans').select('id').eq('id', hash).single();
  var clanData = clanResult.data;
  if (clanData) {
    if (typeof ensureSupabaseAuth === 'function') {
      await ensureSupabaseAuth();
    }
    await syncProfileToSupabase(activeProfile);
    await clearMyClanMemberships();
    await sb.from('clan_members').upsert({ clan_id: hash, player_hash: activeProfile.id, role: 'Medlem' });
    localStorage.setItem('myClanHash', hash);
    myClanHash = hash;
    document.getElementById('joinClanHash').value = '';
    await updateClanUI();
  } else {
    alert('Klanen hittades inte!');
  }
}

async function leaveClan() {
  var confirmed = await showConfirmModal('Vill du verkligen lämna klanen?', { title: 'Lämna Klan', confirmText: 'Lämna' });
  if (!confirmed) return;
  if (!myClanHash || !sb || !activeProfile) {
    localStorage.removeItem('myClanHash');
    myClanHash = null;
    await updateClanUI();
    return;
  }

  var deleteMembers = await sb.from('clan_members')
    .delete()
    .match({ clan_id: myClanHash, player_hash: activeProfile.id });

  await sb.from('clan_participants')
    .delete()
    .match({ clan_id: myClanHash, player_hash: activeProfile.id });

  if (deleteMembers.error) {
    alert('Kunde inte lämna klanen. Försök igen.');
    return;
  }

  localStorage.removeItem('myClanHash');
  myClanHash = null;
  await updateClanUI();
  alert('Du har lämnat klanen.');
}

function openClanWarModal() {
  if (!myClanHash) return;
  document.getElementById('opponentClanHash').value = '';
  document.getElementById('clanWarModal').style.display = 'block';
}

function closeClanWarModal() {
  document.getElementById('clanWarModal').style.display = 'none';
}

async function startClanWar() {
  var hash = document.getElementById('opponentClanHash').value.trim();
  if (!hash || !sb) return;
  var clanResult = await sb.from('clans').select('id').eq('id', hash).single();
  var clanData = clanResult.data;
  if (clanData && hash !== myClanHash) {
    await sb.from('battles').insert({ battle_type: 'Clan War', status: 'pending' });
    closeClanWarModal();
    alert('Klan War startat! (Inte fullt implementerat annu)');
  } else {
    alert('Hittade inte klanen.');
  }
}

// Refresh hook used by the shared resume/pull-to-refresh helpers.
window.refreshPageData = function() { safeUpdateClanUI(); };

var _updateClanUIRunning = false;
async function safeUpdateClanUI() {
  if (_updateClanUIRunning) return;
  _updateClanUIRunning = true;
  var lockTimeout = setTimeout(function() { _updateClanUIRunning = false; }, 30000);
  try { await updateClanUI(); } catch (e) { console.error('updateClanUI error', e); } finally { clearTimeout(lockTimeout); _updateClanUIRunning = false; }
}

safeUpdateClanUI();
// Leaderboard updates are now pushed via the Supabase Realtime broadcast
// channel (see shared.js). No polling interval needed.
// Returning to the foreground is handled by the shared resume helper
// (resumeRefresh in shared.js): it refreshes the Supabase token before calling
// refreshPageData() -> safeUpdateClanUI(), so a >1h lock can't leave the page
// querying with a dead token.
</script>
