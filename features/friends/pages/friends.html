<script>
let myFriends = [];
const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
let friendsData = {};
let _updateFriendsUIRunning = false;
let _updateFriendsUIPending = false;
// Set when a friends/profiles/drinks fetch fails, so the UI can show a distinct
// "could not load" + retry state instead of the misleading "Inga vänner".
let _friendsLoadError = false;

function applyStatUpdate(element, text) {
  if (!element) return;
  if (element.textContent === text) return;
  element.classList.add('stat-bump');
  setTimeout(() => {
    element.textContent = text;
    element.classList.remove('stat-bump');
  }, 50);
}

async function fetchFriendsData() {
  if (!sb) {
    friendsData = {};
    return;
  }

  const activeProfile = getActiveProfile();
  const leaderboardHashes = Array.from(new Set([
    ...myFriends,
    ...(activeProfile ? [activeProfile.id] : [])
  ]));

  if (leaderboardHashes.length === 0) {
    friendsData = {};
    return;
  }

  // Profiles + drinks both come from the shared, cross-page caches: one profiles
  // fetch for any new hashes and one shared drink_logs fetch (filtered to the
  // last week in JS) instead of a dedicated query on this page. The shared layer
  // keeps the last good data on error, so the boards are never blanked.
  const profileMap = await window.sharedData.getProfiles(leaderboardHashes);
  const allDrinks = await window.sharedData.getDrinkLogs();
  const since = Date.now() - WEEK_MS;
  _friendsLoadError = false;

  friendsData = {};
  leaderboardHashes.forEach(hash => {
    const p = profileMap[hash];
    if (p) {
      friendsData[hash] = {
        profile: { id: p.player_hash, name: p.display_name, pic: p.avatar_url, weight: p.weight, gender: p.gender },
        drinks: []
      };
    }
  });
  if (activeProfile && !friendsData[activeProfile.id]) {
    friendsData[activeProfile.id] = {
      profile: { id: activeProfile.id, name: activeProfile.name, pic: activeProfile.pic, weight: activeProfile.weight, gender: activeProfile.gender },
      drinks: []
    };
  }
  const hashSet = new Set(leaderboardHashes);
  (allDrinks || []).forEach(d => {
    if (!hashSet.has(d.player_hash)) return;
    const t = new Date(d.consumed_at).getTime();
    if (!Number.isFinite(t) || t < since) return;
    if (friendsData[d.player_hash]) {
      friendsData[d.player_hash].drinks.push({
        timestamp: t,
        grams: window.sharedData ? window.sharedData.resolveDrinkGrams(d) : Number(d.grams_alcohol || 0),
        // abv drives getAbsorptionTime() so the leaderboard absorbs at the
        // same pace as the log graph (omitting it defaults to the fastest rate).
        abv: d.abv
      });
    }
  });
}

async function loadFriendsForActiveProfile() {
  const activeProfile = getActiveProfile();
  if (!activeProfile || !sb) {
    myFriends = [];
    friendsData = {};
    return [];
  }

  const { data: friendRows, error } = await sb.from('friends')
    .select('friend_hash')
    .eq('player_hash', activeProfile.id)
    .order('added_at', { ascending: true });

  if (error) {
    // Keep the last known friend list (from localStorage) so an offline/transient
    // failure doesn't blank "Mina vänner".
    _friendsLoadError = true;
    try { myFriends = JSON.parse(localStorage.getItem('myFriendsHashes')) || myFriends; } catch (e) {}
    return myFriends;
  }

  myFriends = (friendRows || [])
    .map(row => row.friend_hash)
    .filter(Boolean);

  localStorage.setItem('myFriendsHashes', JSON.stringify(myFriends));
  return myFriends;
}

function getFriendEntries() {
  return myFriends
    .filter(hash => friendsData[hash])
    .map(hash => ({ hash, profile: friendsData[hash].profile }));
}

function getLeaderboardEntries() {
  const activeProfile = getActiveProfile();
  const hashes = Array.from(new Set([
    ...myFriends,
    ...(activeProfile ? [activeProfile.id] : [])
  ]));
  return hashes
    .filter(hash => friendsData[hash])
    .map(hash => ({ hash, profile: friendsData[hash].profile }));
}

function getHistoryForProfile(profileId) {
  if (friendsData[profileId]) return friendsData[profileId].drinks;
  return [];
}

// Most recent Monday at 00:00 local time — the weekly leaderboard resets here,
// so a new week always starts on Monday regardless of when drinks were logged.
function getWeekStartMs() {
  const now = new Date();
  const day = now.getDay(); // 0=Sunday … 6=Saturday
  const daysFromMonday = day === 0 ? 6 : day - 1;
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysFromMonday, 0, 0, 0, 0);
  return monday.getTime();
}

function getWeeklyCl(profileId) {
  const since = getWeekStartMs();
  const history = getHistoryForProfile(profileId);
  const grams = history.reduce((sum, item) => {
    if (item.grams > 0 && item.timestamp >= since) return sum + item.grams;
    return sum;
  }, 0);
  return calculateCl(grams);
}

function getLivePromille(profile) {
  const history = getHistoryForProfile(profile.id);
  if (!profile.weight || !profile.gender) return null;
  // Only the last 24h affects current promille, so trim before the BAC calc.
  // This keeps calculateBACAtTime cheap and makes the value match the log graph.
  // calculateBACAtTime iterates forward from the first entry, so the drinks must
  // be oldest-first; the shared cache returns rows newest-first, hence the sort.
  const since = Date.now() - 24 * 60 * 60 * 1000;
  const recent = history
    .filter(function(d) { return d.timestamp >= since; })
    .sort(function(a, b) { return a.timestamp - b.timestamp; });
  return calculateBACAtTime(recent, profile, Date.now());
}

function renderWeeklyLeaderboard() {
  const list = document.getElementById('weeklyLeaderboard');
  const loadingRow = list.querySelector('.loading-row');
  if (loadingRow) loadingRow.remove();
  const entries = getLeaderboardEntries();
  if (entries.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#5a6570;">Inga vanner tillagda.</p>';
    return;
  }
  const ranked = entries
    .map(item => ({
      hash: item.hash,
      name: item.profile.name,
      pic: item.profile.pic,
      cl: getWeeklyCl(item.profile.id)
    }))
    .sort((a, b) => b.cl - a.cl);

  const existingItems = new Map(Array.from(list.querySelectorAll('li')).map(item => [item.dataset.friendHash, item]));
  ranked.forEach((friend, index) => {
    let li = existingItems.get(friend.hash);
    if (!li) {
      li = document.createElement('li');
      li.dataset.friendHash = friend.hash;
      const rank = document.createElement('span');
      rank.className = 'rank-box';
      rank.innerHTML = '<span class="stat-value rank-value"></span>';
      li.appendChild(rank);
      const img = document.createElement('img');
      img.className = 'profile-img';
      li.appendChild(img);
      const info = document.createElement('div');
      info.className = 'friend-info';
      info.innerHTML = `<span class="friend-name" style="font-size:1.1em; color:#2C3E50;">${friend.name}</span><span class="friend-hash" style="font-size:0.85em; color:#5a6570;">${friend.hash}</span>`;
      li.appendChild(info);
      const stats = document.createElement('div');
      stats.className = 'stat-pill';
      stats.innerHTML = `<span class="stat-value"></span> cl`;
      li.appendChild(stats);
    }

    const rankBox = li.querySelector('.rank-box');
    const rankValue = li.querySelector('.rank-value');
    if (rankBox && !rankValue) {
      rankBox.innerHTML = '<span class="stat-value rank-value"></span>';
    }
    if (rankBox) rankBox.style.background = rankBadgeColor(index + 1);
    const img = li.querySelector('img.profile-img');
    img.src = friend.pic || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232C3E50"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
    applyStatUpdate(li.querySelector('.rank-value'), formatRankLabel(index + 1));
    const statValue = li.querySelector('.stat-pill .stat-value');
    applyStatUpdate(statValue, Math.abs(friend.cl).toFixed(1));

    const activeProfile = getActiveProfile();
    if (activeProfile && friend.hash === activeProfile.id) {
      li.classList.add('active-user-row');
    } else {
      li.classList.remove('active-user-row');
    }

    list.appendChild(li);
    existingItems.delete(friend.hash);
  });

  existingItems.forEach(item => item.remove());
}

function renderLiveStats() {
  const list = document.getElementById('liveStats');
  const loadingRow = list.querySelector('.loading-row');
  if (loadingRow) loadingRow.remove();
  const entries = getLeaderboardEntries();
  const activeProfile = getActiveProfile();
  if (entries.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#5a6570;">Inga vanner tillagda.</p>';
    return;
  }
  const ranked = entries
    .map(item => ({
      hash: item.hash,
      profile: item.profile,
      promille: getLivePromille(item.profile)
    }))
    .filter(item => item.promille !== null && (item.promille > 0 || (activeProfile && item.hash === activeProfile.id)))
    .sort((a, b) => b.promille - a.promille)
    .slice(0, 5);

  if (ranked.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#5a6570;">Inga aktiva promille att visa.</p>';
    return;
  }

  const existingItems = new Map(Array.from(list.querySelectorAll('li')).map(item => [item.dataset.friendHash, item]));
  ranked.forEach((item, index) => {
    let li = existingItems.get(item.hash);
    if (!li) {
      li = document.createElement('li');
      li.dataset.friendHash = item.hash;

      const rank = document.createElement('span');
      rank.className = 'rank-box';
      rank.innerHTML = '<span class="stat-value rank-value"></span>';
      li.appendChild(rank);

      const img = document.createElement('img');
      img.className = 'profile-img';
      li.appendChild(img);

      const info = document.createElement('div');
      info.className = 'friend-info';
      info.innerHTML = `<span class="friend-row-title">${item.profile.name}</span><span class="friend-row-sub">${item.hash}</span>`;
      li.appendChild(info);

      const stats = document.createElement('div');
      stats.className = 'stat-pill';
      stats.innerHTML = `<span class="stat-value"></span> ‰`;
      li.appendChild(stats);
    }

    const img = li.querySelector('img.profile-img');
    img.src = item.profile.pic || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232C3E50"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';

    const rankBox = li.querySelector('.rank-box');
    if (rankBox) rankBox.style.background = rankBadgeColor(index + 1);
    const rankValue = li.querySelector('.rank-value');
    applyStatUpdate(rankValue, formatRankLabel(index + 1));

    const statValue = li.querySelector('.stat-pill .stat-value');
    applyStatUpdate(statValue, Math.abs(item.promille).toFixed(2));

    const activeProf = getActiveProfile();
    if (activeProf && item.hash === activeProf.id) {
      li.classList.add('active-user-row');
    } else {
      li.classList.remove('active-user-row');
    }

    list.appendChild(li);
    existingItems.delete(item.hash);
  });

  existingItems.forEach(item => item.remove());
}

// Both leaderboards are shown at once (Live Promille above Veckans Leaderboard),
// so render both every time.
function renderViews() {
  renderLiveStats();
  renderWeeklyLeaderboard();
}

async function updateFriendsUI() {
  const list = document.getElementById('friendsList');

  _friendsLoadError = false;
  await loadFriendsForActiveProfile();

  const loadingRow = list.querySelector('.loading-row');
  if (loadingRow) loadingRow.remove();

  if (myFriends.length === 0) {
    if (_friendsLoadError) {
      // Don't blank an existing list on a transient error.
      if (!list.querySelector('li[data-friend-hash]')) {
        list.innerHTML = '<p style="text-align:center; color:#E74C3C; font-weight:700;">Kunde inte ladda vänner. <button style="width:auto; padding:6px 10px; margin-top:8px;" onclick="safeUpdateFriendsUI()">Försök igen</button></p>';
      }
    } else {
      list.innerHTML = '<p style="text-align:center; color:#5a6570;">Inga vänner tillagda. Sök på deras personliga kod!</p>';
    }
    renderViews();
    return;
  }

  const existingEmpty = list.querySelector('p');
  if (existingEmpty) existingEmpty.remove();

  await fetchFriendsData();

  const existingItems = {};
  Array.from(list.querySelectorAll('li[data-friend-hash]')).forEach(li => {
    existingItems[li.dataset.friendHash] = li;
  });

  myFriends.forEach((hash) => {
    const friendObj = friendsData[hash];
    if (!friendObj) return;
    const friend = friendObj.profile;

    let li = existingItems[hash];
    if (!li) {
      li = document.createElement('li');
      li.dataset.friendHash = hash;

      const img = document.createElement('img');
      img.className = 'profile-img';

      const info = document.createElement('div');
      info.className = 'friend-info';

      const delBtn = document.createElement('button');
      delBtn.innerText = 'X';
      delBtn.style.cssText = 'background: #E74C3C; color: white; width: auto; padding: 5px 10px; font-size: 12px; box-shadow: 2px 2px 0px #2C3E50;';
      delBtn.onclick = async () => {
        const current = friendsData[hash];
        const displayName = current ? current.profile.name : hash;
        const confirmed = (typeof showConfirmModal === 'function')
          ? await showConfirmModal(`Vill du ta bort ${displayName} som vän?`, { title: 'Ta bort vän', confirmText: 'Ta bort' })
          : true;
        if (!confirmed) return;
        const activeProfile = getActiveProfile();
        if (!activeProfile || !sb) return;
        const { error: deleteError } = await sb.from('friends').delete().eq('player_hash', activeProfile.id).eq('friend_hash', hash);
        if (deleteError) {
          if (typeof showToast === 'function') showToast('Kunde inte ta bort vännen. Försök igen.', { error: true });
          return;
        }
        // Optimistically drop the friend locally and from the DOM so the list
        // updates immediately — and stays updated even if the refetch below
        // transiently fails (loadFriendsForActiveProfile would otherwise fall back
        // to the cached list that still contains this hash).
        myFriends = myFriends.filter(h => h !== hash);
        localStorage.setItem('myFriendsHashes', JSON.stringify(myFriends));
        delete friendsData[hash];
        li.remove();
        safeUpdateFriendsUI();
      };

      li.appendChild(img);
      li.appendChild(info);
      li.appendChild(delBtn);
    }

    const img = li.querySelector('img.profile-img');
    img.src = friend.pic || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232C3E50"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
    const info = li.querySelector('.friend-info');
    info.innerHTML = `<span class="friend-name" style="font-size:1.1em; color:#2C3E50;">${friend.name}</span><span class="friend-hash" style="font-size:0.8em; color:#5a6570;">Kod: ${hash}</span>`;

    list.appendChild(li);
    delete existingItems[hash];
  });

  Object.values(existingItems).forEach(li => li.remove());

  renderViews();
}

function showFriendModal(title, bodyHtml, headerBg) {
  if (typeof showListModal === 'function') {
    showListModal(title, bodyHtml, { headerBg: headerBg || '#2A8CFF' });
  }
}

async function addFriend(btn) {
  return runWithButtonLock(btn, () => addFriendImpl());
}
async function addFriendImpl() {
  const hash = document.getElementById('friendHash').value.trim();
  if(!hash || !sb) return;

  await loadFriendsForActiveProfile();

  if(myFriends.includes(hash)) {
    showFriendModal(
      'Redan vän',
      '<p style="text-align:center;color:#2C3E50;margin:20px 0;">Du är redan vän med en krigare med den koden!</p>',
      '#F39C12'
    );
    return;
  }

  const { data, error } = await sb.from('profiles').select('player_hash, display_name').eq('player_hash', hash).single();
  if (data) {
    document.getElementById('friendHash').value = '';
    const playerName = data.display_name || hash;

    const activeProfile = getActiveProfile();
    if(activeProfile) {
      await sb.from('friends').insert({ player_hash: activeProfile.id, friend_hash: hash });
      // Optimistically register the new friend locally so the lists update even
      // before the realtime event or the next DB read arrives.
      if (!myFriends.includes(hash)) {
        myFriends.push(hash);
        localStorage.setItem('myFriendsHashes', JSON.stringify(myFriends));
      }
    }

    showFriendModal(
      'Vän tillagd!',
      '<p style="text-align:center;font-size:2em;margin:12px 0;">&#10003;</p>' +
      '<p style="text-align:center;color:#2C3E50;margin:0 0 20px;"><strong>' + playerName + '</strong> har lagts till som vän!</p>',
      '#27AE60'
    );
    // Await so the "Mina vänner" list and both leaderboards are guaranteed to
    // reflect the new friend without needing a hard refresh.
    await safeUpdateFriendsUI();
  } else if (error && error.code && error.code !== 'PGRST116') {
    // A real fetch failure (offline/RLS) — .single() returns PGRST116 only for
    // a genuine "no matching row", so anything else means we couldn't search.
    showFriendModal(
      'Kunde inte söka',
      '<p style="text-align:center;color:#2C3E50;margin:20px 0;">Kunde inte söka just nu. Kontrollera din anslutning och försök igen.</p>',
      '#E74C3C'
    );
  } else {
    showFriendModal(
      'Ingen krigare hittades',
      '<p style="text-align:center;color:#2C3E50;margin:20px 0;">Det finns ingen krigare med den koden. Kontrollera att du har skrivit rätt!</p>',
      '#E74C3C'
    );
  }
}

// Re-pull friends + their drink_logs and re-render the leaderboards in place
// (diff-based renderers, so no flicker). Keeps every viewer's values in sync.
async function refreshFriendsData() {
  await loadFriendsForActiveProfile();
  await fetchFriendsData();
  renderViews();
}

async function safeUpdateFriendsUI() {
  // A call that arrives while one is running must not be silently dropped —
  // otherwise an update triggered right after adding/removing a friend can be
  // lost and the list looks unchanged. Instead, flag a rerun so the latest
  // state is always rendered once the in-flight pass finishes.
  if (_updateFriendsUIRunning) { _updateFriendsUIPending = true; return; }
  _updateFriendsUIRunning = true;
  try {
    do {
      _updateFriendsUIPending = false;
      await updateFriendsUI();
    } while (_updateFriendsUIPending);
  } catch(e) {
    console.error('updateFriendsUI error', e);
  } finally {
    _updateFriendsUIRunning = false;
  }
}

// ---------------------------------------------------------------------------
// QR Code Scanner on Friends Page
// ---------------------------------------------------------------------------
function openQRScanner() {
  var lang = window.i18n ? window.i18n.getLang() : 'sv';
  var overlay = document.createElement('div');
  overlay.className = 'modal';
  overlay.style.cssText = 'display:block;position:fixed;top:0;left:0;width:100%;height:100%;overflow:auto;background-color:rgba(0,0,0,0);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:6000;transition:background-color 200ms ease-out;';
  requestAnimationFrame(function() { overlay.style.backgroundColor = 'rgba(0,0,0,0.5)'; });

  var content = document.createElement('div');
  content.className = 'modal-content card';
  content.style.cssText = 'box-sizing:border-box;width:min(92vw,400px);max-width:92vw;margin:clamp(24px,8vh,80px) auto;background:#FFFFFF;color:#2C3E50;border:1px solid rgba(44,62,80,0.12);border-radius:16px;box-shadow:0 8px 32px rgba(44,62,80,0.18);padding:0;text-align:center;position:relative;opacity:0;transform:translateY(12px) scale(0.97);transition:opacity 200ms ease-out,transform 200ms ease-out;';
  requestAnimationFrame(function() { requestAnimationFrame(function() { content.style.opacity = '1'; content.style.transform = 'translateY(0) scale(1)'; }); });

  var header = document.createElement('h2');
  header.textContent = lang === 'en' ? 'Scan QR Code' : 'Skanna QR-kod';
  header.style.cssText = "font-family:'Arial Black',sans-serif;text-transform:uppercase;color:#FFF;background:#2A8CFF;margin:0;padding:15px 52px 15px 15px;border-bottom:1px solid rgba(255,255,255,0.15);text-align:left;border-radius:16px 16px 0 0;";

  var closeBtn = document.createElement('span');
  closeBtn.className = 'close-modal';
  closeBtn.innerHTML = '&times;';
  closeBtn.style.cssText = 'color:#FFF;font-size:28px;font-weight:bold;cursor:pointer;position:absolute;right:15px;top:10px;line-height:1;z-index:1;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;';

  var body = document.createElement('div');
  body.style.cssText = 'padding:20px;';

  var desc = document.createElement('p');
  desc.textContent = lang === 'en' ? "Point the camera at a friend's QR code to add them." : 'Rikta kameran mot en väns QR-kod för att lägga till dem.';
  desc.style.cssText = 'font-weight:600;color:#5a6570;margin:0 0 16px 0;font-size:14px;';

  var video = document.createElement('video');
  video.setAttribute('playsinline', '');
  video.setAttribute('autoplay', '');
  video.style.cssText = 'width:100%;max-height:300px;border-radius:12px;background:#000;';

  var statusEl = document.createElement('p');
  statusEl.style.cssText = 'font-weight:700;margin:12px 0 0 0;min-height:20px;';

  body.appendChild(desc);
  body.appendChild(video);
  body.appendChild(statusEl);
  content.appendChild(header);
  content.appendChild(closeBtn);
  content.appendChild(body);
  overlay.appendChild(content);
  document.body.appendChild(overlay);

  var stream = null;
  var scanning = true;
  var scanCanvas = document.createElement('canvas');
  var scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });

  function cleanup() {
    scanning = false;
    if (stream) {
      stream.getTracks().forEach(function(t) { t.stop(); });
      stream = null;
    }
    content.style.opacity = '0';
    content.style.transform = 'translateY(8px) scale(0.97)';
    overlay.style.backgroundColor = 'rgba(0,0,0,0)';
    setTimeout(function() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 180);
  }

  closeBtn.addEventListener('click', cleanup);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) cleanup(); });

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function(s) {
    stream = s;
    video.srcObject = stream;
    video.play();
    requestAnimationFrame(scanFrame);
  }).catch(function() {
    statusEl.textContent = lang === 'en' ? 'Could not access the camera.' : 'Kunde inte komma åt kameran.';
    statusEl.style.color = '#E74C3C';
  });

  function scanFrame() {
    if (!scanning) return;
    if (video.readyState !== video.HAVE_ENOUGH_DATA) {
      requestAnimationFrame(scanFrame);
      return;
    }
    scanCanvas.width = video.videoWidth;
    scanCanvas.height = video.videoHeight;
    scanCtx.drawImage(video, 0, 0);
    var imageData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);

    var code = null;
    if (typeof BarcodeDetector !== 'undefined') {
      new BarcodeDetector({ formats: ['qr_code'] }).detect(video).then(function(barcodes) {
        if (barcodes.length > 0 && scanning) {
          handleScannedCode(barcodes[0].rawValue, cleanup, statusEl, lang);
        }
      }).catch(function() {});
    }
    if (typeof jsQR !== 'undefined') {
      code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
      if (code && code.data && scanning) {
        handleScannedCode(code.data, cleanup, statusEl, lang);
        return;
      }
    }
    requestAnimationFrame(scanFrame);
  }
}

async function handleScannedCode(hash, cleanup, statusEl, lang) {
  if (!hash || !sb) return;
  statusEl.textContent = lang === 'en' ? 'Looking up profile...' : 'Söker profil...';

  var profile = await fetchProfileFromSupabase(hash);
  if (!profile) {
    statusEl.textContent = lang === 'en' ? 'Profile not found.' : 'Profilen hittades inte.';
    statusEl.style.color = '#E74C3C';
    return;
  }

  var myProfile = getActiveProfile();
  if (myProfile && myProfile.id === hash) {
    statusEl.textContent = lang === 'en' ? "That's your own code!" : 'Det är din egen kod!';
    statusEl.style.color = '#E74C3C';
    return;
  }

  var confirmMsg = (lang === 'en' ? 'Do you want to add ' : 'Vill du lägga till ') + profile.name + '?';
  var confirmed = await showConfirmModal(confirmMsg, {
    title: lang === 'en' ? 'Friend found!' : 'Vän hittad!',
    confirmText: lang === 'en' ? 'Add' : 'Lägg till',
    cancelText: lang === 'en' ? 'Cancel' : 'Avbryt'
  });

  if (!confirmed) return;

  var myId = myProfile ? myProfile.id : null;
  if (!myId) return;

  var { error } = await sb.from('friends').upsert(
    { player_hash: myId, friend_hash: hash },
    { onConflict: 'player_hash,friend_hash' }
  );

  if (error) {
    statusEl.textContent = lang === 'en' ? 'Error adding friend.' : 'Kunde inte lägga till vän.';
    statusEl.style.color = '#E74C3C';
    return;
  }

  showToast(lang === 'en' ? 'Friend added!' : 'Vän tillagd!');
  cleanup();
  safeUpdateFriendsUI();
}

window.refreshPageData = function() { safeUpdateFriendsUI(); };

safeUpdateFriendsUI();
// Leaderboard updates are now pushed via the Supabase Realtime broadcast
// channel (see shared.js). No polling interval needed.
</script>
