<div class="card">
  <h2>Namn</h2>
  <select id="profileSelect" onchange="loadSelectedProfile()"></select>
  <button onclick="window.location.href='../../register/pages/register.html'" style="background: #2ECC71;">Ny Krigare</button>
</div>
<div class="card" style="text-align:center;">
  <h2>Din Hash</h2>
  <div class="hash-text" id="myHashDisplay"></div>
</div>
<div class="card">
  <h2>Öppna profil via hash</h2>
  <div class="hash-actions">
    <input type="text" id="hashLookup" placeholder="Klistra in hash">
    <button onclick="openProfileByHash()" style="width: auto;">Öppna</button>
  </div>
  <p id="hashLookupStatus" style="font-weight: 900; color:#2C3E50;"></p>
</div>
<div class="card">
  <h2>Profil</h2>
  <div class="profile-pic-container">
    <img id="picPreview" src="">
    <label class="file-label" for="picInput">Lägg till profilbild</label>
    <input type="file" id="picInput" class="file-input" accept="image/*">
  </div>
  <input type="text" id="profileName" placeholder="Namn">
  <input type="number" id="profileWeight" placeholder="Vikt (kg)">
  <select id="profileGender">
    <option value="man">Man</option>
    <option value="kvinna">Kvinna</option>
  </select>
  <h3 style="margin-top:20px; font-family:'Arial Black';">Funzone gräns</h3>
  <input type="number" step="0.1" id="profileFunzone" placeholder="Funzone gräns (‰)">
  <button onclick="saveCurrentProfile()" style="margin-top: 15px;">Spara Lokalt</button>
  <button onclick="logout()" style="margin-top: 15px; background: #E74C3C; color: white;">Logga Ut (Nollställ)</button>
</div>
<div class="card">
  <h2>Historik 24h</h2>
  <p id="historyMeta" style="font-weight: 900; color: #2C3E50;"></p>
  <ul id="history24h"></ul>
</div>
<script src="../../shared/scripts/hash.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../shared/scripts/shared.js"></script>
<script>
let currentProfile = getActiveProfile();
function renderProfileSelect() {
  const select = document.getElementById('profileSelect');
  select.innerHTML = '';
  getProfiles().forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.name;
    if (p.id === currentProfile.id) opt.selected = true;
    select.appendChild(opt);
  });
}
function loadSelectedProfile() {
  const id = document.getElementById('profileSelect').value;
  switchProfile(id);
  currentProfile = getActiveProfile();
  populateForm();
}
function populateForm() {
  if(!currentProfile) return;
  document.getElementById('myHashDisplay').innerText = currentProfile.id;
  document.getElementById('profileName').value = currentProfile.name;
  document.getElementById('profileWeight').value = currentProfile.weight;
  document.getElementById('profileGender').value = currentProfile.gender;
  document.getElementById('profileFunzone').value = currentProfile.funzone;
  const picPreview = document.getElementById('picPreview');
  if (currentProfile.pic) {
    picPreview.src = currentProfile.pic;
    picPreview.style.display = 'block';
  } else {
    picPreview.style.display = 'none';
    picPreview.src = '';
  }
  renderHistory24h();
}
document.getElementById('picInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(event) {
      currentProfile.pic = event.target.result;
      document.getElementById('picPreview').src = currentProfile.pic;
      document.getElementById('picPreview').style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
});
function saveCurrentProfile() {
  currentProfile.name = document.getElementById('profileName').value;
  currentProfile.weight = parseFloat(document.getElementById('profileWeight').value);
  currentProfile.gender = document.getElementById('profileGender').value;
  currentProfile.funzone = parseFloat(document.getElementById('profileFunzone').value);
  saveProfile(currentProfile);
  renderProfileSelect();
  renderHistory24h();
}

function logout() {
  if (confirm("Är du säker på att du vill logga ut? Detta tar bort all lokal data på denna enhet. (Din data finns fortfarande sparad på din Hash i databasen!)")) {
    localStorage.clear();
    window.location.href = '../../register/pages/register.html';
  }
}

function renderHistory24h() {
  const history = getDrinkHistory();
  const list = document.getElementById('history24h');
  const meta = document.getElementById('historyMeta');
  list.innerHTML = '';

  if (!history || history.length === 0) {
    meta.textContent = 'Inga loggade drycker ännu.';
    return;
  }

  const firstTimestamp = history.reduce((min, item) => Math.min(min, item.timestamp), history[0].timestamp);
  const windowEnd = firstTimestamp + (24 * 60 * 60 * 1000);
  const windowItems = history.filter(item => item.timestamp >= firstTimestamp && item.timestamp <= windowEnd);
  const firstDate = new Date(firstTimestamp);
  meta.textContent = `Startdatum: ${firstDate.toLocaleDateString()}`;

  if (windowItems.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#7f8c8d;">Inga drycker i detta 24h-fönster.</p>';
    return;
  }

  windowItems.forEach(item => {
    const li = document.createElement('li');
    const time = new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    li.innerHTML = `<div><strong>${time}</strong>: ${item.name}<br><span style="color:#2C3E50;">${item.grams > 0 ? '+' : ''}${item.grams.toFixed(1)}g alkohol</span></div>`;
    list.appendChild(li);
  });
}
function openProfileByHash() {
  const hash = document.getElementById('hashLookup').value.trim();
  const status = document.getElementById('hashLookupStatus');
  if (!hash) return;
  const profiles = getProfiles();
  let target = profiles.find(p => p.id === hash);
  if (!target) {
    const globalData = getGlobalData();
    target = globalData.persons[hash];
    if (target) {
      saveProfile(target);
    }
  }
  if (target) {
    switchProfile(target.id);
    currentProfile = getActiveProfile();
    renderProfileSelect();
    populateForm();
    status.textContent = `Öppnade profil: ${target.name}`;
  } else {
    status.textContent = 'Hittade ingen profil med den hashen.';
  }
}
renderProfileSelect();
populateForm();
</script>
