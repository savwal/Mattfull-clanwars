<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2C3E50">
<title>redlös - Profil</title>
<link rel="manifest" href="../../../manifest.json">
<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; background-color: #E5E9F0; color: #111; min-height: 100vh; }
nav { display: flex; flex-wrap: wrap; margin-bottom: 20px; border: 4px solid #2C3E50; box-shadow: 4px 4px 0px #2C3E50; background: #fff; }
nav::-webkit-scrollbar { display: none; }
nav a { flex: 1 1 120px; text-align: center; padding: 12px 10px; background: #fff; text-decoration: none; color: #2C3E50; font-weight: 900; text-transform: uppercase; border-right: 4px solid #2C3E50; font-size: 14px; }
nav a:last-child { border-right: none; }
nav a:hover, nav a.active { background: #FFCC00; }
.card { background: #FFFFFF; border: 4px solid #2C3E50; border-radius: 0; padding: 20px; margin-bottom: 20px; box-shadow: 6px 6px 0px #2C3E50; position: relative; }
h2 { font-family: 'Arial Black', sans-serif; text-transform: uppercase; color: #FFF; background: #2A8CFF; margin: -20px -20px 20px -20px; padding: 15px; border-bottom: 4px solid #2C3E50; }
input, select, button { padding: 14px; margin: 8px 0; width: 100%; box-sizing: border-box; border-radius: 0; border: 4px solid #2C3E50; font-size: 16px; outline: none; font-weight: bold; }
input:focus, select:focus { background: #f1f2f6; }
button { background: #FFCC00; color: #2C3E50; cursor: pointer; text-transform: uppercase; font-weight: 900; box-shadow: 4px 4px 0px #2C3E50; transition: all 0.1s; }
button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #2C3E50; }
.profile-pic-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 15px; }
#picPreview { width: 120px; height: 120px; border-radius: 0; border: 4px solid #2C3E50; box-shadow: 4px 4px 0px #2C3E50; display: none; object-fit: cover; }
.hash-text { display: inline-block; background: #2C3E50; color: #FFF; padding: 5px 10px; font-family: monospace; font-size: 1.2em; margin: 10px 0; letter-spacing: 2px; }
.file-input { display: none; }
.file-label { display: inline-block; background: #FFCC00; color: #2C3E50; padding: 10px 12px; border: 4px solid #2C3E50; font-weight: 900; cursor: pointer; box-shadow: 4px 4px 0px #2C3E50; text-transform: uppercase; margin-top: 10px; }
.hash-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.hash-actions input { flex: 1 1 200px; }
</style>
<link rel="stylesheet" href="../../shared/styles/nav.css">
</head>
<body>
<nav>
  <a href="../../../index.html">Log</a>
  <a href="../../battles/pages/battles.html">Battles</a>
  <a href="../../events/pages/events.html">Events</a>
  <a href="../../clans/pages/clans.html">Klan</a>
  <a href="../../friends/pages/friends.html">Vänner</a>
  <a href="../../wrapped/pages/wrapped.html">Wrapped</a>
  <a href="../../profile/pages/profile.html" class="active">Profil</a>
</nav>
<div class="card">
  <h2>Namn</h2>
  <select id="profileSelect" onchange="loadSelectedProfile()"></select>
  <button onclick="window.location.href='../../register/pages/register.html'" style="background: #2ECC71;">Ny Krigare</button>
</div>
<div class="card" style="text-align:center;">
  <h2>Din Hash</h2>
  <div class="hash-text" id="myHashDisplay"></div>
</div>
<div class="card">
  <h2>Öppna profil via hash</h2>
  <div class="hash-actions">
    <input type="text" id="hashLookup" placeholder="Klistra in hash">
    <button onclick="openProfileByHash()" style="width: auto;">Öppna</button>
  </div>
  <p id="hashLookupStatus" style="font-weight: 900; color:#2C3E50;"></p>
</div>
<div class="card">
  <h2>Profil</h2>
  <div class="profile-pic-container">
    <img id="picPreview" src="">
    <label class="file-label" for="picInput">Lägg till profilbild</label>
    <input type="file" id="picInput" class="file-input" accept="image/*">
  </div>
  <input type="text" id="profileName" placeholder="Namn">
  <input type="number" id="profileWeight" placeholder="Vikt (kg)">
  <select id="profileGender">
    <option value="man">Man</option>
    <option value="kvinna">Kvinna</option>
  </select>
  <h3 style="margin-top:20px; font-family:'Arial Black';">Funzone gräns</h3>
  <input type="number" step="0.1" id="profileFunzone" placeholder="Funzone gräns (‰)">
  <button onclick="saveCurrentProfile()" style="margin-top: 15px;">Spara Lokalt</button>
</div>
<script src="../../shared/scripts/hash.js"></script>
<script src="../../shared/scripts/shared.js"></script>
<script>
let currentProfile = getActiveProfile();
function renderProfileSelect() {
  const select = document.getElementById('profileSelect');
  select.innerHTML = '';
  getProfiles().forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.name;
    if (p.id === currentProfile.id) opt.selected = true;
    select.appendChild(opt);
  });
}
function loadSelectedProfile() {
  const id = document.getElementById('profileSelect').value;
  switchProfile(id);
  currentProfile = getActiveProfile();
  populateForm();
}
function populateForm() {
  if(!currentProfile) return;
  document.getElementById('myHashDisplay').innerText = currentProfile.id;
  document.getElementById('profileName').value = currentProfile.name;
  document.getElementById('profileWeight').value = currentProfile.weight;
  document.getElementById('profileGender').value = currentProfile.gender;
  document.getElementById('profileFunzone').value = currentProfile.funzone;
  const picPreview = document.getElementById('picPreview');
  if (currentProfile.pic) {
    picPreview.src = currentProfile.pic;
    picPreview.style.display = 'block';
  } else {
    picPreview.style.display = 'none';
    picPreview.src = '';
  }
}
document.getElementById('picInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(event) {
      currentProfile.pic = event.target.result;
      document.getElementById('picPreview').src = currentProfile.pic;
      document.getElementById('picPreview').style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
});
function saveCurrentProfile() {
  currentProfile.name = document.getElementById('profileName').value;
  currentProfile.weight = parseFloat(document.getElementById('profileWeight').value);
  currentProfile.gender = document.getElementById('profileGender').value;
  currentProfile.funzone = parseFloat(document.getElementById('profileFunzone').value);
  saveProfile(currentProfile);
  renderProfileSelect();
}
function openProfileByHash() {
  const hash = document.getElementById('hashLookup').value.trim();
  const status = document.getElementById('hashLookupStatus');
  if (!hash) return;
  const profiles = getProfiles();
  let target = profiles.find(p => p.id === hash);
  if (!target) {
    const globalData = getGlobalData();
    target = globalData.persons[hash];
    if (target) {
      saveProfile(target);
    }
  }
  if (target) {
    switchProfile(target.id);
    currentProfile = getActiveProfile();
    renderProfileSelect();
    populateForm();
    status.textContent = `Öppnade profil: ${target.name}`;
  } else {
    status.textContent = 'Hittade ingen profil med den hashen.';
  }
}
renderProfileSelect();
populateForm();
</script>
</body>
</html>
