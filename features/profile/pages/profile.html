<script>
let currentProfile = getActiveProfile() || null;

function renderProfileSelect() {
  const select = document.getElementById('profileSelect');
  select.innerHTML = '';
  const activeId = currentProfile ? currentProfile.id : null;
  getProfiles().forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.name;
    if (activeId && p.id === activeId) opt.selected = true;
    select.appendChild(opt);
  });
}

function loadSelectedProfile() {
  const id = document.getElementById('profileSelect').value;
  switchProfile(id);
  currentProfile = getActiveProfile();
  populateForm();
}

function populateForm() {
  currentProfile = getActiveProfile();
  if(!currentProfile) return;
  document.getElementById('myHashDisplay').innerText = currentProfile.id;
  document.getElementById('profileName').value = currentProfile.name;
  document.getElementById('profileWeight').value = currentProfile.weight;
  document.getElementById('profileGender').value = currentProfile.gender;
  document.getElementById('profileFunzone').value = currentProfile.funzone;
  const picPreview = document.getElementById('picPreview');
  if (currentProfile.pic) {
    picPreview.src = currentProfile.pic;
    picPreview.style.display = 'block';
  } else {
    picPreview.style.display = 'none';
    picPreview.src = '';
  }
  // Generate QR code
  generateQRCode(currentProfile.id);
}

document.getElementById('picInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    if (file.size > 1024 * 1024) {
      showToast('Bilden är för stor. Max 1 MB.', { error: true });
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = function(event) {
      currentProfile.pic = event.target.result;
      document.getElementById('picPreview').src = currentProfile.pic;
      document.getElementById('picPreview').style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
});

async function saveCurrentProfile(btn) {
  return runWithButtonLock(btn, function() {
    currentProfile.name = document.getElementById('profileName').value;
    const weightValue = parseFloat(document.getElementById('profileWeight').value);
    if (!Number.isFinite(weightValue) || weightValue <= 0) {
      showToast('Vikten måste vara positiv.', { error: true });
      return;
    }
    currentProfile.weight = weightValue;
    currentProfile.gender = document.getElementById('profileGender').value;
    currentProfile.funzone = parseFloat(document.getElementById('profileFunzone').value);
    saveProfile(currentProfile);
    renderProfileSelect();
    showToast('Profil sparad!');
  });
}

function logout() {
  var lang = window.i18n ? window.i18n.getLang() : 'sv';
  var msg = lang === 'en'
    ? 'Are you sure you want to log out? This removes all local data on this device. (Your data is still saved on your personal code in the database!)'
    : 'Är du säker på att du vill logga ut? Detta tar bort all lokal data på denna enhet. (Din data finns fortfarande sparad på din personliga kod i databasen!)';
  if (confirm(msg)) {
    localStorage.clear();
    window.location.href = '../../register/pages/register.html';
  }
}

async function removeProfilePicture(btn) {
  return runWithButtonLock(btn, async function() {
    if (!currentProfile) return;
    currentProfile.pic = '';
    saveProfile(currentProfile);
    document.getElementById('picPreview').style.display = 'none';
    document.getElementById('picPreview').src = '';
    var lang = window.i18n ? window.i18n.getLang() : 'sv';
    showToast(lang === 'en' ? 'Profile picture removed!' : 'Profilbild borttagen!');
  });
}

async function deleteAccount(btn) {
  var lang = window.i18n ? window.i18n.getLang() : 'sv';
  var confirmed = await showConfirmModal(
    lang === 'en'
      ? 'Are you sure you want to delete your account? All your data will be permanently removed from both this device and the database. This cannot be undone.'
      : 'Är du säker på att du vill radera ditt konto? All din data kommer att tas bort permanent från både denna enhet och databasen. Detta kan inte ångras.',
    {
      title: lang === 'en' ? 'Delete account' : 'Radera konto',
      confirmText: lang === 'en' ? 'Delete' : 'Radera',
      cancelText: lang === 'en' ? 'Cancel' : 'Avbryt'
    }
  );
  if (!confirmed) return;
  return runWithButtonLock(btn, async function() {
    var profileId = currentProfile ? currentProfile.id : null;
    if (profileId) {
      await deleteAccountFromSupabase(profileId);
    }
    localStorage.clear();
    window.location.href = '../../register/pages/register.html';
  });
}

// ---------------------------------------------------------------------------
// QR Code Generation
// ---------------------------------------------------------------------------
function generateQRCode(hash) {
  if (!hash || typeof qrcode === 'undefined') return;
  var canvas = document.getElementById('qrCanvas');
  if (!canvas) return;
  var qr = qrcode(0, 'M');
  qr.addData(hash);
  qr.make();
  var ctx = canvas.getContext('2d');
  var size = 160;
  var cellSize = size / qr.getModuleCount();
  ctx.clearRect(0, 0, size, size);
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#2C3E50';
  for (var row = 0; row < qr.getModuleCount(); row++) {
    for (var col = 0; col < qr.getModuleCount(); col++) {
      if (qr.isDark(row, col)) {
        ctx.fillRect(col * cellSize, row * cellSize, cellSize + 0.5, cellSize + 0.5);
      }
    }
  }
}

// ---------------------------------------------------------------------------
// QR Code Scanner
// ---------------------------------------------------------------------------
function openQRScanner() {
  var lang = window.i18n ? window.i18n.getLang() : 'sv';
  var overlay = document.createElement('div');
  overlay.className = 'modal';
  overlay.style.cssText = 'display:block;position:fixed;top:0;left:0;width:100%;height:100%;overflow:auto;background-color:rgba(0,0,0,0);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:6000;transition:background-color 200ms ease-out;';
  requestAnimationFrame(function() { overlay.style.backgroundColor = 'rgba(0,0,0,0.5)'; });

  var content = document.createElement('div');
  content.className = 'modal-content card';
  content.style.cssText = 'box-sizing:border-box;width:min(92vw,400px);max-width:92vw;margin:clamp(24px,8vh,80px) auto;background:#FFFFFF;color:#2C3E50;border:1px solid rgba(44,62,80,0.12);border-radius:16px;box-shadow:0 8px 32px rgba(44,62,80,0.18);padding:0;text-align:center;position:relative;opacity:0;transform:translateY(12px) scale(0.97);transition:opacity 200ms ease-out,transform 200ms ease-out;';
  requestAnimationFrame(function() { requestAnimationFrame(function() { content.style.opacity = '1'; content.style.transform = 'translateY(0) scale(1)'; }); });

  var header = document.createElement('h2');
  header.textContent = lang === 'en' ? 'Scan QR Code' : 'Skanna QR-kod';
  header.style.cssText = "font-family:'Arial Black',sans-serif;text-transform:uppercase;color:#FFF;background:#2A8CFF;margin:0;padding:15px 52px 15px 15px;border-bottom:1px solid rgba(255,255,255,0.15);text-align:left;border-radius:16px 16px 0 0;";

  var closeBtn = document.createElement('span');
  closeBtn.className = 'close-modal';
  closeBtn.innerHTML = '&times;';
  closeBtn.style.cssText = 'color:#FFF;font-size:28px;font-weight:bold;cursor:pointer;position:absolute;right:15px;top:10px;line-height:1;z-index:1;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;';

  var body = document.createElement('div');
  body.style.cssText = 'padding:20px;';

  var desc = document.createElement('p');
  desc.textContent = lang === 'en' ? "Point the camera at a friend's QR code to add them." : 'Rikta kameran mot en väns QR-kod för att lägga till dem.';
  desc.style.cssText = 'font-weight:600;color:#5a6570;margin:0 0 16px 0;font-size:14px;';

  var video = document.createElement('video');
  video.setAttribute('playsinline', '');
  video.setAttribute('autoplay', '');
  video.style.cssText = 'width:100%;max-height:300px;border-radius:12px;background:#000;';

  var statusEl = document.createElement('p');
  statusEl.style.cssText = 'font-weight:700;margin:12px 0 0 0;min-height:20px;';

  body.appendChild(desc);
  body.appendChild(video);
  body.appendChild(statusEl);
  content.appendChild(header);
  content.appendChild(closeBtn);
  content.appendChild(body);
  overlay.appendChild(content);
  document.body.appendChild(overlay);

  var stream = null;
  var scanning = true;
  var scanCanvas = document.createElement('canvas');
  var scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });

  function cleanup() {
    scanning = false;
    if (stream) {
      stream.getTracks().forEach(function(t) { t.stop(); });
      stream = null;
    }
    content.style.opacity = '0';
    content.style.transform = 'translateY(8px) scale(0.97)';
    overlay.style.backgroundColor = 'rgba(0,0,0,0)';
    setTimeout(function() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 180);
  }

  closeBtn.addEventListener('click', cleanup);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) cleanup(); });

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function(s) {
    stream = s;
    video.srcObject = stream;
    video.play();
    requestAnimationFrame(scanFrame);
  }).catch(function() {
    statusEl.textContent = lang === 'en' ? 'Could not access the camera.' : 'Kunde inte komma åt kameran.';
    statusEl.style.color = '#E74C3C';
  });

  function scanFrame() {
    if (!scanning) return;
    if (video.readyState !== video.HAVE_ENOUGH_DATA) {
      requestAnimationFrame(scanFrame);
      return;
    }
    scanCanvas.width = video.videoWidth;
    scanCanvas.height = video.videoHeight;
    scanCtx.drawImage(video, 0, 0);
    var imageData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);

    var code = null;
    // Try BarcodeDetector first (Chrome/Edge)
    if (typeof BarcodeDetector !== 'undefined') {
      new BarcodeDetector({ formats: ['qr_code'] }).detect(video).then(function(barcodes) {
        if (barcodes.length > 0 && scanning) {
          handleScannedCode(barcodes[0].rawValue, cleanup, statusEl, lang);
        }
      }).catch(function() {});
    }
    // jsQR fallback
    if (typeof jsQR !== 'undefined') {
      code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
      if (code && code.data && scanning) {
        handleScannedCode(code.data, cleanup, statusEl, lang);
        return;
      }
    }
    requestAnimationFrame(scanFrame);
  }
}

async function handleScannedCode(hash, cleanup, statusEl, lang) {
  if (!hash || !sb) return;
  statusEl.textContent = lang === 'en' ? 'Looking up profile...' : 'Söker profil...';

  var profile = await fetchProfileFromSupabase(hash);
  if (!profile) {
    statusEl.textContent = lang === 'en' ? 'Profile not found.' : 'Profilen hittades inte.';
    statusEl.style.color = '#E74C3C';
    return;
  }

  // Check if already a friend
  var myProfile = getActiveProfile();
  if (myProfile && myProfile.id === hash) {
    statusEl.textContent = lang === 'en' ? "That's your own code!" : 'Det är din egen kod!';
    statusEl.style.color = '#E74C3C';
    return;
  }

  var confirmMsg = (lang === 'en' ? 'Do you want to add ' : 'Vill du lägga till ') + profile.name + '?';
  var confirmed = await showConfirmModal(confirmMsg, {
    title: lang === 'en' ? 'Friend found!' : 'Vän hittad!',
    confirmText: lang === 'en' ? 'Add' : 'Lägg till',
    cancelText: lang === 'en' ? 'Cancel' : 'Avbryt'
  });

  if (!confirmed) return;

  // Add friend via Supabase
  var myId = myProfile ? myProfile.id : null;
  if (!myId) return;

  var { error } = await sb.from('friends').upsert(
    { player_hash: myId, friend_hash: hash },
    { onConflict: 'player_hash,friend_hash' }
  );

  if (error) {
    statusEl.textContent = lang === 'en' ? 'Error adding friend.' : 'Kunde inte lägga till vän.';
    statusEl.style.color = '#E74C3C';
    return;
  }

  showToast(lang === 'en' ? 'Friend added!' : 'Vän tillagd!');
  cleanup();
}

  contactText.setAttribute('data-settings-label', 'contact');

  var cookieText = document.createElement('p');

    content.style.opacity = '0';

    setTimeout(function() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 180);
  }
  closeBtn.addEventListener('click', cleanupSettings);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) cleanupSettings(); });
}

function updateSettingsSectionTitles(body, lang) {
  var labels = body.querySelectorAll('[data-settings-label]');
  var map = {
    theme: { sv: 'Tema', en: 'Theme' },
    account: { sv: 'Konto', en: 'Account' },
    gdpr: { sv: 'Dataskydd & GDPR', en: 'Data Protection & GDPR' },
    removepic: { sv: '🖼️ Ta bort profilbild', en: '🖼️ Remove profile picture' },
    logout: { sv: '🚪 Logga ut', en: '🚪 Log out' },
    delete: { sv: '🗑️ Radera konto', en: '🗑️ Delete account' },
    gdprtext: { sv: 'All din data hanteras enligt svensk GDPR-lagstiftning. Du kan radera ditt konto och all data när som helst.', en: 'All your data is handled according to Swedish GDPR legislation. You can delete your account and all data at any time.' }
  };
  for (var i = 0; i < labels.length; i++) {
    var key = labels[i].getAttribute('data-settings-label');
    if (map[key]) {
      if (key === 'contact') {
        labels[i].innerHTML = (lang === 'en' ? 'For questions, contact us at ' : 'Vid frågor, kontakta oss på ') + '<a href="mailto:redls@redls.se" style="color:#2A8CFF;">redls@redls.se</a>';
      } else {
        labels[i].innerHTML = map[key][lang] || map[key]['sv'];
      }
    }
  }
  // Update theme button labels
  var themeBtns = body.querySelectorAll('.settings-toggle-row')[1];
  if (themeBtns) {
    var btns = themeBtns.querySelectorAll('.settings-toggle-btn');
    if (btns[0]) btns[0].textContent = '☀️ ' + (lang === 'en' ? 'Light' : 'Ljust');
    if (btns[1]) btns[1].textContent = '🌙 ' + (lang === 'en' ? 'Dark' : 'Mörkt');
  }
}
