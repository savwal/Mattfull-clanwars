<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plupfull - Battles</title>
<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; background-color: #E5E9F0; color: #111; min-height: 100vh; }
nav { display: flex; flex-wrap: wrap; margin-bottom: 20px; border: 4px solid #2C3E50; box-shadow: 4px 4px 0px #2C3E50; background: #fff; }
nav::-webkit-scrollbar { display: none; }
nav a { flex: 1 1 120px; text-align: center; padding: 12px 10px; background: #fff; text-decoration: none; color: #2C3E50; font-weight: 900; text-transform: uppercase; border-right: 4px solid #2C3E50; font-size: 14px; }
nav a:last-child { border-right: none; }
nav a:hover, nav a.active { background: #FFCC00; }
.card { background: #FFFFFF; border: 4px solid #2C3E50; border-radius: 0; padding: 20px; margin-bottom: 20px; box-shadow: 6px 6px 0px #2C3E50; position: relative; }
h2 { font-family: 'Arial Black', sans-serif; text-transform: uppercase; color: #FFF; background: #E74C3C; margin: -20px -20px 20px -20px; padding: 15px; border-bottom: 4px solid #2C3E50; }
.logger-tile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; background-color: #D1EAFE; padding: 20px; border: 4px solid #2C3E50; box-shadow: 4px 4px 0px #2C3E50; }
.logger-tile { border: 4px solid #2C3E50; background: #FFF; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: space-around; cursor: pointer; color: #2C3E50; font-weight: bold; text-align: center; box-shadow: 4px 4px 0px #2C3E50; min-height: 80px;}
.logger-tile:last-child:nth-child(odd) { grid-column: span 2; }
.logger-text { font-size: 1.1em; font-weight: 800; text-transform: uppercase; }
.modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
.modal-content { background-color: #2A8CFF; color: white; margin: 30% auto; padding: 25px; border: 6px solid #2C3E50; box-shadow: 8px 8px 0px #2C3E50; border-radius: 0; width: 90%; max-width: 400px; text-align: center; position: relative; }
.close-modal { color: #E74C3C; font-size: 32px; font-weight: bold; cursor: pointer; position: absolute; right: 15px; top: 10px; }
input, button { padding: 14px; margin: 8px 0; width: 100%; box-sizing: border-box; border: 4px solid #2C3E50; font-size: 16px; outline: none; font-weight: bold; }
button { background: #FFCC00; color: #2C3E50; cursor: pointer; text-transform: uppercase; font-weight: 900; box-shadow: 4px 4px 0px #2C3E50; transition: all 0.1s; }
button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #2C3E50; }
</style>
</head>
<body>
<nav>
  <a href="index.html">Log</a>
  <a href="battles.html" class="active">Battles</a>
  <a href="events.html">Events</a>
  <a href="clans.html">Klan</a>
  <a href="friends.html">Vänner</a>
  <a href="wrapped.html">Wrapped</a>
  <a href="profile.html">Profil</a>
</nav>
<div class="card">
  <h2>Välj Strid</h2>
  <div class="logger-tile-grid">
    <div class="logger-tile" onclick="openBattleModal('Solo Battle')">
      <span class="logger-text">Solo Battle</span>
    </div>
    <div class="logger-tile" onclick="openBattleModal('Duos Battle')">
      <span class="logger-text">Duos Battle</span>
    </div>
    <div class="logger-tile" onclick="openBattleModal('Custom Battle Royale')">
      <span class="logger-text">Custom Battle Royale</span>
    </div>
  </div>
</div>
<div id="battleModal" class="modal">
  <div class="modal-content card">
    <span class="close-modal" onclick="closeBattleModal()">&times;</span>
    <h2 id="modalTitle" style="font-family: 'Arial Black'; color: #FFF; background: #2C3E50; margin: -25px -25px 20px -25px; padding: 15px; border-bottom: 4px solid #0984E3;"></h2>
    <div id="battleFields"></div>
    <button onclick="startBattle()">Starta</button>
  </div>
</div>
<script src="hash.js"></script>
<script src="shared.js"></script>
<script>
let currentMode = '';
function openBattleModal(title) {
  currentMode = title;
  document.getElementById('modalTitle').innerText = title;
  renderBattleFields(title);
  document.getElementById('battleModal').style.display = 'block';
}
function renderBattleFields(title) {
  const container = document.getElementById('battleFields');
  container.innerHTML = '';
  if (title === 'Duos Battle') {
    container.appendChild(createBattleInput('teammateHash', 'Teammate hash'));
    container.appendChild(createBattleInput('opponentHash1', 'Motstandare hash 1'));
    container.appendChild(createBattleInput('opponentHash2', 'Motstandare hash 2'));
  } else if (title === 'Custom Battle Royale') {
    const info = document.createElement('p');
    info.style.margin = '10px 0 0 0';
    info.style.fontWeight = 'bold';
    info.innerText = 'Inga hash behovs for denna battle.';
    container.appendChild(info);
  } else {
    container.appendChild(createBattleInput('opponentHash', 'Ange person hash'));
  }
}
function createBattleInput(id, placeholder) {
  const input = document.createElement('input');
  input.type = 'text';
  input.id = id;
  input.placeholder = placeholder;
  return input;
}
function closeBattleModal() {
  document.getElementById('battleModal').style.display = 'none';
}
function startBattle() {
  let globalData = getGlobalData();
  if (currentMode === 'Custom Battle Royale') {
    closeBattleModal();
    return;
  }
  if (currentMode === 'Duos Battle') {
    const teammateHash = document.getElementById('teammateHash').value.trim();
    const opponentHash1 = document.getElementById('opponentHash1').value.trim();
    const opponentHash2 = document.getElementById('opponentHash2').value.trim();
    if (!teammateHash || !opponentHash1 || !opponentHash2) return;
    if (globalData.persons[teammateHash] && globalData.persons[opponentHash1] && globalData.persons[opponentHash2]) {
      closeBattleModal();
    } else {
      alert('Hittade inte alla hashkoder.');
    }
    return;
  }
  const opponentHash = document.getElementById('opponentHash').value.trim();
  if (!opponentHash) return;
  if (globalData.persons[opponentHash]) {
    closeBattleModal();
  } else {
    alert('Hittade inte hashkoden.');
  }
}
</script>
</body>
</html>
