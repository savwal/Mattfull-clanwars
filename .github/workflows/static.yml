# Deploy static content to GitHub Pages via Vite build
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # Record a build version with each deploy. Derived from the run number and
      # commit SHA, so it is branch-agnostic and keeps working after a merge to
      # main. Written into the built site as dist/version.json.
      - name: Stamp build version
        run: |
          VERSION="${{ github.run_number }}-$(echo "$GITHUB_SHA" | cut -c1-7)"
          printf '{"version":"%s","commit":"%s","ref":"%s","builtAt":"%s"}\n' \
            "$VERSION" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > dist/version.json
          echo "Build version: $VERSION"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
