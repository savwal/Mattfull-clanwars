<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil - Måttfull</title>
<style>
body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 15px; background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); color: #2d3436; min-height: 100vh; }
nav { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
nav a { padding: 12px 20px; background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(5px); text-decoration: none; color: #2d3436; border-radius: 12px; font-weight: bold; transition: background 0.3s; }
nav a:hover { background: rgba(255, 255, 255, 0.6); }
.card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); }
input, select, button { padding: 14px; margin: 8px 0; width: 100%; box-sizing: border-box; border-radius: 10px; border: 1px solid #dcdde1; font-size: 16px; outline: none; }
button { background: linear-gradient(135deg, #0984e3, #74b9ff); color: white; border: none; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(9, 132, 227, 0.3); }
.profile-pic-container { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 15px; }
#picPreview { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid #0984e3; display: none; }
</style>
</head>
<body>

<nav>
  <a href="index.html">Main</a>
  <a href="profile.html">Profil</a>
  <a href="rankings.html">Rankings</a>
</nav>

<div class="card">
  <h2>Välj eller Skapa Profil</h2>
  <select id="profileSelect" onchange="loadSelectedProfile()"></select>
  <button onclick="createNewProfile()" style="background: linear-gradient(135deg, #00b894, #55efc4);">Skapa Ny Profil</button>
</div>

<div class="card">
  <h2>Redigera Profil</h2>
  
  <div class="profile-pic-container">
    <img id="picPreview" src="">
    <input type="file" id="picInput" accept="image/*">
  </div>

  <input type="text" id="profileName" placeholder="Namn">
  <input type="number" id="profileWeight" placeholder="Vikt (kg)">
  <select id="profileGender">
    <option value="man">Man</option>
    <option value="kvinna">Kvinna</option>
  </select>
  
  <h3>Dina Zoner</h3>
  <input type="number" step="0.1" id="profileFunzone" placeholder="Funzone gräns (‰, t.ex. 1.0)">
  
  <button onclick="saveCurrentProfile()">Spara Profil</button>
</div>

<script src="shared.js"></script>
<script>
let currentProfile = getActiveProfile();

function renderProfileSelect() {
  const select = document.getElementById('profileSelect');
  select.innerHTML = '';
  getProfiles().forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.name;
    if (p.id === currentProfile.id) opt.selected = true;
    select.appendChild(opt);
  });
}

function loadSelectedProfile() {
  const id = document.getElementById('profileSelect').value;
  switchProfile(id);
  currentProfile = getActiveProfile();
  populateForm();
}

function createNewProfile() {
  const newProfile = { id: Date.now().toString(), name: 'Ny Profil', weight: 70, gender: 'man', funzone: 1.0, pic: '' };
  saveProfile(newProfile);
  renderProfileSelect();
  loadSelectedProfile();
}

function populateForm() {
  document.getElementById('profileName').value = currentProfile.name;
  document.getElementById('profileWeight').value = currentProfile.weight;
  document.getElementById('profileGender').value = currentProfile.gender;
  document.getElementById('profileFunzone').value = currentProfile.funzone;
  
  const picPreview = document.getElementById('picPreview');
  if (currentProfile.pic) {
    picPreview.src = currentProfile.pic;
    picPreview.style.display = 'block';
  } else {
    picPreview.style.display = 'none';
    picPreview.src = '';
  }
}

document.getElementById('picInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(event) {
      currentProfile.pic = event.target.result;
      document.getElementById('picPreview').src = currentProfile.pic;
      document.getElementById('picPreview').style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
});

function saveCurrentProfile() {
  currentProfile.name = document.getElementById('profileName').value;
  currentProfile.weight = parseFloat(document.getElementById('profileWeight').value);
  currentProfile.gender = document.getElementById('profileGender').value;
  currentProfile.funzone = parseFloat(document.getElementById('profileFunzone').value);
  
  saveProfile(currentProfile);
  renderProfileSelect();
  alert("Profil sparad!");
}

renderProfileSelect();
populateForm();
</script>
</body>
</html>
