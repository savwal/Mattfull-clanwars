<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil - Måttfull</title>
<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; background-color: #E5E9F0; color: #111; min-height: 100vh; }
nav { display: flex; gap: 0; margin-bottom: 20px; border: 4px solid #2C3E50; box-shadow: 4px 4px 0px #2C3E50; background: #fff; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
nav::-webkit-scrollbar { display: none; }
nav a { flex: 0 0 auto; text-align: center; padding: 12px 20px; background: #fff; text-decoration: none; color: #2C3E50; font-weight: 900; text-transform: uppercase; border-right: 4px solid #2C3E50; font-size: 14px; }
nav a:last-child { border-right: none; }
nav a:hover, nav a.active { background: #FFCC00; }
.card { background: #FFFFFF; border: 4px solid #2C3E50; border-radius: 0; padding: 20px; margin-bottom: 20px; box-shadow: 6px 6px 0px #2C3E50; position: relative; }
h2 { font-family: 'Arial Black', Impact, sans-serif; text-transform: uppercase; color: #FFF; background: #2A8CFF; margin: -20px -20px 20px -20px; padding: 15px; border-bottom: 4px solid #2C3E50; letter-spacing: 1px; text-shadow: 2px 2px 0px #2C3E50; }
input, select, button { padding: 14px; margin: 8px 0; width: 100%; box-sizing: border-box; border-radius: 0; border: 4px solid #2C3E50; font-size: 16px; outline: none; font-weight: bold; }
input:focus, select:focus { background: #f1f2f6; }
button { background: #FFCC00; color: #2C3E50; cursor: pointer; text-transform: uppercase; font-weight: 900; box-shadow: 4px 4px 0px #2C3E50; transition: all 0.1s; }
button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #2C3E50; }
.profile-pic-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 15px; }
#picPreview { width: 120px; height: 120px; border-radius: 0; border: 4px solid #2C3E50; box-shadow: 4px 4px 0px #2C3E50; display: none; object-fit: cover; }
</style>
</head>
<body>

<nav>
  <a href="index.html">Krog</a>
  <a href="battles.html">Battles</a>
  <a href="clans.html">Klan</a>
  <a href="friends.html">Vänner</a>
  <a href="profile.html" class="active">Profil</a>
  <a href="rankings.html">Ranked</a>
</nav>

<div class="card">
  <h2>Lokal Krigare</h2>
  <select id="profileSelect" onchange="loadSelectedProfile()"></select>
  <button onclick="createNewProfile()" style="background: #2ECC71;">Ny Krigare</button>
</div>

<div class="card">
  <h2>Utrustning</h2>
  <div class="profile-pic-container">
    <img id="picPreview" src="">
    <input type="file" id="picInput" accept="image/*" style="font-size: 12px; padding: 8px;">
  </div>
  <input type="text" id="profileName" placeholder="Namn">
  <input type="number" id="profileWeight" placeholder="Vikt (kg)">
  <select id="profileGender">
    <option value="man">Man</option>
    <option value="kvinna">Kvinna</option>
  </select>
  <h3 style="margin-top:20px; font-family:'Arial Black';">Dina Zoner</h3>
  <input type="number" step="0.1" id="profileFunzone" placeholder="Funzone gräns (‰)">
  <button onclick="saveCurrentProfile()" style="margin-top: 15px;">Spara Lokalt</button>
</div>

<script src="shared.js"></script>
<script>
let currentProfile = getActiveProfile();

function renderProfileSelect() {
  const select = document.getElementById('profileSelect');
  select.innerHTML = '';
  getProfiles().forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.name;
    if (p.id === currentProfile.id) opt.selected = true;
    select.appendChild(opt);
  });
}

function loadSelectedProfile() {
  const id = document.getElementById('profileSelect').value;
  switchProfile(id);
  currentProfile = getActiveProfile();
  populateForm();
}

function createNewProfile() {
  const newProfile = { id: Date.now().toString(), name: 'Ny Krigare', weight: 70, gender: 'man', funzone: 1.0, pic: '' };
  saveProfile(newProfile);
  renderProfileSelect();
  loadSelectedProfile();
}

function populateForm() {
  document.getElementById('profileName').value = currentProfile.name;
  document.getElementById('profileWeight').value = currentProfile.weight;
  document.getElementById('profileGender').value = currentProfile.gender;
  document.getElementById('profileFunzone').value = currentProfile.funzone;
  const picPreview = document.getElementById('picPreview');
  if (currentProfile.pic) {
    picPreview.src = currentProfile.pic;
    picPreview.style.display = 'block';
  } else {
    picPreview.style.display = 'none';
    picPreview.src = '';
  }
}

document.getElementById('picInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(event) {
      currentProfile.pic = event.target.result;
      document.getElementById('picPreview').src = currentProfile.pic;
      document.getElementById('picPreview').style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
});

function saveCurrentProfile() {
  currentProfile.name = document.getElementById('profileName').value;
  currentProfile.weight = parseFloat(document.getElementById('profileWeight').value);
  currentProfile.gender = document.getElementById('profileGender').value;
  currentProfile.funzone = parseFloat(document.getElementById('profileFunzone').value);
  saveProfile(currentProfile);
  renderProfileSelect();
  alert("Sparad lokalt!");
}

renderProfileSelect();
populateForm();
</script>
</body>
</html>
